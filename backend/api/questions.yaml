              number: 1
              question: Do we trim passwords on the server as well?
              options: |-
                - A: trim nowhere: a password is sent and stored as typed.
                - B: trim on both ends, and say so at sign-up.
              options_html: "<ul>\n<li>A: trim nowhere: a password is sent and stored as typed.</li>\n<li>B: trim on both ends, and say so at sign-up.</li>\n</ul>"
              recommendation: 'A: a space is a character like any other; trimming would lock out who chose one.'
