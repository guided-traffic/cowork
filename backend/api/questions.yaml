# Open questions on a ticket (docs/adr/0011 D2, docs/adr/0066 D8).
questions:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listQuestions
    tags: [questions]
    summary: The ticket's questions by number
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of questions
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/QuestionList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  post:
    operationId: askQuestion
    tags: [questions]
    summary: Ask a question on the ticket
    description: |
      A member's act with `write` scope, in the agent baseline (docs/adr/0043 D2). The person
      asked must be a member who can see the ticket; without one the question is open in the
      team.
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/QuestionCreate'
          example:
            question: Do we trim passwords on the server as well?
            options: |-
              - A: trim nowhere: a password is sent and stored as typed.
              - B: trim on both ends, and say so at sign-up.
            recommendation: 'A: a space is a character like any other; trimming would lock out who chose one.'
            asked_of: 019cadb4-4b00-7719-ade7-c2d450e9b5f3
    responses:
      '201':
        description: The new question
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
          Location:
            $ref: './components/headers.yaml#/Location'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Question'
      default:
        $ref: './components/responses.yaml#/Problem'
question:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/QuestionNumber'
  get:
    operationId: getQuestion
    tags: [questions]
    summary: One question
    responses:
      '200':
        description: The question
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Question'
      default:
        $ref: './components/responses.yaml#/Problem'
  patch:
    operationId: updateQuestion
    tags: [questions]
    summary: Edit an open question
    description: The asker's act, agents included, while the question is open; `If-Match` required.
    parameters:
      - $ref: './components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/QuestionPatch'
          example:
            recommendation: 'A: a space is a character like any other; trimming would lock out who chose one.'
    responses:
      '200':
        description: The question
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Question'
      default:
        $ref: './components/responses.yaml#/Problem'
questionAnswer:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/QuestionNumber'
  put:
    operationId: answerQuestion
    tags: [questions]
    summary: Answer a question, or change one's answer
    description: |
      Only a person decides an answer (docs/adr/0011 D2): the person asked, or any member when
      the question is open in the team; a person changes their own answer. An agent-marked
      request needs `record-answer` and writes its person's answer down, marked as recorded by
      an agent, and changes only an answer an agent of the same person recorded
      (docs/adr/0066 D8). `If-Match` once the question is answered.
    parameters:
      - $ref: './components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/AnswerSet'
          example:
            answer: 'A: we keep the password as typed, and the form says that a space counts.'
    responses:
      '200':
        description: The answered question
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Question'
            example:
              id: 01a10c8f-99a0-7cd1-bb0b-c187d4e41c04
              number: 1
              question: Do we trim passwords on the server as well?
              options: |-
                - A: trim nowhere: a password is sent and stored as typed.
                - B: trim on both ends, and say so at sign-up.
              options_html: "<ul>\n<li>A: trim nowhere: a password is sent and stored as typed.</li>\n<li>B: trim on both ends, and say so at sign-up.</li>\n</ul>"
              recommendation: 'A: a space is a character like any other; trimming would lock out who chose one.'
              answer: 'A: we keep the password as typed, and the form says that a space counts.'
              answer_html: '<p>A: we keep the password as typed, and the form says that a space counts.</p>'
              status: answered
              asked_by: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
              asked_by_agent: null
              asked_by_token: null
              asked_of: {id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3, username: ada, display_name: Ada Lovelace}
              answered_by: {id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3, username: ada, display_name: Ada Lovelace}
              answered_at: '2026-10-06T08:52:00Z'
              recorded_by_agent: false
              answered_by_token: null
              withdrawn_at: null
              version: 2
              created_at: '2026-10-05T14:55:00Z'
              updated_at: '2026-10-06T08:52:00Z'
      default:
        $ref: './components/responses.yaml#/Problem'
questionWithdrawal:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/QuestionNumber'
  put:
    operationId: withdrawQuestion
    tags: [questions]
    summary: Withdraw an open question
    description: The asker's act; an agent withdraws only a question an agent of the same person asked. Idempotent.
    responses:
      '200':
        description: The withdrawn question
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
