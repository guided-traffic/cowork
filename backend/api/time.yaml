# Time booked by people against tickets (docs/adr/0017 D6–D10). Who sees
# whose time is docs/adr/0034 D5; agents never book (docs/adr/0043 D3).
ticketTime:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listTicketTime
    tags: [time]
    summary: The ticket's time entries the caller may see, and their sum
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of entries with the ticket's visible total
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntryList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  post:
    operationId: bookTime
    tags: [time]
    summary: Book the caller's own time on the ticket
    description: |
      A member's act with `write` scope; never an agent's (docs/adr/0017 D6). A day on or before
      the tenant's time_locked_until is 409 `period_locked` (D8).
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/TimeEntryCreate'
          example:
            minutes: 90
            day: '2026-10-05'
            note: Reproduced in Safari 18 and traced the trimmed field
    responses:
      '201':
        description: The new entry
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
          Location:
            $ref: './components/headers.yaml#/Location'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntry'
      default:
        $ref: './components/responses.yaml#/Problem'
timeEntry:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/TimeEntryID'
  get:
    operationId: getTimeEntry
    tags: [time]
    summary: One time entry
    responses:
      '200':
        description: The entry
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntry'
      default:
        $ref: './components/responses.yaml#/Problem'
  patch:
    operationId: editTimeEntry
    tags: [time]
    summary: Correct a time entry
    description: The author's act; the previous values are kept (docs/adr/0017 D7); the old and the new day are checked against the lock.
    parameters:
      - $ref: './components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/TimeEntryPatch'
          example:
            minutes: 45
            note: Listed the reasons the sign-in records
    responses:
      '200':
        description: The entry
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntry'
            example:
              id: 01a111f6-0be0-7944-856c-23487b30768e
              ticket: acme/WEB-39
              person: {id: 019e165f-39c0-7937-931a-d0fa7735df32, username: sam, display_name: Sam Rivera}
              author: {id: 019e165f-39c0-7937-931a-d0fa7735df32, username: sam, display_name: Sam Rivera}
              token: null
              minutes: 45
              day: '2026-10-06'
              note: Listed the reasons the sign-in records
              voided: false
              voided_at: null
              edited: true
              version: 2
              created_at: '2026-10-06T16:05:00Z'
              updated_at: '2026-10-06T16:30:00Z'
      default:
        $ref: './components/responses.yaml#/Problem'
timeEntryVoid:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/TimeEntryID'
  put:
    operationId: voidTimeEntry
    tags: [time]
    summary: Void a time entry
    description: The author's act; kept, excluded from every sum (docs/adr/0017 D7). Idempotent.
    responses:
      '200':
        description: The voided entry
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntry'
            example:
              id: 01a10d1d-81c0-77f6-82f0-6d35a8aef0d0
              ticket: acme/WEB-42
              person: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
              author: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
              token: null
              minutes: 90
              day: '2026-10-05'
              note: Reproduced in Safari 18 and traced the trimmed field
              voided: true
              voided_at: '2026-10-06T09:10:00Z'
              edited: false
              version: 2
              created_at: '2026-10-05T17:30:00Z'
              updated_at: '2026-10-06T09:10:00Z'
      default:
        $ref: './components/responses.yaml#/Problem'
timeEntryRevisions:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/TimeEntryID'
  get:
    operationId: listTimeEntryRevisions
    tags: [time]
    summary: A time entry's previous values, oldest first
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of previous values
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntryRevisionList'
      default:
        $ref: './components/responses.yaml#/Problem'
tenantTime:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  get:
    operationId: listTenantTime
    tags: [time]
    summary: The tenant's time entries the caller may see, newest first
    description: |
      A table (docs/adr/0048 D2): cursor pages, or numbered pages with a total. `Accept:
      text/csv` returns the page as CSV, every cell that could start a formula prefixed with an
      apostrophe.
    parameters:
      - $ref: './components/parameters.yaml#/FromDay'
      - $ref: './components/parameters.yaml#/ToDay'
      - $ref: './components/parameters.yaml#/TimeProject'
      - $ref: './components/parameters.yaml#/TimeTicket'
      - $ref: './components/parameters.yaml#/TimePerson'
      - $ref: './components/parameters.yaml#/IncludeVoided'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/Page'
      - $ref: './components/parameters.yaml#/PerPage'
    responses:
      '200':
        description: A page of entries
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeEntryList'
            # The tenant's list answers no total_minutes, which the schema's example, a ticket's, shows.
            example:
              items:
                - id: 01a111f6-0be0-7944-856c-23487b30768e
                  ticket: acme/WEB-39
                  person: {id: 019e165f-39c0-7937-931a-d0fa7735df32, username: sam, display_name: Sam Rivera}
                  author: {id: 019e165f-39c0-7937-931a-d0fa7735df32, username: sam, display_name: Sam Rivera}
                  token: null
                  minutes: 45
                  day: '2026-10-06'
                  note: Listed the reasons the sign-in records
                  voided: false
                  voided_at: null
                  edited: true
                  version: 2
                  created_at: '2026-10-06T16:05:00Z'
                  updated_at: '2026-10-06T16:30:00Z'
                - id: 01a10d1d-81c0-77f6-82f0-6d35a8aef0d0
                  ticket: acme/WEB-42
                  person: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
                  author: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
                  token: null
                  minutes: 90
                  day: '2026-10-05'
                  note: Reproduced in Safari 18 and traced the trimmed field
                  voided: false
                  voided_at: null
                  edited: false
                  version: 1
                  created_at: '2026-10-05T17:30:00Z'
                  updated_at: '2026-10-05T17:30:00Z'
              next_cursor: null
          text/csv:
            schema:
              type: string
            example: |
              id,ticket,day,minutes,person_id,person,note,voided_at,created_at
              01a111f6-0be0-7944-856c-23487b30768e,acme/WEB-39,2026-10-06,45,019e165f-39c0-7937-931a-d0fa7735df32,Sam Rivera,Listed the reasons the sign-in records,,2026-10-06T16:05:00Z
              01a10d1d-81c0-77f6-82f0-6d35a8aef0d0,acme/WEB-42,2026-10-05,90,019cb855-3d80-7d3c-a80d-97fa1e50d59e,Grace Hopper,Reproduced in Safari 18 and traced the trimmed field,,2026-10-05T17:30:00Z
      default:
        $ref: './components/responses.yaml#/Problem'
timeReport:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  get:
    operationId: timeReport
    tags: [time]
    summary: Minutes summed per ticket, project, person or for the tenant over a period
    description: 'The visible, not voided entries (docs/adr/0017 D10); `Accept: text/csv` for CSV.'
    parameters:
      - $ref: './components/parameters.yaml#/FromDay'
      - $ref: './components/parameters.yaml#/ToDay'
      - $ref: './components/parameters.yaml#/TimeProject'
      - $ref: './components/parameters.yaml#/TimePerson'
      - $ref: './components/parameters.yaml#/GroupBy'
    responses:
      '200':
        description: The sums
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TimeReport'
          text/csv:
            schema:
              type: string
            example: |
              ticket,label,minutes
              acme/WEB-39,Log the sign-in failures with their reason,45
              acme/WEB-42,Sign-in fails in Safari when the password contains a space,90
      default:
        $ref: './components/responses.yaml#/Problem'
