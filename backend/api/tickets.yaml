# The key resolver (docs/adr/0023 D3): a ticket by its key, under the team
# it names. The key is one path segment, <PROJECT>-<number>, split at its last
# hyphen.
resolve:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - name: key
      in: path
      required: true
      description: <PROJECT>-<number>
      schema: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,9}$'}
  get:
    operationId: resolveTicket
    tags: [tickets]
    summary: A ticket by its key
    description: The same body and ETag as the ticket's own route.
    responses:
      '200':
        description: The ticket
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
links:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listTicketLinks
    tags: [tickets]
    summary: The ticket's links in both directions, inside its team
    deprecated: true
    description: |
      Deprecated, replaced by `…/relations?kind=link`, which shows every link, the ends of other
      teams and those the caller may not see included, by their heads; kept in /api/v1 for one
      release, behaving as it did, and removed in a later one (docs/adr/0046 D7). Each link read
      from this ticket, under its reverse name when the ticket is the target (docs/adr/0012 D1). A
      link whose other end the caller cannot see, or is a ticket of another team, is absent.
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of links
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/LinkList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
link:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/PathLinkType'
    - $ref: './components/parameters.yaml#/OtherTicketKey'
  put:
    operationId: linkTickets
    tags: [tickets]
    summary: Link this ticket, as the source, to another ticket of the team
    description: |
      The short form inside the team (docs/adr/0007 D3); `…/links/{type}/{other_team}/{other}`
      links to a ticket of any team. Idempotent by its address (docs/adr/0045 D1): 201 for a new
      link, 200 without a second act for an existing one. A member's act with `write` scope on this
      ticket, in the agent baseline (docs/adr/0043 D2), who reads the other ticket: one they do not
      read is the 404 of one that does not exist (docs/adr/0012 D2). A `blocks` link that would close
      a cycle, through any team, is 409 `link_cycle` (docs/adr/0012 D4); `relates-to` is symmetric
      and stored once.
    responses:
      '200':
        description: The link existed already
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Link'
      '201':
        description: The new link
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Link'
      default:
        $ref: './components/responses.yaml#/Problem'
  delete:
    operationId: unlinkTickets
    tags: [tickets]
    summary: Remove a link
    description: |
      Idempotent; removing a link that does not exist answers 204 as well. A write on the ticket in
      the path, the link's source, whatever the caller reads of the other end (docs/adr/0012 D2).
    responses:
      '204':
        description: The link is gone
      default:
        $ref: './components/responses.yaml#/Problem'
linkAcross:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/PathLinkType'
    - $ref: './components/parameters.yaml#/OtherTeamSlug'
    - $ref: './components/parameters.yaml#/OtherTicketKey'
  put:
    operationId: linkTicketTo
    tags: [tickets]
    summary: Link this ticket, as the source, to a ticket of any team by its canonical key
    description: |
      `other_team` and `other` are the other end's canonical key, <team>/<PROJECT>-<number>, a ticket
      of any team of the installation (docs/adr/0012 D2 as amended 2026-10-10). Set by a `member` or
      `admin` of this ticket's team with `write` scope, in the agent baseline (docs/adr/0043 D2), who
      reads the other ticket — at least a `viewer` of its team, its project open to them, a
      confidential one only when admitted. One they do not read answers exactly as one that does not
      exist, 404 `not_found` "no such ticket", so that trying keys tells nothing (docs/adr/0008 D2).
      Idempotent by its address (docs/adr/0045 D1): 201 for a new link, 200 without a second act for
      an existing one — a `relates-to` made from the other end included. An act on both tickets, the
      other end's in its own team's record (docs/adr/0012 D3). A `blocks` link that would close a
      cycle through any team is 409 `link_cycle` (D4).
    responses:
      '200':
        description: The link existed already
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Relation'
      '201':
        description: The new link
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Relation'
      default:
        $ref: './components/responses.yaml#/Problem'
  delete:
    operationId: unlinkTicketFrom
    tags: [tickets]
    summary: Remove a link to a ticket of any team by its canonical key
    description: |
      A write on this ticket, the link's source, whatever the caller reads of the other end
      (docs/adr/0012 D2); the link is found among this ticket's relations by the other end's key,
      so a key the caller sees as a head removes its link. Idempotent: no such link — or a key that
      names none — answers 204 as well. An end the caller may not see shows no key; its link is
      removed by its id, `DELETE …/links/{link}`. The act is recorded on both tickets.
    responses:
      '204':
        description: The link is gone
      default:
        $ref: './components/responses.yaml#/Problem'
linkByID:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/LinkID'
  delete:
    operationId: removeTicketLink
    tags: [tickets]
    summary: Remove a link of this ticket, its source, by the link's id
    description: |
      The way to remove a link whose other end the caller may not see — a placeholder shows no key
      (docs/adr/0065 D5) —, by the id `…/relations` names it by. A write on this ticket, which must
      be the link's source, whatever the caller reads of the other end (docs/adr/0012 D2). A link of
      which this ticket is not the source, or no link, answers 204 and removes nothing. The act is
      recorded on both tickets, the other end's in its own team's record.
    responses:
      '204':
        description: The link is gone, or was never this ticket's to remove
      default:
        $ref: './components/responses.yaml#/Problem'
relations:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listTicketRelations
    tags: [tickets]
    summary: The ticket's parent, children and links, of any project or team, by their heads
    description: |
      Every relation of the ticket (docs/adr/0005 D3, docs/adr/0008 D2, docs/adr/0012 D2): its parent,
      its children and its links in both directions, each other end of any project or team shown as
      the caller sees it — readable, by its head where the caller holds no role in its team or its
      project is restricted from them (docs/adr/0034 D4), and as the placeholder `<team>
      [Confidential]` where they may not see it, in another team or their own (docs/adr/0065 D5). A
      deleted other end is absent. The parent first, then the children in the order they were filed,
      then the links in the order they were made.
    parameters:
      - $ref: './components/parameters.yaml#/RelationKinds'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of relations
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/RelationList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
prerequisiteTree:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listPrerequisiteTree
    tags: [tickets]
    summary: The ticket's prerequisite tree across teams, or read upward its dependents, by heads
    description: |
      docs/adr/0012 D6 as amended 2026-10-10. `direction=down`, the default: the tickets that block
      this one, what blocks those, and so on; `direction=up`: its dependents. Every node is a head of
      any project or team, as the caller sees it. The walk goes on only from a ticket the caller
      reads: a head and a placeholder are leaves, and what lies behind them stays behind their
      team's membership (docs/adr/0005 D3, docs/adr/0065 D5). A node of the caller's own team they
      read shows its assignee and its progress; any other node neither. To a depth of eight, depth
      first, siblings in the order they were filed; a ticket under two others stands in full once and
      `repeated` elsewhere. `open` counts the open tickets of the whole tree whose state the caller
      reads, each once, never a placeholder.
    parameters:
      - name: direction
        in: query
        description: down for the prerequisites, the default; up for the dependents
        schema: {type: string, enum: [down, up], default: down}
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the tree, depth first
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/PrerequisiteHeadTree'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
transitions:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  post:
    operationId: transitionTicket
    tags: [tickets]
    summary: Move the ticket to another state
    description: |
      The matrix of docs/adr/0009: forward one step (filed → analysed → decided → in-progress →
      review), backward with a reason (in-progress → decided or analysed, decided → analysed,
      review → in-progress), into blocked from any open state with a block and out of it only to
      where it came from, dropped from any open state with a reason, and dropped → filed, the
      reopen, with a reason. `from` must be the current state, else 409 `state_conflict` names it
      (docs/adr/0045 D2).

      To done is done by hand (docs/adr/0009 D5): from any open state for a person, from
      in-progress or review for an agent with `close` (else 403 `agent_forbidden`), with a
      verification note; it leaves the progress stages as they are and sets `done_by_hand` and
      `done_from`. Over open prerequisites it is 409 `open_prerequisites` unless a person overrides
      with a reason (docs/adr/0012 D7). Done → `done_from`, with a reason, withdraws a done by hand:
      the ticket returns there, ranked at the bottom of its project — unless it has no children and
      its three stages are full, when it stays done by them (recorded as `updated`). A ticket done
      by its stages leaves done only by a lower stage (`PATCH`): any transition out of it is 409
      `state_conflict`. An agent needs `decide` for analysed → decided, `close` for done, `drop`
      for dropped (docs/adr/0043 D4). Done and dropped take the ticket's rank away, a reopen ranks
      it at the bottom of its project (docs/adr/0014 D1). An Idempotency-Key is recorded on the
      act, not required (docs/adr/0045 D3, D7).
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/Transition'
          examples:
            start:
              summary: Forward one step, which the ticket's example answers
              value:
                from: decided
                to: in-progress
            done:
              summary: Done by hand, with the verification note
              value:
                from: review
                to: done
                note: The end-to-end sign-in with a trailing space passed in Safari 18 and Chrome 129 against staging.
    responses:
      '200':
        description: The ticket in its new state
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
rank:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  put:
    operationId: moveTicketRank
    tags: [tickets]
    summary: Place the ticket directly after or before another ticket of its project
    description: |
      A move in the project's rank (docs/adr/0014 D1, D2): the ticket gets a key strictly between
      the neighbour's and the next key on that side — every ticket of the project counts, those
      the caller cannot see included — so one row is written and the list is never renumbered.
      The key itself is never shown. Recorded as `ranked` with the neighbour, the version raised.
      A ticket that already sits there among the tickets the caller can see answers 200 unchanged
      and records nothing. No `If-Match`: a move does not overwrite, the last one wins
      (docs/adr/0050 D4). A member's act with `write` scope; an agent needs `rank`
      (docs/adr/0043 D4). A done or dropped ticket has no rank: as the ticket or as its
      neighbour, 409 `state_conflict`. A neighbour the caller cannot see is the 400 of one that
      does not exist.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/TicketRankSet'
          example:
            after: 39
    responses:
      '200':
        description: The ticket in its place
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
prerequisites:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listPrerequisites
    tags: [tickets]
    summary: The ticket's prerequisite tree inside its team, or read upward its dependents
    deprecated: true
    description: |
      Deprecated, replaced by `…/prerequisite-tree`, whose nodes are heads of any team; kept in
      /api/v1 for one release, behaving as it did — a ticket of another team is absent with what lies
      behind it —, and removed in a later one (docs/adr/0046 D7).
      docs/adr/0012 D6. `direction=down`, the default: the tickets that block this one, what
      blocks those, and so on — what has to be done before it can be finished. `direction=up`:
      its dependents, the tickets it blocks and what those block. To a depth of eight, depth
      first, siblings in the order they were filed. The walk never passes a ticket the caller
      cannot see: that ticket is absent, and so is whatever lies only behind it (docs/adr/0065
      D5). A ticket that stands in the tree under two others is shown in full once, under the
      first of them nearest the ticket asked about, and under each other one as `repeated`,
      without what lies behind it. `open` counts the open tickets of the whole tree, each once,
      on every page; the done and dropped ones are `settled`.
    parameters:
      - name: direction
        in: query
        description: down for the prerequisites, the default; up for the dependents
        schema: {type: string, enum: [down, up], default: down}
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the tree, depth first
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/PrerequisiteTree'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
interest:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listInterest
    tags: [tickets]
    summary: Who holds a stake in the ticket (docs/adr/0013 D2)
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of stakes
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/InterestList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  put:
    operationId: setInterest
    tags: [tickets]
    summary: Set the caller's own stake
    description: |
      One row per person and ticket (docs/adr/0013 D1): 201 for a new stake, 200 for a changed or
      unchanged one. A viewer registers `watch` only; an agent `watch`, and `need` or `urgent`
      with the `interest` capability (docs/adr/0043 D4).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/InterestSet'
          example:
            weight: need
            note: Support answers three calls a day from customers who cannot sign in.
    responses:
      '200':
        description: The stake changed, or was already so
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Interest'
      '201':
        description: The new stake
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Interest'
      default:
        $ref: './components/responses.yaml#/Problem'
  delete:
    operationId: removeInterest
    tags: [tickets]
    summary: Remove the caller's own stake
    description: Idempotent.
    responses:
      '204':
        description: The caller holds no stake
      default:
        $ref: './components/responses.yaml#/Problem'
markdown:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: exportTicket
    tags: [tickets]
    summary: The canonical Markdown of the ticket
    description: |
      Grammar v1 (docs/adr/0044 D1, docs/adr/0011 D4): the frontmatter from the columns, the
      body, then `## Open questions`. The `ETag` is the ticket's version, for `If-Match`; the
      document is never answered 304. Every call is recorded: data left the system
      (docs/adr/0044 D5). A recorded read: a session's request with `Sec-Fetch-Site`
      `same-site` or `cross-site` is `403 csrf` (docs/adr/0026 D5).
    x-cowork-recorded-read: true
    responses:
      '200':
        description: The document
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          text/markdown:
            schema:
              type: string
            example: |
              ---
              key: acme/WEB-42
              title: Sign-in fails in Safari when the password contains a space
              type: bug
              state: in-progress
              severity: high
              security: none
              horizon: now
              effort: S
              progress-refinement: 100
              progress: 60
              progress-review: 0
              assignee: "Grace Hopper <oidc:https://login.acme.example#CgVncmFjZRIFbG9jYWw>"
              parent: acme/WEB-40
              opened: 2026-10-01
              decided: 2026-10-02
              attachments:
                - safari-sign-in.png
              ---

              ## Current state

              Safari 18 trims the password field before the form is sent, so a password that ends with a space never matches and the sign-in fails with `invalid_credentials`.

              ## Required changes

              - Send the password as typed.
              - An end-to-end test that signs in with a trailing space in Safari.

              ## Open questions

              ### Q1: Do we trim passwords on the server as well?

              - A: trim nowhere: a password is sent and stored as typed.
              - B: trim on both ends, and say so at sign-up.

              **Recommendation:** A: a space is a character like any other; trimming would lock out who chose one.

              **Answer:** _open_
      default:
        $ref: './components/responses.yaml#/Problem'
context:
  parameters:
    - $ref: './components/parameters.yaml#/TeamSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: exportTicketContext
    tags: [tickets]
    summary: The ticket for reading, with what surrounds it
    description: |
      The canonical document of `…/markdown` (docs/adr/0044 D1) under one first
      line, `<!-- cowork: context of <key>, exported <time> by <person> (via
      <agent>) — not an import format -->`, followed by read-only sections in a
      fixed order (D2): `## Links` (typed, read from this ticket, each other
      end's key, title, state and assignee), `## Prerequisites` (the tree of the
      tickets that block it, to a depth of eight, with state, assignee and the
      implementation stage, and the count of open ones), `## Recent comments`
      (the last `comments`, oldest of them first, each quoted under its author,
      agent mark and time; a withdrawn one as `[withdrawn]`), `## Attachments`
      (name, type, size and URL, never content) and `## Recent activity` (the
      last `activity`). `comments=0` or `activity=0` leaves its section out. What
      the caller cannot see is absent. The document carries no `ETag`: it is not
      one entity. Every call is recorded: data left the system (D5). It is no
      import format (D3): there is no importer yet, and the one ADR 0044
      decides refuses a file that carries these sections. A recorded read: a
      session's request with `Sec-Fetch-Site` `same-site` or `cross-site` is
      `403 csrf` (docs/adr/0026 D5).
    x-cowork-recorded-read: true
    parameters:
      - name: comments
        in: query
        description: How many of the last comments to show
        schema: {type: integer, minimum: 0, maximum: 100, default: 10}
      - name: activity
        in: query
        description: How many of the last acts to show
        schema: {type: integer, minimum: 0, maximum: 100, default: 10}
    responses:
      '200':
        description: The document
        content:
          text/markdown:
            schema:
              type: string
            example: |
              <!-- cowork: context of acme/WEB-42, exported 2026-10-06T17:05:00Z by Ada Lovelace (via claude-code/claude-sonnet-4-5/4702cb1b-f7d1-4411-8c82-572d24a19911) — not an import format -->
              ---
              key: acme/WEB-42
              title: Sign-in fails in Safari when the password contains a space
              type: bug
              state: in-progress
              severity: high
              security: none
              horizon: now
              effort: S
              progress-refinement: 100
              progress: 60
              progress-review: 0
              assignee: "Grace Hopper <oidc:https://login.acme.example#CgVncmFjZRIFbG9jYWw>"
              parent: acme/WEB-40
              opened: 2026-10-01
              decided: 2026-10-02
              attachments:
                - safari-sign-in.png
              ---

              ## Current state

              Safari 18 trims the password field before the form is sent, so a password that ends with a space never matches and the sign-in fails with `invalid_credentials`.

              ## Required changes

              - Send the password as typed.
              - An end-to-end test that signs in with a trailing space in Safari.

              ## Open questions

              ### Q1: Do we trim passwords on the server as well?

              - A: trim nowhere: a password is sent and stored as typed.
              - B: trim on both ends, and say so at sign-up.

              **Recommendation:** A: a space is a character like any other; trimming would lock out who chose one.

              **Answer:** _open_

              ## Links

              - blocked by acme/WEB-39 — Log the sign-in failures with their reason (analysed, Sam Rivera)
