# The key resolver (docs/adr/0023 D3): a ticket by its key, under the tenant
# it names. The key is one path segment, <PROJECT>-<number>, split at its last
# hyphen.
resolve:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - name: key
      in: path
      required: true
      description: <PROJECT>-<number>
      schema: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,9}$'}
  get:
    operationId: resolveTicket
    tags: [tickets]
    summary: A ticket by its key
    description: The same body and ETag as the ticket's own route.
    responses:
      '200':
        description: The ticket
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
links:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listTicketLinks
    tags: [tickets]
    summary: The ticket's links in both directions
    description: |
      Each link read from this ticket, under its reverse name when the ticket is the target
      (docs/adr/0012 D1). A link whose other end the caller cannot see is absent.
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of links
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/LinkList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
link:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/PathLinkType'
    - $ref: './components/parameters.yaml#/OtherTicketKey'
  put:
    operationId: linkTickets
    tags: [tickets]
    summary: Link this ticket, as the source, to another ticket of the tenant
    description: |
      Idempotent by its address (docs/adr/0045 D1): 201 for a new link, 200 without a second
      act for an existing one. A member's act with `write` scope, in the agent baseline
      (docs/adr/0043 D2). A `blocks` link that would close a cycle is 409 `link_cycle`
      (docs/adr/0012 D4); `relates-to` is symmetric and stored once.
    responses:
      '200':
        description: The link existed already
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Link'
      '201':
        description: The new link
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Link'
      default:
        $ref: './components/responses.yaml#/Problem'
  delete:
    operationId: unlinkTickets
    tags: [tickets]
    summary: Remove a link
    description: Idempotent; removing a link that does not exist answers 204 as well.
    responses:
      '204':
        description: The link is gone
      default:
        $ref: './components/responses.yaml#/Problem'
transitions:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  post:
    operationId: transitionTicket
    tags: [tickets]
    summary: Move the ticket to another state
    description: |
      The matrix of docs/adr/0009: forward one step (filed → analysed → decided → in-progress →
      review), backward with a reason (in-progress → decided or analysed, decided → analysed,
      review → in-progress), into blocked from any open state with a block and out of it only to
      where it came from, dropped from any open state with a reason, and dropped → filed, the
      reopen, with a reason. `from` must be the current state, else 409 `state_conflict` names it
      (docs/adr/0045 D2).

      To done is done by hand (docs/adr/0009 D5): from any open state for a person, from
      in-progress or review for an agent with `close` (else 403 `agent_forbidden`), with a
      verification note; it leaves the progress stages as they are and sets `done_by_hand` and
      `done_from`. Over open prerequisites it is 409 `open_prerequisites` unless a person overrides
      with a reason (docs/adr/0012 D7). Done → `done_from`, with a reason, withdraws a done by hand:
      the ticket returns there, ranked at the bottom of its project — unless it has no children and
      its three stages are full, when it stays done by them (recorded as `updated`). A ticket done
      by its stages leaves done only by a lower stage (`PATCH`): any transition out of it is 409
      `state_conflict`. An agent needs `decide` for analysed → decided, `close` for done, `drop`
      for dropped (docs/adr/0043 D4). Done and dropped take the ticket's rank away, a reopen ranks
      it at the bottom of its project (docs/adr/0014 D1). An Idempotency-Key is recorded on the
      act, not required (docs/adr/0045 D3, D7).
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/Transition'
          example:
            from: review
            to: done
            note: make test-integration passed against PostgreSQL 18.6
    responses:
      '200':
        description: The ticket in its new state
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
rank:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  put:
    operationId: moveTicketRank
    tags: [tickets]
    summary: Place the ticket directly after or before another ticket of its project
    description: |
      A move in the project's rank (docs/adr/0014 D1, D2): the ticket gets a key strictly between
      the neighbour's and the next key on that side — every ticket of the project counts, those
      the caller cannot see included — so one row is written and the list is never renumbered.
      The key itself is never shown. Recorded as `ranked` with the neighbour, the version raised.
      A ticket that already sits there among the tickets the caller can see answers 200 unchanged
      and records nothing. No `If-Match`: a move does not overwrite, the last one wins
      (docs/adr/0050 D4). A member's act with `write` scope; an agent needs `rank`
      (docs/adr/0043 D4). A done or dropped ticket has no rank: as the ticket or as its
      neighbour, 409 `state_conflict`. A neighbour the caller cannot see is the 400 of one that
      does not exist.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/TicketRankSet'
          example:
            after: 12
    responses:
      '200':
        description: The ticket in its place
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Ticket'
      default:
        $ref: './components/responses.yaml#/Problem'
prerequisites:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listPrerequisites
    tags: [tickets]
    summary: The ticket's prerequisite tree, or read upward its dependents
    description: |
      docs/adr/0012 D6. `direction=down`, the default: the tickets that block this one, what
      blocks those, and so on — what has to be done before it can be finished. `direction=up`:
      its dependents, the tickets it blocks and what those block. To a depth of eight, depth
      first, siblings in the order they were filed. The walk never passes a ticket the caller
      cannot see: that ticket is absent, and so is whatever lies only behind it (docs/adr/0065
      D5). A ticket that stands in the tree under two others is shown in full once, under the
      first of them nearest the ticket asked about, and under each other one as `repeated`,
      without what lies behind it. `open` counts the open tickets of the whole tree, each once,
      on every page; the done and dropped ones are `settled`.
    parameters:
      - name: direction
        in: query
        description: down for the prerequisites, the default; up for the dependents
        schema: {type: string, enum: [down, up], default: down}
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the tree, depth first
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/PrerequisiteTree'
            example:
              items:
                - key: acme/COW-7
                  title: Pick the format
                  state: in-progress
                  blocked_from: null
                  assignee: {id: 0190f4c2-6f1e-7a3b-9c2d-1e2f3a4b5c6d, username: ada, display_name: Ada}
                  progress: 40
                  progress_refinement: 100
                  progress_review: 0
                  progress_derived: false
                  depth: 1
                  settled: false
                  repeated: false
              next_cursor: null
              open: 1
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
interest:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listInterest
    tags: [tickets]
    summary: Who holds a stake in the ticket (docs/adr/0013 D2)
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of stakes
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/InterestList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  put:
    operationId: setInterest
    tags: [tickets]
    summary: Set the caller's own stake
    description: |
      One row per person and ticket (docs/adr/0013 D1): 201 for a new stake, 200 for a changed or
      unchanged one. A viewer registers `watch` only; an agent `watch`, and `need` or `urgent`
      with the `interest` capability (docs/adr/0043 D4).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/InterestSet'
    responses:
      '200':
        description: The stake changed, or was already so
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Interest'
      '201':
        description: The new stake
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Interest'
      default:
        $ref: './components/responses.yaml#/Problem'
  delete:
    operationId: removeInterest
    tags: [tickets]
    summary: Remove the caller's own stake
    description: Idempotent.
    responses:
      '204':
        description: The caller holds no stake
      default:
        $ref: './components/responses.yaml#/Problem'
markdown:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: exportTicket
    tags: [tickets]
    summary: The canonical Markdown of the ticket
    description: |
      Grammar v1 (docs/adr/0044 D1, docs/adr/0011 D4): the frontmatter from the columns, the
      body, then `## Open questions`. The `ETag` is the ticket's version, for `If-Match`; the
      document is never answered 304. Every call is recorded: data left the system
      (docs/adr/0044 D5).
    responses:
      '200':
        description: The document
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          text/markdown:
            schema:
              type: string
      default:
        $ref: './components/responses.yaml#/Problem'
context:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: exportTicketContext
    tags: [tickets]
    summary: The ticket for reading, with what surrounds it
    description: |
      The canonical document of `…/markdown` (docs/adr/0044 D1) under one first
      line, `<!-- cowork: context of <key>, exported <time> by <person> (via
      <agent>) — not an import format -->`, followed by read-only sections in a
      fixed order (D2): `## Links` (typed, read from this ticket, each other
      end's key, title, state and assignee), `## Prerequisites` (the tree of the
      tickets that block it, to a depth of eight, with state, assignee and the
      implementation stage, and the count of open ones), `## Recent comments`
      (the last `comments`, oldest of them first, each quoted under its author,
      agent mark and time; a withdrawn one as `[withdrawn]`), `## Attachments`
      (name, type, size and URL, never content), `## Pull requests` (each pull
      request and default-branch commit GitHub's webhook linked, with its state,
      author and URL, its title quoted — written only when the ticket has one,
      docs/adr/0071 D6) and `## Recent activity` (the
      last `activity`). `comments=0` or `activity=0` leaves its section out. What
      the caller cannot see is absent. The document carries no `ETag`: it is not
      one entity. Every call is recorded: data left the system (D5). It is no
      import format (D3): there is no importer yet, and the one ADR 0044
      decides refuses a file that carries these sections.
    parameters:
      - name: comments
        in: query
        description: How many of the last comments to show
        schema: {type: integer, minimum: 0, maximum: 100, default: 10}
      - name: activity
        in: query
        description: How many of the last acts to show
        schema: {type: integer, minimum: 0, maximum: 100, default: 10}
    responses:
      '200':
        description: The document
        content:
          text/markdown:
            schema:
              type: string
      default:
        $ref: './components/responses.yaml#/Problem'
pullRequests:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listTicketPullRequests
    tags: [tickets]
    summary: The pull requests and default-branch commits that name the ticket
    description: |
      What GitHub's webhook linked to the ticket (docs/adr/0071 D6): each pull request whose title
      or body names it, and each commit on a bound repository's default branch whose message names
      it, with where the key was found, oldest link first. Read under the ticket's predicate, like
      its other children: a confidential ticket's pull requests exist only for whoever sees the
      ticket (docs/adr/0065 D1). A link a person removed is absent.
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of pull requests
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/PullRequestList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
pullRequest:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/PullRequestID'
  delete:
    operationId: removeTicketPullRequest
    tags: [tickets]
    summary: Remove a wrong link of a pull request or a commit
    description: |
      A key read from a title or a message can name a ticket it did not mean (docs/adr/0071
      Residual risks); a person removes the link like any link — a member's act with `write`
      scope, in the agent baseline (docs/adr/0043 D2). The removal stays: a later delivery that
      names the ticket again does not bring the link back. Recorded as `unlinked`. Idempotent:
      `204` also when the link is gone.
    responses:
      '204':
        description: The link is gone
      default:
        $ref: './components/responses.yaml#/Problem'
