# Attachments: bytes in object storage, served only through the backend
# (docs/adr/0016).
attachments:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listAttachments
    tags: [attachments]
    summary: The ticket's attachments
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of attachments
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/AttachmentList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  post:
    operationId: uploadAttachment
    tags: [attachments]
    summary: Upload a file to the ticket, or to one of its comments
    description: |
      A member's act with `write` scope; an agent needs `upload` (docs/adr/0043 D4); a comment's
      attachment only its author or that person's agents. The type is detected from the bytes
      and must be on the allow-list, else 415 names it (docs/adr/0016 D3); above
      COWORK_ATTACHMENT_MAX_BYTES 413 before anything is stored (D6); a ticket that holds
      COWORK_ATTACHMENT_MAX_PER_TICKET attachments `409 attachment_limit`; a file that would take
      the tenant's attachments above COWORK_ATTACHMENT_TENANT_QUOTA bytes `409 attachment_quota`,
      checked under the tenant's lock before the bytes are stored; without object storage
      501 `uploads_disabled`.
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      description: |
        Two parts and no other: `file`, the one file, whose `filename` in its `Content-Disposition`
        becomes the attachment's `file_name`, sanitised (docs/adr/0016 D1); and `comment_id`,
        optional, the id of a comment of the ticket the file belongs to.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: {type: string, format: binary}
              comment_id: {type: string, format: uuid}
    responses:
      '201':
        description: The new attachment
        headers:
          Location:
            $ref: './components/headers.yaml#/Location'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Attachment'
      default:
        $ref: './components/responses.yaml#/Problem'
attachment:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/AttachmentID'
  get:
    operationId: getAttachment
    tags: [attachments]
    summary: An attachment's metadata
    responses:
      '200':
        description: The metadata
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Attachment'
      default:
        $ref: './components/responses.yaml#/Problem'
attachmentContent:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/AttachmentID'
  get:
    operationId: downloadAttachment
    tags: [attachments]
    summary: An attachment's bytes
    description: |
      Streamed from storage after the ticket's read check, with the detected type, `nosniff`,
      `Content-Security-Policy: sandbox`, inline for raster images and a download for
      everything else (docs/adr/0016 D5). Every 200 is recorded as data leaving the system
      (docs/adr/0026 D5); a 304 is not. Bytes missing from storage answer 404 saying so
      (docs/adr/0059 D4).

      A recorded read (`x-cowork-recorded-read`): a session's request whose
      `Sec-Fetch-Site` is `same-site` or `cross-site` is `403 csrf`; `same-origin`, `none` and
      no header pass, and a token's request is not looked at (docs/adr/0026 D5).
    x-cowork-recorded-read: true
    parameters:
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: The bytes
        headers:
          ETag:
            description: The quoted hex SHA-256 of the bytes
            schema: {type: string}
          Content-Disposition:
            schema: {type: string}
          X-Content-Type-Options:
            schema: {type: string}
          Content-Security-Policy:
            schema: {type: string}
        content:
          '*/*':
            schema: {type: string, format: binary}
      '304':
        description: The client holds these bytes
        headers:
          ETag:
            description: The quoted hex SHA-256 of the bytes
            schema: {type: string}
      default:
        $ref: './components/responses.yaml#/Problem'
# The bytes a tenant's attachments hold, against its quota (docs/adr/0016 D6
# as amended 2026-10-05), for the tenant's administrators.
attachmentUsage:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  get:
    operationId: getAttachmentUsage
    tags: [attachments]
    summary: The bytes the tenant's attachments hold, and the quota
    description: |
      Every attachment of the tenant counts, on every ticket, confidential ones and those of
      restricted projects included, and a deleted ticket's until the purge removes them — they
      occupy the bucket until then (docs/adr/0024 D2): the sum the quota is checked against. The
      tenant's administrators, a token's `read` scope; anybody else is `403 forbidden`, because the
      sum counts files of tickets they may not see. `quota_bytes` is COWORK_ATTACHMENT_TENANT_QUOTA,
      null where the installation sets none. An answer the client holds unchanged is `304` to its
      weak `ETag` (docs/adr/0054 D7).
    parameters:
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: The usage
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/AttachmentUsage'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
# The consistency check of the tenant's attachments against the bucket
# (docs/adr/0059 D4), for the tenant's administrators: its latest result, the
# removal of its orphans and the acceptance of its missing files.
attachmentConsistency:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  get:
    operationId: getAttachmentConsistency
    tags: [attachments]
    summary: The latest consistency check of the tenant's attachments against the bucket
    description: |
      What the daily check found last: the files whose metadata is there and whose bytes the bucket
      lacks — dangling, after a restore that brought the database back without them; their download
      answers 404 saying so — and the objects under the tenant's prefix that no metadata names —
      orphans, after a restore that brought the bucket back from a later point, or a removal that
      failed. The counts are exact, the lists at most 1000 entries each. The tenant's administrators,
      a token's `read` scope; anybody else is `403 forbidden`, because the lists name files of tickets
      they may not see. Before the first check `check_id` is null. Beside the check, when a project
      of the tenant or the whole tenant was last exported — the second line of its backup
      (docs/adr/0059 D2) —, null before the first. An answer the client holds unchanged is `304` to
      its weak `ETag` (docs/adr/0054 D7).
    parameters:
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: The latest result
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/AttachmentConsistency'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
orphanRemoval:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  post:
    operationId: removeOrphanedObjects
    tags: [attachments]
    summary: Remove the orphaned objects of a consistency check, confirmed
    description: |
      A tenant administrator's act, never an agent's (docs/adr/0059 D4, docs/adr/0043 D3), **in a
      browser session only**: nothing brings a removed object back, so a token — an administrator's
      `admin` token included — answers `403 session_required` (docs/adr/0035 D5). The body names the
      check whose list the administrator confirms; a newer check, or a removal confirmed already, is
      `409 consistency_check_stale`. Each orphan of that list is asked again whether an attachment
      names it now — one that does is kept —, the act is recorded as `purged`, with the counts and no
      key, and the objects are removed after the commit; a removal that fails is logged with its key
      and listed again by the next check. A check with no orphans changes nothing and records
      nothing. Without object storage, `501 uploads_disabled`.
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/ConsistencyCheckRef'
          example:
            check_id: 01a10f27-5b80-71db-8b7c-37825a4703a9
    responses:
      '200':
        description: What the removal did
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/OrphanRemoval'
      default:
        $ref: './components/responses.yaml#/Problem'
danglingAcceptance:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
  post:
    operationId: acceptDanglingAttachments
    tags: [attachments]
    summary: Accept the loss of a consistency check's missing files
    description: |
      A tenant administrator's act with `admin` scope, never an agent's (docs/adr/0059 D5,
      docs/adr/0043 D3): the missing files of the check's list nobody accepted yet count as accepted
      from now on — as lost — instead of dangling, and no longer hold the alert. Nothing is removed:
      the files stay listed on their tickets and their download answers 404 saying the bytes are
      missing; one whose bytes come back is whole again, and a later loss of it counts once more. The
      body names the check whose list the administrator was shown; a newer check is
      `409 consistency_check_stale`. Recorded as `accepted`, with the count. A list with nothing to
      accept changes nothing and records nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/ConsistencyCheckRef'
          example:
            check_id: 01a10f27-5b80-71db-8b7c-37825a4703a9
    responses:
      '200':
        description: What the acceptance did
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/DanglingAcceptance'
      default:
        $ref: './components/responses.yaml#/Problem'
