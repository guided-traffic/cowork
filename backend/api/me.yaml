# The calling person, across tenants (docs/adr/0023 D2).
me:
  get:
    operationId: getMe
    tags: [me]
    summary: The calling person and their tenants
    responses:
      '200':
        description: The person
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Me'
      default:
        $ref: './components/responses.yaml#/Problem'
tokens:
  get:
    operationId: listMyTokens
    tags: [me]
    summary: The person's tokens, revoked and expired ones included
    description: |
      Metadata only; a token's plaintext is shown once, at creation
      (docs/adr/0035 D1, D6). Newest first, paged by cursor, or by number with
      a total (docs/adr/0048 D2).
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/Page'
      - $ref: './components/parameters.yaml#/PerPage'
    responses:
      '200':
        description: A page of tokens
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TokenList'
      default:
        $ref: './components/responses.yaml#/Problem'
  post:
    operationId: createMyToken
    tags: [me]
    summary: Create a personal access token
    description: |
      Only the person themselves, in a browser session: no token creates a
      token (`403 session_required`) and no administrator creates one for
      another person (docs/adr/0035 D5). The answer carries the plaintext
      `token` once; cowork stores its SHA-256 only (D1).

      The lifetime is `lifetime_days`, by default `COWORK_TOKEN_DEFAULT_LIFETIME`
      (90 days) and at most `COWORK_TOKEN_MAX_LIFETIME` (one year): a longer
      one is shortened to the maximum, and `expires_at` in the answer says what
      the token got (D4). An agent token has at most `write` scope
      (docs/adr/0036 D5), carries capabilities and nothing else does, and gets
      every capability when `capabilities` is left out; an empty list is no
      capability, the baseline only (docs/adr/0043 D4). A tenant
      restriction needs a tenant the person belongs to, a project restriction a
      project of it the person sees; either, if not, is `validation_failed`
      without saying which of the two it was.

      An `Idempotency-Key` makes a retry create nothing twice, but the stored
      answer never holds the plaintext (docs/adr/0045 D6): the repetition
      answers the token without `token`, and the person revokes it and makes
      another.
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/TokenCreate'
          example:
            name: Claude Code on the laptop
            scope: write
            agent: true
            tenant: acme
            project: WEB
            lifetime_days: 90
    responses:
      '201':
        description: The token, with its plaintext once
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/TokenCreated'
      default:
        $ref: './components/responses.yaml#/Problem'
token:
  parameters:
    - name: token_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  delete:
    operationId: revokeMyToken
    tags: [me]
    summary: Revoke one of the person's tokens
    description: |
      Immediate and recorded; the row stays listed (docs/adr/0035 D6). A
      token may always revoke itself; revoking another token of the person
      needs `write` scope, and an agent may revoke only the token it holds
      (docs/adr/0043 D3). Revoking a revoked token changes nothing.
    responses:
      '204':
        description: Revoked
      default:
        $ref: './components/responses.yaml#/Problem'
currentToken:
  get:
    operationId: getMyToken
    tags: [me]
    summary: The token this request presents, and what it makes of the request
    description: |
      The token's metadata as the list shows it, the key of the project it is
      restricted to, and the request's mark: whether it is an agent's — by the
      token's flag or by an `X-Cowork-Agent` header (docs/adr/0036 D2, D3) — the
      agent recorded on its acts, and the capabilities it holds
      (docs/adr/0043 D4). The MCP server reads it at start to tell the model what
      it may do (D6), and `cowork-mcp token check` to tell a person
      (docs/adr/0070 D2). A browser session presents no token: `404 not_found`.
    responses:
      '200':
        description: The token
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/CurrentToken'
      default:
        $ref: './components/responses.yaml#/Problem'
chat:
  get:
    operationId: getMyChat
    tags: [me]
    summary: The capabilities the person gives the chat in the UI
    description: |
      The chat acts as the person's agent, and its requests hold exactly this set
      (docs/adr/0043 D5, docs/adr/0076): an act that needs another capability is refused
      to the chat with `403 agent_forbidden` and stays the person's. A person who never chose
      holds the default — every capability but `decide`, `close`, `drop` and `record-answer` —,
      and `chosen` is false.
    responses:
      '200':
        description: The chat's capabilities
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ChatCapabilities'
      default:
        $ref: './components/responses.yaml#/Problem'
  put:
    operationId: setMyChat
    tags: [me]
    summary: Choose the capabilities the person gives the chat in the UI
    description: |
      Only the person, in a browser session: what the chat may do is access to the person's
      tenants, which a token does not give (`403 session_required`, docs/adr/0035 D5), and a session
      the agent header marks — the chat itself among them — is `403 agent_forbidden`. The set
      replaces the one before, from the chat's next request on, a running turn's included; an empty
      set leaves the chat the baseline (docs/adr/0043 D4). No `If-Match`: the person is the only
      writer, and the same set sent twice changes nothing (docs/adr/0050 D4). A change is recorded
      as the person's act.
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/ChatCapabilitiesUpdate'
          example:
            capabilities: [rank, set-horizon]
    responses:
      '200':
        description: The chat's capabilities as chosen
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ChatCapabilities'
            example:
              capabilities: [rank, set-horizon]
              chosen: true
      default:
        $ref: './components/responses.yaml#/Problem'
password:
  put:
    operationId: changeMyPassword
    tags: [me]
    summary: Change the password of the person's local account
    description: |
      Needs the current password, which counts like a login attempt towards
      the lockout of the account (docs/adr/0033 D6). The new one must be as long
      as `COWORK_PASSWORD_MIN_LENGTH` and differ from the current one; every
      other session of the account ends (D4), and a temporary password is no
      longer temporary. The local administrator's password is set by the
      configuration and cannot be changed here (`403 forbidden`).
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/PasswordChange'
          example:
            current_password: correct horse battery staple
            new_password: four random words outlast one clever one
    responses:
      '204':
        description: Changed
      default:
        $ref: './components/responses.yaml#/Problem'
inbox:
  get:
    operationId: listMyInbox
    tags: [me]
    summary: The person's notifications across their tenants, newest first
    description: |
      One inbox per person, a union over the tenants they belong to — one read per tenant, never one
      query across them (docs/adr/0020 D1, docs/adr/0021 D5). A notification is written by the act
      that caused it, for the events of docs/adr/0020 D2: a ticket assigned to the person, a
      question asked of them, a question they asked answered, a state change of — or a comment on —
      a ticket they watch (docs/adr/0013 D6: a stake, the assignee, the reporter, an open question
      asked by or of them), a ticket that blocks one they watch reaching `done` or `dropped`, and an
      `urgent` stake on a ticket assigned to them. Their own acts and their agents' tell them
      nothing. Each entry names its tenant beside the ticket and renders from the act (D3): the
      ticket as it is now, the act as the ticket's activity shows it — without its payload where
      it names a ticket the person cannot see — and whether the comment or question it is on has
      been withdrawn since. A notification of a ticket the person no longer sees, or of a tenant
      they left, is absent and counts nowhere (docs/adr/0065 D5).

      `unread` counts the person's unread notifications in the tenants the request reaches. A
      token restricted to a tenant reads that tenant's, one restricted to a project that project's
      (docs/adr/0035 D3). Cursor paging only; the cursor holds the place, so a notification that
      arrives while the person reads shifts nothing (docs/adr/0048 D3).
    parameters:
      - $ref: './components/parameters.yaml#/MeTenant'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the inbox and the unread count
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/InboxList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
inboxRead:
  put:
    operationId: markMyInboxRead
    tags: [me]
    summary: Mark the person's notifications read, up to one they saw
    description: |
      "Mark all read" (docs/adr/0020 D6): every unread notification of the person up to and
      including `through`, in the tenants the request reaches; one that arrived after it stays
      unread. One act `read` per tenant where something changed; none where nothing did. Needs
      `write` scope. Read notifications are kept ninety days, unread ones until they are read.
    parameters:
      - $ref: './components/parameters.yaml#/MeTenant'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/InboxReadThrough'
          example:
            through: 01a10c96-0240-7196-85bb-eeab014066b7
    responses:
      '200':
        description: The unread count after the marking
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/InboxState'
      default:
        $ref: './components/responses.yaml#/Problem'
notificationRead:
  parameters:
    - name: notification
      in: path
      required: true
      description: The notification's id
      schema: {type: string, format: uuid}
  put:
    operationId: markNotificationRead
    tags: [me]
    summary: Mark one of the person's notifications read
    description: |
      Recorded as the act `read`; one already read changes nothing and records nothing. A
      notification that is not the person's, or of a ticket they no longer see, is `404 not_found`.
      Needs `write` scope.
    responses:
      '200':
        description: The unread count after the marking
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/InboxState'
      default:
        $ref: './components/responses.yaml#/Problem'
next:
  get:
    operationId: listMyNext
    tags: [me]
    summary: What the person could take up next, across their tenants
    description: |
      "Next for me" (docs/adr/0018 D3 as amended 2026-10-05): every ticket that is neither `done` nor
      `dropped` and is assigned to the person or to nobody, in the projects they see of every tenant
      they belong to, each with its tenant and its place in its project's rank — one read per tenant
      (docs/adr/0021 D5), under the same predicate as the tenant's own lists. Another person's ticket
      is not in it. Ordered by the score (docs/adr/0014 D5) — highest first, a ticket without one
      last — then by the ticket's id; the place is the secondary indicator. Cursor paging only
      (docs/adr/0048 D3); the cursor carries the score's key and the id. `project` narrows to one
      project of the tenant `tenant` names. A token restricted to a tenant reads that tenant, one
      restricted to a project that project (docs/adr/0035 D3).
    parameters:
      - $ref: './components/parameters.yaml#/MeTenant'
      - $ref: './components/parameters.yaml#/MeProject'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of what the person could take up next
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/MyTicketList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
assigned:
  get:
    operationId: listMyAssigned
    tags: [me]
    summary: The open tickets assigned to the person, across their tenants
    description: |
      "Assigned to me" (docs/adr/0018 D3): every ticket that is neither `done` nor `dropped` and is
      assigned to the person, in every tenant they belong to, each with its tenant and its place in
      its project's rank — one read per tenant (docs/adr/0021 D5), under the same predicate as the
      tenant's own lists. Ordered by the score (docs/adr/0014 D5) — highest first, a ticket without
      one last — then by the ticket's id; the place is the secondary indicator. Cursor paging only
      (docs/adr/0048 D3). A token restricted to a tenant reads that tenant, one restricted to a
      project that project (docs/adr/0035 D3).
    parameters:
      - $ref: './components/parameters.yaml#/MeTenant'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the person's tickets
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/MyTicketList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
decisions:
  get:
    operationId: listMyDecisions
    tags: [me]
    summary: The open decisions of the person, across their tenants
    description: |
      "Open decisions" (docs/adr/0018 D3): the open questions asked of the person and those open in
      their tenants — asked of nobody (docs/adr/0011 D2) —, on tickets they see, each with its
      tenant and its ticket; one read per tenant (docs/adr/0021 D5). Ordered by the score of the
      ticket (docs/adr/0014 D5) — a `done` or `dropped` ticket, which has none, after the scored ones
      — then by the ticket's id and the question's number. Cursor paging only (docs/adr/0048 D3). A
      restricted token reads as on `GET /api/v1/me/assigned`.
    parameters:
      - $ref: './components/parameters.yaml#/MeTenant'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of the open decisions
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/DecisionList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
