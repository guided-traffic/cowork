# Meta: what a client reads before it authenticates.
version:
  get:
    operationId: getVersion
    tags: [meta]
    summary: The backend build
    description: The MCP server compares the major version at start (docs/adr/0040 D5).
    security: []
    responses:
      '200':
        description: The build
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Version'
      default:
        $ref: './components/responses.yaml#/Problem'
coworkYamlSchema:
  get:
    operationId: getCoworkYamlSchema
    tags: [meta]
    summary: The JSON Schema of a repository's `.cowork.yaml`
    description: |
      The optional binding file of a repository without a remote or of a fork
      (docs/adr/0066 D4): `team` — or its deprecated name `tenant`, read for one
      release — and `project`, and optionally `path` — the
      sub-directory of a monorepo it binds — and `url`, the installation it
      belongs to. Unauthenticated, so an editor can load it.
    security: []
    responses:
      '200':
        description: The schema, JSON Schema draft 2020-12
        content:
          application/json:
            schema:
              type: object
            examples:
              schema:
                summary: The schema, its descriptions left out
                value:
                  $schema: https://json-schema.org/draft/2020-12/schema
                  title: .cowork.yaml
                  type: object
                  additionalProperties: false
                  required: [project]
                  anyOf:
                    - required: [team]
                    - required: [tenant]
                  properties:
                    team: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
                    tenant: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', deprecated: true}
                    project: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$'}
                    path: {type: string, maxLength: 512}
                    url: {type: string, maxLength: 2000, pattern: '^https?://'}
      default:
        $ref: './components/responses.yaml#/Problem'
document:
  get:
    operationId: getOpenAPI
    tags: [meta]
    summary: This document
    description: Unauthenticated; `info.version` is the backend version (docs/adr/0046 D5).
    security: []
    responses:
      '200':
        description: The OpenAPI document
        content:
          application/json:
            schema:
              type: object
            examples:
              document:
                summary: The document, cut after its first path
                value:
                  openapi: 3.1.0
                  info:
                    title: cowork
                    version: 0.7.0
                    description: A multi-team backlog for people and the agents that work for them.
                  servers:
                    - url: /
                  security:
                    - bearerToken: []
                    - sessionCookie: []
                  paths:
                    /api/v1/version:
                      get:
                        operationId: getVersion
                        tags: [meta]
                        summary: The backend build
                        security: []
      default:
        $ref: './components/responses.yaml#/Problem'
