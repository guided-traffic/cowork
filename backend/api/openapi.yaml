  - name: dashboard
  - name: imports
  - name: tenants
    description: |
      Deprecated: every path under `/api/v1/teams/{team}`, and `/api/v1/teams` itself, served under
      the name before — `/api/v1/tenants/{tenant}`, `/api/v1/tenants` — for one release and removed
      in a later one (docs/adr/0005 D1, docs/adr/0023 D1, docs/adr/0046 D7). A twin answers as the
      path it stands for; tools/specbundle writes the twins into the bundled document, and neither
      generated client carries them.
