Problem:
  type: object
  required: [type, title, status, code]
  properties:
    type: {type: string}
    title: {type: string}
    status: {type: integer}
    detail: {type: string}
    instance: {type: string}
    code:
      $ref: './problem-codes.yaml#/ProblemCode'
    request_id: {type: string}
    errors:
      type: array
      items:
        $ref: '#/FieldError'
FieldError:
  type: object
  required: [pointer, message]
  properties:
    pointer:
      type: string
      description: |
        A JSON pointer into the body, or query:<name> / header:<name>; the refused execution of an
        import names a file of its upload as file:<path>
    message: {type: string}
    current:
      type: [string, number, integer, boolean, object, array, 'null']
      description: The server's current value of the field, on a 412; null when the field is empty
      x-go-type: interface{}
Version:
  type: object
  required: [version, commit, build_time]
  properties:
    version: {type: string}
    commit: {type: string}
    build_time: {type: string}
  example:
    version: 0.7.0
    commit: b4ceb2e
    build_time: '1791273600'
Role:
  type: string
  enum: [viewer, member, admin]
  description: A team role, lowest first (docs/adr/0034 D1)
Scope:
  type: string
  enum: [read, write, admin]
  description: A token's scope (docs/adr/0035 D3)
Capability:
  type: string
  enum: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
  description: An agent capability (docs/adr/0043 D4)
Person:
  type: object
  required: [id, display_name]
  properties:
    id: {type: string, format: uuid}
    username:
      type: [string, 'null']
      description: |
        A local account's username as it is stored, without the `local:` that names the identity
        (docs/adr/0032 D1, docs/adr/0033 D2); null for a person of the identity provider
    display_name: {type: string}
TokenMark:
  type: object
  description: |
    The personal access token an act came through (docs/adr/0036 D6): its id and its name as the act
    recorded it, readable by whoever reads the act — never the token's secret, hash or prefix. A
    revoked or expired token's acts keep its name.
  required: [id, name]
  properties:
    id: {type: string, format: uuid}
    name:
      type: [string, 'null']
      description: |
        The token's name; null only on an act of the activity recorded before cowork kept the name,
        which says that a token was used, not which one
TeamRef:
  type: object
  required: [slug, name]
  properties:
    slug: {type: string}
    name: {type: string}
TeamSummary:
  type: object
  required: [slug, name, role]
  properties:
    slug: {type: string}
    name: {type: string}
    role:
      description: |
        The role the caller holds in the team, the higher of their mapping and
        their grant; null where they hold none (docs/adr/0034 D2)
      oneOf:
        - $ref: '#/Role'
        - type: 'null'
TeamSummaryList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TeamSummary'
    next_cursor:
      type: [string, 'null']
  example:
    items:
      - slug: acme
        name: Acme
        role: admin
    next_cursor: null
Membership:
  type: object
  required: [team, tenant, role, origins, can_create_projects]
  properties:
    team:
      $ref: '#/TeamRef'
    tenant:
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      allOf:
        - $ref: '#/TeamRef'
    role:
      $ref: '#/Role'
    origins:
      type: array
      description: |
        Where the role comes from, each source with its own role; `role` is the
        higher of them (docs/adr/0030 D4)
      items:
        $ref: '#/MembershipOrigin'
    can_create_projects:
      type: boolean
      description: |
        Whether the role lets the person create a project in the team: an administrator always, a
        member while the team's `members_create_projects` is on, a viewer never (docs/adr/0034 D9).
        A token's scope and an agent's capabilities may still refuse it (docs/adr/0043 D4), as
        `POST /api/v1/teams/{team}/projects` decides
MembershipSource:
  type: string
  enum: [mapping, grant]
  description: |
    How a membership came to be: derived from the person's groups by a group
    mapping, or granted by an administrator (docs/adr/0030 D2, D3)
MembershipOrigin:
  type: object
  required: [source, role]
  properties:
    source:
      $ref: '#/MembershipSource'
    role:
      $ref: '#/Role'
Me:
  type: object
  required: [id, display_name, global_admin, local, password_change_required, memberships]
  properties:
    id: {type: string, format: uuid}
    username: {type: [string, 'null']}
    display_name: {type: string}
    global_admin:
      type: boolean
      description: |
        The person is a global administrator: they create teams and hold no role
        in any of them until they grant themselves one (docs/adr/0004 D4,
        docs/adr/0034 D2)
    local:
      type: boolean
      description: The person has a local account, a password of their own (docs/adr/0033)
    password_change_required:
      type: boolean
      description: |
        The account's password is temporary: a session can do nothing but change
        it, read this answer and log out until it has (docs/adr/0033 D4)
    memberships:
      type: array
      items:
        $ref: '#/Membership'
  example:
    id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3
    username: ada
    display_name: Ada Lovelace
    global_admin: true
    local: true
    password_change_required: false
    memberships:
      - team: {slug: acme, name: Acme}
        tenant: {slug: acme, name: Acme}
        role: admin
        origins:
          - source: grant
            role: admin
        can_create_projects: true
TokenState:
  type: string
  enum: [active, expired, revoked]
Token:
  type: object
  required: [id, name, scope, agent, capabilities, restricted_project, created_at, expires_at, state]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      description: The agent flag; every request of the token is an agent's (docs/adr/0036 D2)
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    restricted_team:
      type: [string, 'null']
      description: The slug of the team the token is restricted to
    restricted_tenant:
      type: [string, 'null']
      deprecated: true
      description: Deprecated, replaced by `restricted_team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
    restricted_project:
      type: [string, 'null']
      description: |
        The key of the project the token is restricted to (docs/adr/0035 D3); null for a token
        without a project restriction, and for one whose project the person no longer sees or
        whose team they no longer belong to — such a token reaches nothing
    restricted_project_id:
      type: [string, 'null']
      format: uuid
      deprecated: true
      description: |
        The id of the project the token is restricted to. Replaced by `restricted_project`, which
        names the project by its key, as a person knows it; kept in `/api/v1` for the clients that
        read it, since taking a field away is a breaking change (docs/adr/0046 D7)
    created_at: {type: string, format: date-time}
    expires_at: {type: string, format: date-time}
    last_used_on:
      type: [string, 'null']
      format: date
    revoked_at:
      type: [string, 'null']
      format: date-time
    state:
      $ref: '#/TokenState'
  # An agent token restricted to a project; the deprecated restricted_project_id is still answered.
  example: &example-token
    id: 01a0a40b-5040-78e5-8344-63ccb2705d84
    name: Claude Code on the laptop
    scope: write
    agent: true
    capabilities: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
    restricted_team: acme
    restricted_tenant: acme
    restricted_project: WEB
    restricted_project_id: 019cadcb-2e60-7116-9641-67b17d11d0ef
    created_at: '2026-09-15T07:50:00Z'
    expires_at: '2026-12-14T07:50:00Z'
    last_used_on: '2026-10-06'
    revoked_at: null
    state: active
TokenCreate:
  type: object
  additionalProperties: false
  required: [name, scope]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Shown beside every act made through the token — in a ticket's activity, on its comments,
        questions, answers, files and time — to whoever reads the act, and kept there after the token is
        revoked (docs/adr/0036 D6)
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      default: false
      description: The agent flag; it cannot be changed afterwards (docs/adr/0036 D2)
    capabilities:
      type: array
      uniqueItems: true
      items:
        $ref: '#/Capability'
      description: Only with `agent`; omitted, an agent token gets every capability, and an empty list gives it none, the baseline only (docs/adr/0043 D4)
    team:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The slug of the team the token is restricted to
    tenant:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      deprecated: true
      description: |
        Deprecated, replaced by `team`, which it means; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7). Beside `team` it must name the
        same slug (`400 validation_failed` at `/team`)
    project:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}$'
      description: The key of the project of that team the token is restricted to; needs `team` or the deprecated `tenant`
    lifetime_days:
      type: integer
      minimum: 1
      maximum: 3650
      description: |
        Days until the token expires; by default `COWORK_TOKEN_DEFAULT_LIFETIME`,
        shortened to `COWORK_TOKEN_MAX_LIFETIME` when longer (docs/adr/0035 D4)
TokenCreated:
  description: A token as listed, and its plaintext in the answer that created it
  allOf:
    - $ref: '#/Token'
    - type: object
      properties:
        token:
          type: string
          description: |
            The plaintext, `cwk_` and 43 base62 characters, shown once: cowork
            keeps its SHA-256 only (docs/adr/0035 D1). An answer replayed for an
            `Idempotency-Key` leaves it out.
  # The plaintext is an example that no installation accepts.
  example:
    id: 01a0a40b-5040-78e5-8344-63ccb2705d84
    name: Claude Code on the laptop
    scope: write
    agent: true
    capabilities: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
    restricted_team: acme
    restricted_tenant: acme
    restricted_project: WEB
    restricted_project_id: 019cadcb-2e60-7116-9641-67b17d11d0ef
    created_at: '2026-09-15T07:50:00Z'
    expires_at: '2026-12-14T07:50:00Z'
    revoked_at: null
    state: active
    token: cwk_EXAMPLE000000000000000000000000000000000000
TokenList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Token'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
  example:
    items:
      - *example-token
      - id: 019fc77e-be00-7f86-be5e-47b14273332f
        name: Release notes script
        scope: read
        agent: false
        capabilities: []
        restricted_team: acme
        restricted_tenant: acme
        restricted_project: null
        created_at: '2026-08-03T12:00:00Z'
        expires_at: '2026-11-01T12:00:00Z'
        last_used_on: '2026-09-29'
        revoked_at: '2026-09-30T08:00:00Z'
        state: revoked
    next_cursor: null
MemberToken:
  type: object
  description: |
    A member's token that can act in the team, as its administrators see it (docs/adr/0035 D5):
    its person and its metadata, never its secret, hash or prefix
  required: [id, name, person, scope, agent, capabilities, restricted_team, restricted_tenant, restricted_project,
    created_at, expires_at, last_used_on, revoked_at, state]
  properties:
    id: {type: string, format: uuid}
    name:
      type: string
      description: The name its person gave it, free text that may say more than what it is for
    person:
      $ref: '#/Person'
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      description: The agent flag; every request of the token is an agent's (docs/adr/0036 D2)
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    restricted_team:
      type: [string, 'null']
      description: |
        This team's slug for a token restricted to it; null for an unrestricted token, which reaches
        every team its person belongs to, so revoking it ends it in all of them
    restricted_tenant:
      type: [string, 'null']
      deprecated: true
      description: Deprecated, replaced by `restricted_team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
    restricted_project:
      type: [string, 'null']
      description: The key of the project of this team the token is restricted to; null for none
    created_at: {type: string, format: date-time}
    expires_at: {type: string, format: date-time}
    last_used_on:
      type: [string, 'null']
      format: date
      description: The last day it was used, wherever; for an unrestricted token possibly in another team
    revoked_at:
      type: [string, 'null']
      format: date-time
    state:
      $ref: '#/TokenState'
MemberTokenList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/MemberToken'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
  # An unrestricted token of Grace Hopper, which reaches every team she belongs to, and the
  # agent token Ada Lovelace restricted to acme/WEB.
  example:
    items:
      - id: 01a0bef4-a820-745b-88d0-ad43226cfc47
        name: Release checks
        person: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
        scope: read
        agent: false
        capabilities: []
        restricted_team: null
        restricted_tenant: null
        restricted_project: null
        created_at: '2026-09-20T13:15:00Z'
        expires_at: '2026-12-19T13:15:00Z'
        last_used_on: '2026-10-05'
        revoked_at: null
        state: active
      - id: 01a0a40b-5040-78e5-8344-63ccb2705d84
        name: Claude Code on the laptop
        person: {id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3, username: ada, display_name: Ada Lovelace}
        scope: write
        agent: true
        capabilities: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
        restricted_team: acme
        restricted_tenant: acme
        restricted_project: WEB
        created_at: '2026-09-15T07:50:00Z'
        expires_at: '2026-12-14T07:50:00Z'
        last_used_on: '2026-10-06'
        revoked_at: null
        state: active
    next_cursor: null
CurrentToken:
  description: The token a request presents, and what it makes of the request (docs/adr/0043 D6)
  allOf:
    - $ref: '#/Token'
    - type: object
      required: [request]
      properties:
        request:
          $ref: '#/RequestMark'
  example:
    id: 01a0a40b-5040-78e5-8344-63ccb2705d84
    name: Claude Code on the laptop
    scope: write
    agent: true
    capabilities: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
    restricted_team: acme
    restricted_tenant: acme
    restricted_project: WEB
    restricted_project_id: 019cadcb-2e60-7116-9641-67b17d11d0ef
    created_at: '2026-09-15T07:50:00Z'
    expires_at: '2026-12-14T07:50:00Z'
    last_used_on: '2026-10-06'
    revoked_at: null
    state: active
    request:
      agent: true
      agent_mark: claude-code/claude-sonnet-4-5/4702cb1b-f7d1-4411-8c82-572d24a19911
      capabilities: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
RequestMark:
  type: object
  required: [agent, agent_mark, capabilities]
  properties:
    agent:
      type: boolean
      description: The request is an agent's, by the token's flag or by the X-Cowork-Agent header (docs/adr/0036 D2, D3)
    agent_mark:
      type: [string, 'null']
      description: The agent its acts record — the header's value, or unknown-agent; null for a person's request
    capabilities:
      type: array
      description: |
        What an agent's request may do beyond the baseline: the token's set for a flagged token,
        every capability for a plain token the header marks (docs/adr/0043 D4), the person's chat
        capabilities for a session the header marks (D5); empty for a person's request, which the
        capabilities do not bound
      items:
        $ref: '#/Capability'
Team:
  type: object
  required: [slug, name, version, time_visible_to_members, members_create_projects, created_at, updated_at]
  properties:
    slug: {type: string}
    name: {type: string}
    version: {type: integer}
    time_visible_to_members:
      type: boolean
      description: Members see every time entry of the projects they see, not only their own (docs/adr/0034 D5)
    time_locked_until:
      type: [string, 'null']
      format: date
      description: Time entries on or before this date cannot change (docs/adr/0017 D8)
    members_create_projects:
      type: boolean
      description: Members create projects; off, only administrators do (docs/adr/0034 D9)
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
  example:
    slug: acme
    name: Acme
    version: 4
    time_visible_to_members: true
    time_locked_until: '2026-09-30'
    members_create_projects: false
    created_at: '2026-03-02T08:45:00Z'
    updated_at: '2026-10-06T07:55:00Z'
TeamCreate:
  type: object
  additionalProperties: false
  required: [slug, name]
  properties:
    slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The team's public identifier, immutable and never reused (docs/adr/0005 D4)
    name: {type: string, minLength: 1, maxLength: 200}
TeamPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    time_visible_to_members: {type: boolean}
    time_locked_until:
      type: [string, 'null']
      format: date
    members_create_projects: {type: boolean}
Member:
  type: object
  required: [person, email, role, origins, local]
  description: A member with the effective role, the higher of the mapped and the granted one (docs/adr/0030 D4)
  properties:
    person:
      $ref: '#/Person'
    email:
      type: [string, 'null']
      description: |
        The address the identity provider asserted at the person's last login, which tells two
        persons of one name apart: for the team's administrators; null for anyone else, and for a
        person without one, such as a local account
    role:
      $ref: '#/Role'
    origins:
      type: array
      description: Every source of the membership with its own role, the mapping before the grant (docs/adr/0034 D7)
      items:
        $ref: '#/MembershipOrigin'
    local:
      type: boolean
      description: The person has a local account — a username and a password of their own — rather than an identity of the identity provider (docs/adr/0033)
  # As the team's administrators read a member: the address is theirs to see.
  example: &example-member
    person: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
    email: grace@acme.example
    role: member
    origins:
      - source: mapping
        role: member
    local: false
MemberList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Member'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
  example:
    items:
      - person: {id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3, username: ada, display_name: Ada Lovelace}
        email: null
        role: admin
        origins:
          - source: grant
            role: admin
        local: true
      - *example-member
      - person: {id: 019e165f-39c0-7937-931a-d0fa7735df32, username: sam, display_name: Sam Rivera}
        email: null
        role: member
        origins:
          - source: grant
            role: member
        local: true
    next_cursor: null
MemberAdd:
  type: object
  additionalProperties: false
  required: [person, role]
  properties:
    person:
      type: string
      minLength: 1
      maxLength: 320
      description: |
        An e-mail address — a value with `@`, compared without regard to case
        with the address the identity provider asserted at the person's last
        login — or a local account's username, with or without `local:`;
        trimmed, and a username lower-cased (docs/adr/0030 D3, docs/adr/0033 D2)
    role:
      $ref: '#/Role'
MemberGrantSet:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/Role'
GroupMapping:
  type: object
  required: [id, group, role, includes_caller, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    group:
      type: string
      description: The group's name, matched exactly and case-sensitively against the groups claim (docs/adr/0029 D2)
    role:
      $ref: '#/Role'
    includes_caller:
      type: boolean
      description: |
        The calling person's groups, as of their last login or groups refresh,
        include the group: changing or removing the mapping changes their own
        role (docs/adr/0030 D2)
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
  example: &example-group-mapping
    id: 019cb813-5280-79b9-b1f7-13a618f296e0
    group: acme-engineering
    role: member
    includes_caller: false
    version: 1
    created_at: '2026-03-04T09:00:00Z'
    updated_at: '2026-03-04T09:00:00Z'
GroupMappingCreate:
  type: object
  additionalProperties: false
  required: [group, role]
  properties:
    group:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(.*\S)?$'
      description: The group's name as the identity provider's claim carries it, case and all, with no white space at either end
    role:
      $ref: '#/Role'
GroupMappingPatch:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/Role'
GroupMappingList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupMapping'
    next_cursor:
      type: [string, 'null']
  example:
    items:
      - id: 019cb814-3ce0-7455-8a46-3f00097c193b
        group: acme-admins
        role: admin
        includes_caller: false
