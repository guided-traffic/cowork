    ticket:
      type: [string, 'null']
      description: The key of the ticket it waits on, when the caller can see that ticket
    external_ref: {type: [string, 'null']}
HorizonSet:
  type: object
  description: The horizon a person or an agent set on the ticket (docs/adr/0010 D3)
  required: [value, reason, at]
  properties:
    value:
      $ref: '#/Horizon'
    reason:
      type: [string, 'null']
      description: Null when a person set the horizon without one (docs/adr/0010 D3)
    by:
      description: Who set it; null for a horizon a migration kept, which nobody set
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    at: {type: string, format: date-time}
Ticket:
  type: object
  required: [id, key, project, number, type, title, body, state, block, severity, security, threat,
    horizon, horizon_set, effort, progress, progress_refinement, progress_review, progress_derived, parent,
    reporter, reporter_agent, reporter_token, assignee, confidential, opened_at, decided_at, done_at, done_from,
    done_by_hand, open_prerequisites, score, score_version, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    key:
      type: string
      description: The canonical key, <team>/<PROJECT>-<number> (docs/adr/0007 D2)
    project: {type: string, description: The project's key}
    number: {type: integer}
    type:
      $ref: '#/TicketType'
    title: {type: string}
    body: {type: string, description: 'Markdown, the current state, replaced as a whole (docs/adr/0011 D1)'}
    state:
      $ref: '#/TicketState'
    block:
      oneOf:
        - $ref: '#/Block'
        - type: 'null'
    severity:
      $ref: '#/Severity'
    security:
      $ref: '#/SecurityClass'
    threat: {type: [string, 'null']}
    horizon:
      $ref: '#/Horizon'
    horizon_set:
      description: The horizon a person or an agent set; null for a ticket nobody placed, which stands in later
      oneOf:
        - $ref: '#/HorizonSet'
        - type: 'null'
    effort:
      $ref: '#/Effort'
    progress:
      type: integer
      minimum: 0
      maximum: 100
      description: |
        The implementation stage, the work of in-progress; derived from the children while there are any
        (docs/adr/0017 D2, D3). Done leaves it as it is.
    progress_refinement:
      type: integer
      minimum: 0
      maximum: 100
      description: The refinement stage, the work of filed and analysed; derived like progress (docs/adr/0017 D2, D3)
    progress_review:
      type: integer
      minimum: 0
      maximum: 100
      description: The review stage, the work of review; derived like progress (docs/adr/0017 D2, D3)
    progress_derived:
      type: boolean
      description: The three stages are derived from the children and take no manual value; such a ticket is never done by them
    parent: {type: [string, 'null'], description: The parent's key}
    reporter:
      $ref: '#/Person'
    reporter_agent:
      type: [string, 'null']
      description: The agent mark of the request that filed the ticket in the reporter's name (docs/adr/0036 D6)
    reporter_token:
      description: The token the ticket was filed through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    assignee:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    confidential:
      type: boolean
      description: Visible to the team's administrators, the assignee and the reporter only (docs/adr/0065)
    opened_at: {type: string, format: date-time}
    decided_at: {type: [string, 'null'], format: date-time}
    done_at: {type: [string, 'null'], format: date-time}
    done_from:
      description: The state the ticket was done from, while it is done (docs/adr/0009 D5)
      oneOf:
        - $ref: '#/TicketState'
        - type: 'null'
    done_by_hand:
      type: boolean
      description: |
        Done by hand rather than by its three stages: the stages stay editable and the ticket stays
        done until the done by hand is withdrawn (docs/adr/0009 D5). False while the ticket is not done.
    open_prerequisites:
      type: integer
      minimum: 0
      description: |
        The open tickets that block this one and that the caller can see (docs/adr/0012 D7,
        docs/adr/0018 D1); a ticket the caller cannot see is never counted
    score:
      type: [number, 'null']
      format: double
      description: |
        The score at the moment of the read, to one decimal (docs/adr/0014 D3, D4): the weights of
        the severity, the horizon and the `need` and `urgent` stakes, plus one for every thirty days
        since `opened_at`. It warns where the facts disagree with the project's rank and orders the
        person-level lists; it never moves the rank. Null for a done or dropped ticket, and for one a
        release before the score filed until an input of it changes.
    score_version:
      type: [integer, 'null']
      description: The version of the function that computed `score` (docs/adr/0014 D4); null with it
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
  example: &example-ticket
    id: 01a0f687-f3a0-7516-87ab-709ca2b1c1e6
    key: acme/WEB-42
    project: WEB
    number: 42
