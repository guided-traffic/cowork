  type: string
  enum: [task, bug, feature, decision, question]
  description: docs/adr/0008 D1
TicketState:
  type: string
  enum: [filed, analysed, decided, in-progress, review, blocked, done, dropped]
  description: docs/adr/0009 D1
BlockKind:
  type: string
  enum: [decision, human, product, release, external, ticket]
  description: What a blocked ticket waits on (docs/adr/0009 D2)
Severity:
