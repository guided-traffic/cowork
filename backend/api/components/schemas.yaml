    content_url: /api/v1/teams/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content
AttachmentUsage:
  type: object
  description: What the team's attachments hold against its quota (docs/adr/0016 D6)
  required: [used_bytes, attachments, quota_bytes]
  properties:
    used_bytes: {type: integer, format: int64, description: 'The sizes of every attachment of the team, summed'}
    attachments: {type: integer, format: int64, description: How many attachments the team holds}
    quota_bytes:
      type: [integer, 'null']
      format: int64
      description: COWORK_ATTACHMENT_TEAM_QUOTA; null where the installation sets no quota
  example:
    used_bytes: 73400320
    attachments: 41
    quota_bytes: 10737418240
AttachmentConsistency:
  type: object
  description: |
    The team's latest consistency check of its attachments (docs/adr/0059 D4): the files whose
    metadata is there and whose bytes the bucket lacks — dangling — and the objects under the
    team's prefix that no metadata names — orphans —, with the counts exact and each list at most
    1000 entries long. `check_id` is null, and everything else of the check empty, while no check has
    run in the team. Beside it, `last_exported_at`: the second line of the team's backup
    (docs/adr/0059 D2).
  required: [check_id, checked_at, dangling, accepted, orphans, orphan_bytes, dangling_attachments, orphaned_objects,
    orphan_removal, last_exported_at]
  properties:
    check_id:
      type: [string, 'null']
      format: uuid
      description: The check's id, which a removal of its orphans or an acceptance of its missing files names
    checked_at: {type: [string, 'null'], format: date-time}
    dangling: {type: integer, description: The files whose bytes are missing and whose loss nobody accepted}
    accepted: {type: integer, description: The files whose bytes are missing and whose loss an administrator accepted}
    orphans: {type: integer, description: 'The objects no metadata names; after a confirmed removal, those its list did not show'}
    orphan_bytes: {type: integer, format: int64, description: "The orphans' sizes, summed"}
    dangling_attachments:
      type: array
      description: The missing files, those nobody accepted first, at most 1000
      items:
        $ref: '#/DanglingAttachment'
    orphaned_objects:
      type: array
      description: The orphans in key order, at most 1000; empty once their removal was confirmed
      items:
        $ref: '#/OrphanedObject'
    orphan_removal:
      description: The removal of this check's orphans an administrator confirmed; null before
      oneOf:
        - $ref: '#/OrphanRemovalRecord'
        - type: 'null'
    last_exported_at:
      type: [string, 'null']
      format: date-time
      description: |
        When a project of the team or the whole team was last exported, by anybody, as the act
        `exported` records it; a ticket's Markdown or context is no export of the team. Null while
        none was.
  # The night after a restore that brought the database back from an earlier point than the bucket.
  example:
    check_id: 01a10f27-5b80-71db-8b7c-37825a4703a9
    checked_at: '2026-10-06T03:00:00Z'
    dangling: 1
    accepted: 0
    orphans: 2
    orphan_bytes: 3145728
    dangling_attachments:
      - id: 019d8b83-2140-7968-843e-7c8e68771ec8
        file_name: invoice-2026-03.pdf
        size: 48213
        content_type: application/pdf
        ticket: acme/WEB-12
        ticket_deleted: false
        uploaded_at: '2026-04-14T10:22:00Z'
        accepted: false
    orphaned_objects:
      - key: 019cadb8-dee0-79ac-8a4f-eca5731cb386/01a108f7-7ec0-75ec-850e-015e6ae32ec8
        size: 2097152
        last_modified: '2026-10-04T22:10:00Z'
      - key: 019cadb8-dee0-79ac-8a4f-eca5731cb386/01a108f8-de50-7530-855f-d311b7302475
        size: 1048576
        last_modified: '2026-10-04T22:11:30Z'
    orphan_removal: null
    last_exported_at: '2026-10-06T02:30:04Z'
DanglingAttachment:
  type: object
  description: A file whose metadata is there and whose bytes the bucket lacks; its download answers 404 saying so
  required: [id, file_name, size, content_type, ticket, ticket_deleted, uploaded_at, accepted]
  properties:
    id: {type: string, format: uuid}
    file_name: {type: string}
    size: {type: integer, format: int64}
    content_type: {type: string}
    ticket: {type: string, description: 'The key of its ticket, team/PROJECT-number'}
    ticket_deleted: {type: boolean, description: The ticket is in the bin; the purge removes the file with it}
    uploaded_at: {type: string, format: date-time}
    accepted: {type: boolean, description: An administrator accepted the loss}
OrphanedObject:
  type: object
  description: An object under the team's prefix that no metadata names
  required: [key, size, last_modified]
  properties:
    key: {type: string, description: 'The object key in the bucket, <team-id>/<attachment-id> where it is one the backend wrote'}
    size: {type: integer, format: int64}
    last_modified: {type: string, format: date-time}
OrphanRemovalRecord:
  type: object
  required: [removed_at, removed_by, removed, kept]
  properties:
    removed_at: {type: string, format: date-time}
    removed_by:
      $ref: '#/Person'
    removed: {type: integer, description: The orphans whose removal was confirmed and tried}
    kept: {type: integer, description: The orphans that had gained metadata by then and were kept}
ConsistencyCheckRef:
  type: object
  description: The consistency check whose lists the administrator was shown
  required: [check_id]
  additionalProperties: false
  properties:
    check_id: {type: string, format: uuid}
OrphanRemoval:
  type: object
  description: What a confirmed removal of the orphans did, object by object
  required: [removed, kept, failed]
  properties:
    removed: {type: integer, description: 'Objects removed, or gone already'}
    kept: {type: integer, description: 'Objects that had gained metadata since the check: no orphans any more, kept'}
    failed: {type: integer, description: 'Objects whose removal failed; the log names each, and the next check lists them again'}
  example:
    removed: 2
    kept: 0
    failed: 0
DanglingAcceptance:
  type: object
  description: What an acceptance of the missing files did
  required: [accepted]
  properties:
    accepted: {type: integer, description: The files whose loss was accepted now}
  example:
    accepted: 1
AttachmentList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Attachment'
    next_cursor:
      type: [string, 'null']
  example:
    items:
      - *example-attachment
    next_cursor: null
TimeEntry:
  type: object
  required: [id, ticket, person, author, token, minutes, day, note, voided, voided_at, edited, version, created_at,
    updated_at]
  properties:
    id: {type: string, format: uuid}
    ticket: {type: string, description: The ticket's key}
    person:
      $ref: '#/Person'
    author:
      $ref: '#/Person'
    token:
      description: The token the booking came through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    minutes: {type: integer, minimum: 1, maximum: 1440}
    day: {type: string, format: date, description: The day worked}
