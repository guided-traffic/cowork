Problem:
  type: object
  required: [type, title, status, code]
  properties:
    type: {type: string}
    title: {type: string}
    status: {type: integer}
    detail: {type: string}
    instance: {type: string}
    code:
      $ref: './problem-codes.yaml#/ProblemCode'
    request_id: {type: string}
    errors:
      type: array
      items:
        $ref: '#/FieldError'
FieldError:
  type: object
  required: [pointer, message]
  properties:
    pointer:
      type: string
      description: |
        A JSON pointer into the body, or query:<name> / header:<name>; the refused execution of an
        import names a file of its upload as file:<path>
    message: {type: string}
    current:
      type: [string, number, integer, boolean, object, array, 'null']
      description: The server's current value of the field, on a 412; null when the field is empty
      x-go-type: interface{}
Version:
  type: object
  required: [version, commit, build_time]
  properties:
    version: {type: string}
    commit: {type: string}
    build_time: {type: string}
  example:
    version: 0.7.0
    commit: b4ceb2e
    build_time: '1791273600'
Role:
  type: string
  enum: [viewer, member, admin]
  description: A tenant role, lowest first (docs/adr/0034 D1)
Scope:
  type: string
  enum: [read, write, admin]
  description: A token's scope (docs/adr/0035 D3)
Capability:
  type: string
  enum: [decide, close, drop, rank, set-horizon, interest, upload, create-project, record-answer]
  description: An agent capability (docs/adr/0043 D4)
Person:
  type: object
  required: [id, display_name]
  properties:
    id: {type: string, format: uuid}
    username:
      type: [string, 'null']
      description: |
        A local account's username as it is stored, without the `local:` that names the identity
        (docs/adr/0032 D1, docs/adr/0033 D2); null for a person of the identity provider
    display_name: {type: string}
TokenMark:
  type: object
  description: |
    The personal access token an act came through (docs/adr/0036 D6): its id and its name as the act
    recorded it, readable by whoever reads the act — never the token's secret, hash or prefix. A
    revoked or expired token's acts keep its name.
  required: [id, name]
  properties:
    id: {type: string, format: uuid}
    name:
      type: [string, 'null']
      description: |
        The token's name; null only on an act of the activity recorded before cowork kept the name,
        which says that a token was used, not which one
TenantRef:
  type: object
  required: [slug, name]
  properties:
    slug: {type: string}
    name: {type: string}
TenantSummary:
  type: object
  required: [slug, name, role]
  properties:
    slug: {type: string}
    name: {type: string}
    role:
      description: |
        The role the caller holds in the tenant, the higher of their mapping and
        their grant; null where they hold none (docs/adr/0034 D2)
      oneOf:
        - $ref: '#/Role'
        - type: 'null'
TenantSummaryList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TenantSummary'
    next_cursor:
      type: [string, 'null']
Membership:
  type: object
  required: [tenant, role, origins]
  properties:
    tenant:
      $ref: '#/TenantRef'
    role:
      $ref: '#/Role'
    origins:
      type: array
      description: |
        Where the role comes from, each source with its own role; `role` is the
        higher of them (docs/adr/0030 D4)
      items:
        $ref: '#/MembershipOrigin'
MembershipSource:
  type: string
  enum: [mapping, grant]
  description: |
    How a membership came to be: derived from the person's groups by a group
    mapping, or granted by an administrator (docs/adr/0030 D2, D3)
MembershipOrigin:
  type: object
  required: [source, role]
  properties:
    source:
      $ref: '#/MembershipSource'
    role:
      $ref: '#/Role'
Me:
  type: object
  required: [id, display_name, global_admin, local, password_change_required, memberships]
  properties:
    id: {type: string, format: uuid}
    username: {type: [string, 'null']}
    display_name: {type: string}
    global_admin:
      type: boolean
      description: |
        The person is a global administrator: they create tenants and hold no role
        in any of them until they grant themselves one (docs/adr/0004 D4,
        docs/adr/0034 D2)
    local:
      type: boolean
      description: The person has a local account, a password of their own (docs/adr/0033)
    password_change_required:
      type: boolean
      description: |
        The account's password is temporary: a session can do nothing but change
        it, read this answer and log out until it has (docs/adr/0033 D4)
    memberships:
      type: array
      items:
        $ref: '#/Membership'
TokenState:
  type: string
  enum: [active, expired, revoked]
Token:
  type: object
  required: [id, name, scope, agent, capabilities, restricted_project, created_at, expires_at, state]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      description: The agent flag; every request of the token is an agent's (docs/adr/0036 D2)
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    restricted_tenant:
      type: [string, 'null']
      description: The slug of the tenant the token is restricted to
    restricted_project:
      type: [string, 'null']
      description: |
        The key of the project the token is restricted to (docs/adr/0035 D3); null for a token
        without a project restriction, and for one whose project the person no longer sees or
        whose tenant they no longer belong to — such a token reaches nothing
    restricted_project_id:
      type: [string, 'null']
      format: uuid
      deprecated: true
      description: |
        The id of the project the token is restricted to. Replaced by `restricted_project`, which
        names the project by its key, as a person knows it; kept in `/api/v1` for the clients that
        read it, since taking a field away is a breaking change (docs/adr/0046 D7)
    created_at: {type: string, format: date-time}
    expires_at: {type: string, format: date-time}
    last_used_on:
      type: [string, 'null']
      format: date
    revoked_at:
      type: [string, 'null']
      format: date-time
    state:
      $ref: '#/TokenState'
TokenCreate:
  type: object
  additionalProperties: false
  required: [name, scope]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Shown beside every act made through the token — in a ticket's activity, on its comments,
        questions, answers, files and time — to whoever reads the act, and kept there after the token is
        revoked (docs/adr/0036 D6)
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      default: false
      description: The agent flag; it cannot be changed afterwards (docs/adr/0036 D2)
    capabilities:
      type: array
      uniqueItems: true
      items:
        $ref: '#/Capability'
      description: Only with `agent`; omitted, an agent token gets every capability, and an empty list gives it none, the baseline only (docs/adr/0043 D4)
    tenant:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The slug of the tenant the token is restricted to
    project:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}$'
      description: The key of the project of that tenant the token is restricted to; needs `tenant`
    lifetime_days:
      type: integer
      minimum: 1
      maximum: 3650
      description: |
        Days until the token expires; by default `COWORK_TOKEN_DEFAULT_LIFETIME`,
        shortened to `COWORK_TOKEN_MAX_LIFETIME` when longer (docs/adr/0035 D4)
TokenCreated:
  description: A token as listed, and its plaintext in the answer that created it
  allOf:
    - $ref: '#/Token'
    - type: object
      properties:
        token:
          type: string
          description: |
            The plaintext, `cwk_` and 43 base62 characters, shown once: cowork
            keeps its SHA-256 only (docs/adr/0035 D1). An answer replayed for an
            `Idempotency-Key` leaves it out.
TokenList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Token'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
MemberToken:
  type: object
  description: |
    A member's token that can act in the tenant, as its administrators see it (docs/adr/0035 D5):
    its person and its metadata, never its secret, hash or prefix
  required: [id, name, person, scope, agent, capabilities, restricted_tenant, restricted_project, created_at,
    expires_at, last_used_on, revoked_at, state]
  properties:
    id: {type: string, format: uuid}
    name:
      type: string
      description: The name its person gave it, free text that may say more than what it is for
    person:
      $ref: '#/Person'
    scope:
      $ref: '#/Scope'
    agent:
      type: boolean
      description: The agent flag; every request of the token is an agent's (docs/adr/0036 D2)
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    restricted_tenant:
      type: [string, 'null']
      description: |
        This tenant's slug for a token restricted to it; null for an unrestricted token, which reaches
        every tenant its person belongs to, so revoking it ends it in all of them
    restricted_project:
      type: [string, 'null']
      description: The key of the project of this tenant the token is restricted to; null for none
    created_at: {type: string, format: date-time}
    expires_at: {type: string, format: date-time}
    last_used_on:
      type: [string, 'null']
      format: date
      description: The last day it was used, wherever; for an unrestricted token possibly in another tenant
    revoked_at:
      type: [string, 'null']
      format: date-time
    state:
      $ref: '#/TokenState'
MemberTokenList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/MemberToken'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
CurrentToken:
  description: The token a request presents, and what it makes of the request (docs/adr/0043 D6)
  allOf:
    - $ref: '#/Token'
    - type: object
      required: [request]
      properties:
        request:
          $ref: '#/RequestMark'
RequestMark:
  type: object
  required: [agent, agent_mark, capabilities]
  properties:
    agent:
      type: boolean
      description: The request is an agent's, by the token's flag or by the X-Cowork-Agent header (docs/adr/0036 D2, D3)
    agent_mark:
      type: [string, 'null']
      description: The agent its acts record — the header's value, or unknown-agent; null for a person's request
    capabilities:
      type: array
      description: |
        What an agent's request may do beyond the baseline: the token's set for a flagged token,
        every capability for a plain token the header marks (docs/adr/0043 D4), the person's chat
        capabilities for a session the header marks (D5); empty for a person's request, which the
        capabilities do not bound
      items:
        $ref: '#/Capability'
Tenant:
  type: object
  required: [slug, name, version, time_visible_to_members, members_create_projects, created_at, updated_at]
  properties:
    slug: {type: string}
    name: {type: string}
    version: {type: integer}
    time_visible_to_members:
      type: boolean
      description: Members see every time entry of the projects they see, not only their own (docs/adr/0034 D5)
    time_locked_until:
      type: [string, 'null']
      format: date
      description: Time entries on or before this date cannot change (docs/adr/0017 D8)
    members_create_projects:
      type: boolean
      description: Members create projects; off, only administrators do (docs/adr/0034 D9)
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
TenantCreate:
  type: object
  additionalProperties: false
  required: [slug, name]
  properties:
    slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      description: The tenant's public identifier, immutable and never reused (docs/adr/0005 D4)
    name: {type: string, minLength: 1, maxLength: 200}
TenantPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    time_visible_to_members: {type: boolean}
    time_locked_until:
      type: [string, 'null']
      format: date
    members_create_projects: {type: boolean}
Member:
  type: object
  required: [person, email, role, origins, local]
  description: A member with the effective role, the higher of the mapped and the granted one (docs/adr/0030 D4)
  properties:
    person:
      $ref: '#/Person'
    email:
      type: [string, 'null']
      description: |
        The address the identity provider asserted at the person's last login, which tells two
        persons of one name apart: for the tenant's administrators; null for anyone else, and for a
        person without one, such as a local account
    role:
      $ref: '#/Role'
    origins:
      type: array
      description: Every source of the membership with its own role, the mapping before the grant (docs/adr/0034 D7)
      items:
        $ref: '#/MembershipOrigin'
    local:
      type: boolean
      description: The person has a local account — a username and a password of their own — rather than an identity of the identity provider (docs/adr/0033)
MemberList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Member'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
MemberAdd:
  type: object
  additionalProperties: false
  required: [person, role]
  properties:
    person:
      type: string
      minLength: 1
      maxLength: 320
      description: |
        An e-mail address — a value with `@`, compared without regard to case
        with the address the identity provider asserted at the person's last
        login — or a local account's username, with or without `local:`;
        trimmed, and a username lower-cased (docs/adr/0030 D3, docs/adr/0033 D2)
    role:
      $ref: '#/Role'
MemberGrantSet:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/Role'
GroupMapping:
  type: object
  required: [id, group, role, includes_caller, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    group:
      type: string
      description: The group's name, matched exactly and case-sensitively against the groups claim (docs/adr/0029 D2)
    role:
      $ref: '#/Role'
    includes_caller:
      type: boolean
      description: |
        The calling person's groups, as of their last login or groups refresh,
        include the group: changing or removing the mapping changes their own
        role (docs/adr/0030 D2)
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
GroupMappingCreate:
  type: object
  additionalProperties: false
  required: [group, role]
  properties:
    group:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(.*\S)?$'
      description: The group's name as the identity provider's claim carries it, case and all, with no white space at either end
    role:
      $ref: '#/Role'
GroupMappingPatch:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/Role'
GroupMappingList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/GroupMapping'
    next_cursor:
      type: [string, 'null']
AuditAction:
  type: string
  enum: [created, updated, transitioned, linked, unlinked, commented, edited, withdrawn, assigned,
    interest, ranked, overridden, asked, answered, booked, voided, locked, uploaded, downloaded,
    exported, deleted, restored, purged, revoked, refused, archived, confidential_set,
    confidential_lifted, expired, logged_in, logged_out, login_failed, unlocked, password_changed,
    password_reset, deactivated, reactivated, read, merged, closed, reopened, accepted, imported]
AuditEvent:
  type: object
  required: [id, created_at, actor, entity_type, action]
  properties:
    id: {type: string, format: uuid}
    created_at: {type: string, format: date-time}
    actor:
      type: object
      description: A person, or a system actor such as system:idempotency-expiry
      properties:
        person:
          oneOf:
            - $ref: '#/Person'
            - type: 'null'
        system: {type: [string, 'null']}
    agent:
      type: [string, 'null']
      description: The agent mark, name/model/session or unknown-agent (docs/adr/0036)
    agent_capabilities:
      type: [array, 'null']
      items: {type: string}
    token_id:
      type: [string, 'null']
      format: uuid
    token_name:
      type: [string, 'null']
      description: |
        The token's name as the act recorded it (docs/adr/0036 D6); null without a token, and on an act
        recorded before cowork kept the name
    entity_type: {type: string}
    entity_id:
      type: [string, 'null']
      format: uuid
    ticket_key: {type: [string, 'null']}
    action:
      $ref: '#/AuditAction'
    before:
      description: The changed fields before the act
    after:
      description: The changed fields after the act
    reason: {type: [string, 'null']}
    note: {type: [string, 'null']}
    request_id:
      type: [string, 'null']
      format: uuid
    idempotency_key:
      type: [string, 'null']
      format: uuid
AuditList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/AuditEvent'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
WipLimits:
  type: object
  additionalProperties: false
  description: |
    Advisory work-in-progress limits per state; information, never a gate (docs/adr/0019 D3). The
    board's Refinement column, which holds filed and analysed, counts against the analysed limit.
  properties:
    analysed: {type: integer, minimum: 1}
    decided: {type: integer, minimum: 1}
    in-progress: {type: integer, minimum: 1}
    review: {type: integer, minimum: 1}
    blocked: {type: integer, minimum: 1}
Project:
  type: object
  required: [id, key, name, description, restricted, wip_limits, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    key: {type: string}
    name: {type: string}
    description: {type: string}
    restricted:
      type: boolean
      description: Visible to administrators and the people on its list only (docs/adr/0034 D3)
    wip_limits:
      $ref: '#/WipLimits'
    archived_at:
      type: [string, 'null']
      format: date-time
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
ProjectCreate:
  type: object
  additionalProperties: false
  required: [key, name]
  properties:
    key: {type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$'}
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: string, maxLength: 10000}
    wip_limits:
      $ref: '#/WipLimits'
    repository:
      $ref: '#/RepositoryBind'
ProjectPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: string, maxLength: 10000}
    wip_limits:
      $ref: '#/WipLimits'
ProjectList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Project'
    next_cursor:
      type: [string, 'null']
      description: The cursor of the next page; null at the end, and on a numbered page
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
ProjectRestrictionSet:
  type: object
  additionalProperties: false
  required: [restricted]
  properties:
    restricted:
      type: boolean
      description: True restricts the project to the administrators and its access list, false opens it to every member (docs/adr/0034 D3)
ProjectAccessRole:
  type: string
  enum: [viewer, member]
  description: The most a person on a restricted project's access list may do in it (docs/adr/0034 D3)
ProjectAccessEntry:
  type: object
  required: [person, email, role, created_at]
  description: A person on a project's access list; their role in the project is the lower of their tenant role and the entry's (docs/adr/0034 D3)
  properties:
    person:
      $ref: '#/Person'
    email:
      type: [string, 'null']
      description: |
        The address the identity provider asserted at the person's last login, which tells two
        persons of one name apart; null for a person without one, such as a local account. The
        access list is the tenant's administrators' to read.
    role:
      $ref: '#/ProjectAccessRole'
    created_at: {type: string, format: date-time}
ProjectAccessSet:
  type: object
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/ProjectAccessRole'
ProjectAccessList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/ProjectAccessEntry'
    next_cursor:
      type: [string, 'null']
ProjectRef:
  type: object
  required: [key, name]
  properties:
    key: {type: string}
    name: {type: string}
Repository:
  type: object
  required: [id, identity, path, remote, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    identity:
      type: string
      description: The normalised remote, host/path (docs/adr/0066 D1)
    path:
      type: string
      description: The sub-directory of a monorepo the binding covers; empty for the whole repository (docs/adr/0006 D3)
    remote:
      type: string
      description: The remote as it was last given, without credentials
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
RepositoryBind:
  type: object
  additionalProperties: false
  required: [remote]
  description: A repository to bind, by a remote URL that cowork normalises (docs/adr/0066 D1)
  properties:
    remote:
      type: string
      minLength: 1
      maxLength: 2000
      description: A git remote URL — SSH, scp-style, git or HTTP(S); its credentials are never stored
    path:
      type: string
      maxLength: 512
      description: A sub-directory of a monorepo, relative to its root; omitted, the whole repository
RepositoryList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Repository'
    next_cursor:
      type: [string, 'null']
LookupRemote:
  type: object
  required: [remote, identity]
  properties:
    remote:
      type: string
      description: The remote as it was given, without credentials
    identity:
      type: [string, 'null']
      description: Its normalised identity; null for a remote that names no host (docs/adr/0066 D1)
RepositoryBindingRef:
  type: object
  required: [tenant, project, identity, path, remote, archived]
  description: A project that binds the repository
  properties:
    tenant:
      $ref: '#/TenantRef'
    project:
      $ref: '#/ProjectRef'
    identity: {type: string}
    path: {type: string}
    remote: {type: string}
    archived:
      type: boolean
      description: The project is archived and refuses new tickets (docs/adr/0006 D4)
ProposalTenant:
  type: object
  required: [slug, name, key]
  properties:
    slug: {type: string}
    name: {type: string}
    key:
      type: string
      description: The project key proposed for this tenant, free there (docs/adr/0066 D2)
RepositoryProposal:
  type: object
  required: [identity, remote, name, tenant, tenants, reason]
  description: The project the agent proposes to create for an unbound repository (docs/adr/0066 D2, D3)
  properties:
    identity: {type: string}
    remote:
      type: string
      description: The remote to bind, as given, without credentials
    name:
      type: string
      description: The proposed project name, the repository's name
    tenant:
      type: [string, 'null']
      description: The proposed tenant's slug; null when the person chooses from `tenants`
    tenants:
      type: array
      description: The tenant proposed, or the tenants to choose from, each with the key that is free there
      items:
        $ref: '#/ProposalTenant'
    reason:
      type: string
      enum: [only-tenant, remote-owner, choose]
      description: |
        Why the tenant: the only one the caller may create projects in; the one that binds
        repositories under the same remote owner; or none chosen, the list to choose from
RepositoryLookup:
  type: object
  required: [status, remotes, bindings, proposal, proposal_unavailable]
  properties:
    status:
      type: string
      enum: [bound, ambiguous, unbound]
      description: One binding, several (a data error the person resolves, docs/adr/0066 D6), or none
    remotes:
      type: array
      items:
        $ref: '#/LookupRemote'
    bindings:
      type: array
      items:
        $ref: '#/RepositoryBindingRef'
    proposal:
      oneOf:
        - $ref: '#/RepositoryProposal'
        - type: 'null'
    proposal_unavailable:
      type: [string, 'null']
      description: Why an unbound repository has no proposal, when it has none
TicketType:
  type: string
  enum: [task, bug, feature, decision, question]
  description: docs/adr/0008 D1
TicketState:
  type: string
  enum: [filed, analysed, decided, in-progress, review, blocked, done, dropped]
  description: docs/adr/0009 D1
BlockKind:
  type: string
  enum: [decision, human, product, release, external, ticket]
  description: What a blocked ticket waits on (docs/adr/0009 D2)
Severity:
  type: string
  enum: [critical, high, medium, low, cosmetic]
SecurityClass:
  type: string
  enum: [live, boundary, hardening, none]
Horizon:
  type: string
  description: |
    The ticket's horizon, a planning category a person or an agent sets in whatever state the ticket
    is, and nothing else changes (docs/adr/0010 D3): now, to be worked on now; release, to be in the
    next release; next, taken up when now is empty; later, maybe some day; icebox, frozen until what
    it waits for changes
  enum: [now, release, next, later, icebox]
Effort:
  type: string
  enum: [XS, S, M, L]
Block:
  type: object
  required: [from, kind, reason]
  properties:
    from:
      $ref: '#/TicketState'
    kind:
      $ref: '#/BlockKind'
    reason: {type: string}
    ticket:
      type: [string, 'null']
      description: The key of the ticket it waits on, when the caller can see that ticket
    external_ref: {type: [string, 'null']}
HorizonSet:
  type: object
  description: The horizon a person or an agent set on the ticket (docs/adr/0010 D3)
  required: [value, reason, at]
  properties:
    value:
      $ref: '#/Horizon'
    reason:
      type: [string, 'null']
      description: Null when a person set the horizon without one (docs/adr/0010 D3)
    by:
      description: Who set it; null for a horizon a migration kept, which nobody set
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    at: {type: string, format: date-time}
Ticket:
  type: object
  required: [id, key, project, number, type, title, body, state, block, severity, security, threat,
    horizon, horizon_set, effort, progress, progress_refinement, progress_review, progress_derived, parent,
    reporter, reporter_agent, reporter_token, assignee, confidential, opened_at, decided_at, done_at, done_from,
    done_by_hand, open_prerequisites, score, score_version, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    key:
      type: string
      description: The canonical key, <tenant>/<PROJECT>-<number> (docs/adr/0007 D2)
    project: {type: string, description: The project's key}
    number: {type: integer}
    type:
      $ref: '#/TicketType'
    title: {type: string}
    body: {type: string, description: 'Markdown, the current state, replaced as a whole (docs/adr/0011 D1)'}
    state:
      $ref: '#/TicketState'
    block:
      oneOf:
        - $ref: '#/Block'
        - type: 'null'
    severity:
      $ref: '#/Severity'
    security:
      $ref: '#/SecurityClass'
    threat: {type: [string, 'null']}
    horizon:
      $ref: '#/Horizon'
    horizon_set:
      description: The horizon a person or an agent set; null for a ticket nobody placed, which stands in later
      oneOf:
        - $ref: '#/HorizonSet'
        - type: 'null'
    effort:
      $ref: '#/Effort'
    progress:
      type: integer
      minimum: 0
      maximum: 100
      description: |
        The implementation stage, the work of in-progress; derived from the children while there are any
        (docs/adr/0017 D2, D3). Done leaves it as it is.
    progress_refinement:
      type: integer
      minimum: 0
      maximum: 100
      description: The refinement stage, the work of filed and analysed; derived like progress (docs/adr/0017 D2, D3)
    progress_review:
      type: integer
      minimum: 0
      maximum: 100
      description: The review stage, the work of review; derived like progress (docs/adr/0017 D2, D3)
    progress_derived:
      type: boolean
      description: The three stages are derived from the children and take no manual value; such a ticket is never done by them
    parent: {type: [string, 'null'], description: The parent's key}
    reporter:
      $ref: '#/Person'
    reporter_agent:
      type: [string, 'null']
      description: The agent mark of the request that filed the ticket in the reporter's name (docs/adr/0036 D6)
    reporter_token:
      description: The token the ticket was filed through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    assignee:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    confidential:
      type: boolean
      description: Visible to the tenant's administrators, the assignee and the reporter only (docs/adr/0065)
    opened_at: {type: string, format: date-time}
    decided_at: {type: [string, 'null'], format: date-time}
    done_at: {type: [string, 'null'], format: date-time}
    done_from:
      description: The state the ticket was done from, while it is done (docs/adr/0009 D5)
      oneOf:
        - $ref: '#/TicketState'
        - type: 'null'
    done_by_hand:
      type: boolean
      description: |
        Done by hand rather than by its three stages: the stages stay editable and the ticket stays
        done until the done by hand is withdrawn (docs/adr/0009 D5). False while the ticket is not done.
    open_prerequisites:
      type: integer
      minimum: 0
      description: |
        The open tickets that block this one and that the caller can see (docs/adr/0012 D7,
        docs/adr/0018 D1); a ticket the caller cannot see is never counted
    score:
      type: [number, 'null']
      format: double
      description: |
        The score at the moment of the read, to one decimal (docs/adr/0014 D3, D4): the weights of
        the severity, the horizon and the `need` and `urgent` stakes, plus one for every thirty days
        since `opened_at`. It warns where the facts disagree with the project's rank and orders the
        person-level lists; it never moves the rank. Null for a done or dropped ticket, and for one a
        release before the score filed until an input of it changes.
    score_version:
      type: [integer, 'null']
      description: The version of the function that computed `score` (docs/adr/0014 D4); null with it
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
TicketCreate:
  type: object
  additionalProperties: false
  required: [type, title, severity, security, effort]
  properties:
    type:
      $ref: '#/TicketType'
    title: {type: string, minLength: 1, maxLength: 300}
    body: {type: string, maxLength: 200000}
    severity:
      $ref: '#/Severity'
    security:
      $ref: '#/SecurityClass'
    threat: {type: string, minLength: 1, maxLength: 2000}
    effort:
      $ref: '#/Effort'
    parent: {type: string, description: 'A ticket key of the same project, short or full'}
    assignee: {type: string, format: uuid, description: A member of the tenant}
    horizon:
      description: The horizon the ticket is filed into; later when left out (docs/adr/0010 D3)
      allOf:
        - $ref: '#/Horizon'
    after: {type: integer, minimum: 1, maximum: 2147483647, description: 'The open ticket of the same horizon this one is filed directly after; not with before'}
    before: {type: integer, minimum: 1, maximum: 2147483647, description: 'The open ticket of the same horizon this one is filed directly before; not with after'}
TicketPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    type:
      $ref: '#/TicketType'
    title: {type: string, minLength: 1, maxLength: 300}
    severity:
      $ref: '#/Severity'
    security:
      $ref: '#/SecurityClass'
    threat: {type: [string, 'null'], maxLength: 2000}
    effort:
      $ref: '#/Effort'
    parent: {type: [string, 'null'], description: 'A ticket key of the same project; null makes the ticket a root'}
    assignee: {type: [string, 'null'], format: uuid}
    progress:
      type: integer
      minimum: 0
      maximum: 100
      multipleOf: 5
      description: The implementation stage (docs/adr/0017 D2)
    progress_refinement: {type: integer, minimum: 0, maximum: 100, multipleOf: 5}
    progress_review: {type: integer, minimum: 0, maximum: 100, multipleOf: 5}
    note:
      type: string
      minLength: 1
      maxLength: 10000
      description: |
        The verification note the change needs when it brings the last of the three stages of a ticket
        without children to 100, which is the done act — what was run, against what, with what result
        (docs/adr/0009 D5); refused on any other change
    override_prerequisites:
      type: boolean
      description: |
        Close over open prerequisites, with a reason, when the change is the done act; a person's act,
        never an agent's (docs/adr/0012 D7)
    reason:
      type: string
      minLength: 1
      maxLength: 2000
      description: |
        Required when the change lowers a stage of a ticket done by its stages, which reopens it, and with
        override_prerequisites; recorded on the done act otherwise, refused on a change that moves no state
        (docs/adr/0009 D5)
    comment:
      type: string
      minLength: 1
      maxLength: 100000
      description: A comment that explains this act, written with it; the act points at it (docs/adr/0015 D2)
TicketBody:
  type: object
  required: [body, body_html, version]
  properties:
    body: {type: string, description: 'Markdown, as written (docs/adr/0011 D1)'}
    body_html:
      type: string
      description: |
        The body rendered and sanitised on the server (docs/adr/0011 D6); empty for an empty body
    version: {type: integer, description: The ticket's version the body belongs to}
TicketBodyReplace:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body: {type: string, maxLength: 200000}
    comment:
      type: string
      minLength: 1
      maxLength: 100000
      description: A comment that explains this act, written with it; the act points at it (docs/adr/0015 D2)
HorizonUpdate:
  type: object
  additionalProperties: false
  required: [value]
  properties:
    value:
      $ref: '#/Horizon'
    reason:
      type: string
      minLength: 1
      maxLength: 2000
      description: Optional for a person, required of an agent (docs/adr/0010 D3)
ConfidentialSet:
  type: object
  additionalProperties: false
  required: [confidential]
  properties:
    confidential: {type: boolean}
    reason: {type: string, minLength: 1, maxLength: 2000, description: Required to lift the flag (docs/adr/0065 D3)}
Transition:
  type: object
  additionalProperties: false
  required: [from, to]
  properties:
    from:
      $ref: '#/TicketState'
    to:
      $ref: '#/TicketState'
    reason:
      type: string
      minLength: 1
      maxLength: 2000
      description: |
        Required backward, into blocked (the block's text), to dropped, on a reopen, on the withdrawal of a
        done by hand, and with override_prerequisites
    note:
      type: string
      minLength: 1
      maxLength: 10000
      description: The verification note done requires — what was run, against what, with what result (docs/adr/0009 D5)
    block:
      $ref: '#/BlockSet'
    override_prerequisites:
      type: boolean
      description: Close over open prerequisites, with a reason; a person's act, never an agent's (docs/adr/0012 D7)
    comment:
      type: string
      minLength: 1
      maxLength: 100000
      description: A comment that explains this act, written with it; the act points at it (docs/adr/0015 D2)
TicketRankSet:
  type: object
  additionalProperties: false
  minProperties: 1
  maxProperties: 1
  description: Exactly one of after and before, the number of an open ticket of the same project (docs/adr/0014 D2)
  properties:
    after: {type: integer, minimum: 1, maximum: 2147483647, description: The ticket this one is placed directly after}
    before: {type: integer, minimum: 1, maximum: 2147483647, description: The ticket this one is placed directly before}
ProjectRankSort:
  type: object
  additionalProperties: false
  required: [by]
  description: What the project's rank is set to (docs/adr/0014 D3)
  properties:
    by:
      type: string
      enum: [score]
      description: The order the open tickets take — the score's, the one order there is to adopt
ProjectRankSorted:
  type: object
  required: [moved, score_version]
  properties:
    moved:
      type: integer
      minimum: 0
      description: How many of the open tickets the caller sees changed their place; 0 when the rank followed the score already
    score_version:
      type: integer
      description: The version of the score function the rank was sorted by (docs/adr/0014 D4)
BlockSet:
  type: object
  additionalProperties: false
  required: [kind]
  description: What a ticket entering blocked waits on (docs/adr/0009 D2)
  properties:
    kind:
      $ref: '#/BlockKind'
    ticket:
      type: string
      maxLength: 80
      description: The ticket it waits on, which gets a blocks link to this one; required with kind ticket
    external_ref: {type: string, minLength: 1, maxLength: 500}
Comment:
  type: object
  required: [id, author, agent, token, body, body_html, withdrawn, withdrawn_at, edited, explains, mentions, version,
    created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    author:
      $ref: '#/Person'
    agent: {type: [string, 'null'], description: The agent mark when an agent wrote it in the author's name}
    token:
      description: The token the act came through; null for a person's own browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    body: {type: [string, 'null'], description: 'Markdown; null once withdrawn (docs/adr/0015 D3)'}
    body_html:
      type: [string, 'null']
      description: |
        The body rendered and sanitised on the server, as the ticket's body is (docs/adr/0011 D6), beside
        the Markdown; null once withdrawn
    withdrawn: {type: boolean}
    withdrawn_at: {type: [string, 'null'], format: date-time}
    edited: {type: boolean, description: The comment has an edit history}
    explains:
      type: array
      description: The acts this comment explains (docs/adr/0015 D2)
      items:
        $ref: '#/AuditAction'
    mentions:
      type: array
      description: |
        The persons the comment mentions, by id (docs/adr/0015 D5): each was told, and watches the
        ticket while the comment stands; empty once it is withdrawn
      items: {type: string, format: uuid}
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
CommentWrite:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body: {type: string, minLength: 1, maxLength: 100000}
    mentions:
      type: array
      uniqueItems: true
      maxItems: 50
      items: {type: string, format: uuid}
      description: |
        The persons the comment mentions, by id (docs/adr/0015 D5 as amended 2026-10-05): each must be
        a member of the tenant who sees the ticket, else `400 validation_failed` at `/mentions/<i>`.
        Each is told in their inbox (`mentioned`) and watches the ticket while the comment stands. The
        text names them as the writer likes — the API reads no text, so a name typed without the list
        tells nobody. Left out of a new comment, nobody is mentioned; left out of an edit, the
        mentions stay as they are, and a list given replaces them — a person it adds is told, a person
        it drops is no longer a watcher by it.
CommentList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Comment'
    next_cursor:
      type: [string, 'null']
CommentRevision:
  type: object
  required: [body, edited_by, agent, token, at]
  properties:
    body: {type: string, description: The text before the edit}
    edited_by:
      $ref: '#/Person'
    agent: {type: [string, 'null'], description: The agent mark of the edit}
    token:
      description: The token the edit came through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    at: {type: string, format: date-time}
CommentRevisionList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/CommentRevision'
    next_cursor:
      type: [string, 'null']
Activity:
  type: object
  required: [id, at, actor, actor_system, agent, token, action, entity_type, entity_id, before, after, reason, note,
    explained_by_comment, redacted]
  properties:
    id: {type: string, format: uuid}
    at: {type: string, format: date-time}
    actor:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    actor_system: {type: [string, 'null']}
    agent: {type: [string, 'null']}
    token:
      description: The token the act came through; null for a person's own browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    action:
      $ref: '#/AuditAction'
    entity_type: {type: string}
    entity_id: {type: [string, 'null'], format: uuid}
    before:
      type: [object, 'null']
      description: The changed fields before the act; null when redacted
    after:
      type: [object, 'null']
      description: The changed fields after the act; null when redacted
    reason: {type: [string, 'null']}
    note: {type: [string, 'null']}
    explained_by_comment: {type: [string, 'null'], format: uuid}
    redacted:
      type: boolean
      description: The act names a ticket the caller cannot see; its payload, reason and note are withheld
ActivityList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Activity'
    next_cursor:
      type: [string, 'null']
Attachment:
  type: object
  required: [id, file_name, size, sha256, content_type, comment, uploaded_by, agent, token, created_at, content_url]
  properties:
    id: {type: string, format: uuid}
    file_name: {type: string, description: 'The uploaded name, sanitised (docs/adr/0016 D1)'}
    size: {type: integer, format: int64}
    sha256: {type: string, description: "The hex SHA-256 of the bytes, also the download's ETag"}
    content_type:
      type: string
      description: Detected from the bytes (docs/adr/0016 D3)
      enum: [image/png, image/jpeg, image/gif, image/webp, application/pdf, 'text/plain; charset=utf-8', image/svg+xml]
    comment: {type: [string, 'null'], format: uuid, description: The comment the attachment belongs to}
    uploaded_by:
      $ref: '#/Person'
    agent: {type: [string, 'null']}
    token:
      description: The token the act came through; null for a person's own browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    created_at: {type: string, format: date-time}
    content_url: {type: string, description: 'The download, through the backend only (docs/adr/0016 D4)'}
AttachmentUsage:
  type: object
  description: What the tenant's attachments hold against its quota (docs/adr/0016 D6)
  required: [used_bytes, attachments, quota_bytes]
  properties:
    used_bytes: {type: integer, format: int64, description: 'The sizes of every attachment of the tenant, summed'}
    attachments: {type: integer, format: int64, description: How many attachments the tenant holds}
    quota_bytes:
      type: [integer, 'null']
      format: int64
      description: COWORK_ATTACHMENT_TENANT_QUOTA; null where the installation sets no quota
AttachmentConsistency:
  type: object
  description: |
    The tenant's latest consistency check of its attachments (docs/adr/0059 D4): the files whose
    metadata is there and whose bytes the bucket lacks — dangling — and the objects under the
    tenant's prefix that no metadata names — orphans —, with the counts exact and each list at most
    1000 entries long. `check_id` is null, and everything else empty, while no check has run in the
    tenant.
  required: [check_id, checked_at, dangling, accepted, orphans, orphan_bytes, dangling_attachments, orphaned_objects,
    orphan_removal]
  properties:
    check_id:
      type: [string, 'null']
      format: uuid
      description: The check's id, which a removal of its orphans or an acceptance of its missing files names
    checked_at: {type: [string, 'null'], format: date-time}
    dangling: {type: integer, description: The files whose bytes are missing and whose loss nobody accepted}
    accepted: {type: integer, description: The files whose bytes are missing and whose loss an administrator accepted}
    orphans: {type: integer, description: 'The objects no metadata names; after a confirmed removal, those its list did not show'}
    orphan_bytes: {type: integer, format: int64, description: "The orphans' sizes, summed"}
    dangling_attachments:
      type: array
      description: The missing files, those nobody accepted first, at most 1000
      items:
        $ref: '#/DanglingAttachment'
    orphaned_objects:
      type: array
      description: The orphans in key order, at most 1000; empty once their removal was confirmed
      items:
        $ref: '#/OrphanedObject'
    orphan_removal:
      description: The removal of this check's orphans an administrator confirmed; null before
      oneOf:
        - $ref: '#/OrphanRemovalRecord'
        - type: 'null'
DanglingAttachment:
  type: object
  description: A file whose metadata is there and whose bytes the bucket lacks; its download answers 404 saying so
  required: [id, file_name, size, content_type, ticket, ticket_deleted, uploaded_at, accepted]
  properties:
    id: {type: string, format: uuid}
    file_name: {type: string}
    size: {type: integer, format: int64}
    content_type: {type: string}
    ticket: {type: string, description: 'The key of its ticket, tenant/PROJECT-number'}
    ticket_deleted: {type: boolean, description: The ticket is in the bin; the purge removes the file with it}
    uploaded_at: {type: string, format: date-time}
    accepted: {type: boolean, description: An administrator accepted the loss}
OrphanedObject:
  type: object
  description: An object under the tenant's prefix that no metadata names
  required: [key, size, last_modified]
  properties:
    key: {type: string, description: 'The object key in the bucket, <tenant-id>/<attachment-id> where it is one the backend wrote'}
    size: {type: integer, format: int64}
    last_modified: {type: string, format: date-time}
OrphanRemovalRecord:
  type: object
  required: [removed_at, removed_by, removed, kept]
  properties:
    removed_at: {type: string, format: date-time}
    removed_by:
      $ref: '#/Person'
    removed: {type: integer, description: The orphans whose removal was confirmed and tried}
    kept: {type: integer, description: The orphans that had gained metadata by then and were kept}
ConsistencyCheckRef:
  type: object
  description: The consistency check whose lists the administrator was shown
  required: [check_id]
  additionalProperties: false
  properties:
    check_id: {type: string, format: uuid}
OrphanRemoval:
  type: object
  description: What a confirmed removal of the orphans did, object by object
  required: [removed, kept, failed]
  properties:
    removed: {type: integer, description: 'Objects removed, or gone already'}
    kept: {type: integer, description: 'Objects that had gained metadata since the check: no orphans any more, kept'}
    failed: {type: integer, description: 'Objects whose removal failed; the log names each, and the next check lists them again'}
DanglingAcceptance:
  type: object
  description: What an acceptance of the missing files did
  required: [accepted]
  properties:
    accepted: {type: integer, description: The files whose loss was accepted now}
AttachmentList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Attachment'
    next_cursor:
      type: [string, 'null']
TimeEntry:
  type: object
  required: [id, ticket, person, author, token, minutes, day, note, voided, voided_at, edited, version, created_at,
    updated_at]
  properties:
    id: {type: string, format: uuid}
    ticket: {type: string, description: The ticket's key}
    person:
      $ref: '#/Person'
    author:
      $ref: '#/Person'
    token:
      description: The token the booking came through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    minutes: {type: integer, minimum: 1, maximum: 1440}
    day: {type: string, format: date, description: The day worked}
    note: {type: string}
    voided: {type: boolean, description: Kept and excluded from every sum (docs/adr/0017 D7)}
    voided_at: {type: [string, 'null'], format: date-time}
    edited: {type: boolean}
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
TimeEntryCreate:
  type: object
  additionalProperties: false
  required: [minutes, day]
  properties:
    minutes: {type: integer, minimum: 1, maximum: 1440}
    day: {type: string, format: date}
    note: {type: string, maxLength: 2000}
TimeEntryPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    minutes: {type: integer, minimum: 1, maximum: 1440}
    day: {type: string, format: date}
    note: {type: string, maxLength: 2000}
TimeEntryList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TimeEntry'
    next_cursor:
      type: [string, 'null']
    total_minutes: {type: integer, description: 'The visible minutes of the ticket, voided entries excluded'}
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
TimeEntryRevision:
  type: object
  required: [minutes, day, note, edited_by, token, at]
  properties:
    minutes: {type: integer}
    day: {type: string, format: date}
    note: {type: string}
    edited_by:
      $ref: '#/Person'
    token:
      description: The token the correction came through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    at: {type: string, format: date-time}
TimeEntryRevisionList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TimeEntryRevision'
    next_cursor:
      type: [string, 'null']
TimeReport:
  type: object
  required: [group_by, items, total_minutes]
  properties:
    group_by: {type: string, enum: [ticket, project, person, tenant]}
    items:
      type: array
      items:
        type: object
        required: [key, label, minutes]
        properties:
          key: {type: string, description: 'The ticket key, the project key, the person id, or tenant'}
          label: {type: string}
          minutes: {type: integer}
    total_minutes: {type: integer}
InterestWeight:
  type: string
  enum: [watch, need, urgent]
  description: docs/adr/0013 D1
Interest:
  type: object
  required: [person, weight, note, agent, token, since, updated_at, settled]
  properties:
    person:
      $ref: '#/Person'
    weight:
      $ref: '#/InterestWeight'
    note: {type: string}
    agent:
      type: [string, 'null']
      description: The agent mark of the write that set the stake as it stands, in the person's name (docs/adr/0036 D6)
    token:
      description: The token that write came through; null for the person's own browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    since: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
    settled: {type: boolean, description: The ticket is done or dropped; the stake stays on record (docs/adr/0013 D5)}
InterestSet:
  type: object
  additionalProperties: false
  required: [weight]
  properties:
    weight:
      $ref: '#/InterestWeight'
    note: {type: string, maxLength: 2000, description: Expected for need and urgent}
InterestList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Interest'
    next_cursor:
      type: [string, 'null']
QuestionStatus:
  type: string
  enum: [open, answered, withdrawn]
  description: docs/adr/0011 D2
Question:
  type: object
  required: [id, number, question, options, options_html, recommendation, answer, answer_html, status, asked_by,
    asked_by_agent, asked_by_token, asked_of, answered_by, answered_at, recorded_by_agent, answered_by_token,
    withdrawn_at, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    number: {type: integer, description: 'Stable within the ticket: Q<n> (docs/adr/0011 D4)'}
    question: {type: string}
    options: {type: string, description: 'Markdown: the context and the options'}
    options_html:
      type: string
      description: The options rendered and sanitised on the server (docs/adr/0011 D6); empty without options
    recommendation: {type: string}
    answer: {type: [string, 'null'], description: Markdown}
    answer_html:
      type: [string, 'null']
      description: The answer rendered and sanitised on the server (docs/adr/0011 D6); null without an answer
    status:
      $ref: '#/QuestionStatus'
    asked_by:
      $ref: '#/Person'
    asked_by_agent: {type: [string, 'null'], description: The agent mark of the request that asked}
    asked_by_token:
      description: The token the question was asked through; null for a browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    asked_of:
      description: The person asked; null for a question open in the tenant
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    answered_by:
      description: The person whose answer it is, also when an agent wrote it down
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    answered_at: {type: [string, 'null'], format: date-time}
    recorded_by_agent:
      type: boolean
      description: An agent wrote the person's answer down (docs/adr/0066 D8)
    answered_by_token:
      description: |
        The token the answer was recorded through, an agent's or the person's own; null for a browser
        session and while there is no answer (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    withdrawn_at: {type: [string, 'null'], format: date-time}
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
QuestionCreate:
  type: object
  additionalProperties: false
  required: [question]
  properties:
    question: {type: string, minLength: 1, maxLength: 2000}
    options: {type: string, maxLength: 100000}
    recommendation: {type: string, maxLength: 10000}
    asked_of:
      type: string
      format: uuid
      description: A member who can see the ticket; omitted, the question is open in the tenant
QuestionPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    question: {type: string, minLength: 1, maxLength: 2000}
    options: {type: string, maxLength: 100000}
    recommendation: {type: string, maxLength: 10000}
    asked_of: {type: [string, 'null'], format: uuid}
AnswerSet:
  type: object
  additionalProperties: false
  required: [answer]
  properties:
    answer: {type: string, minLength: 1, maxLength: 100000}
QuestionList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Question'
    next_cursor:
      type: [string, 'null']
LinkType:
  type: string
  enum: [blocks, relates-to, duplicates, found-in]
  description: docs/adr/0012 D1
TicketRef:
  type: object
  required: [key, title, state]
  properties:
    key: {type: string}
    title: {type: string}
    state:
      $ref: '#/TicketState'
Link:
  type: object
  required: [id, type, direction, name, ticket, created_by, created_at]
  properties:
    id: {type: string, format: uuid}
    type:
      $ref: '#/LinkType'
    direction:
      type: string
      enum: [outgoing, incoming]
      description: Outgoing when the ticket read is the link's source; relates-to is stored once
    name:
      type: string
      description: 'The link read from this ticket: blocks, blocked by, relates to, duplicates, duplicated by, found in, found here'
    ticket:
      $ref: '#/TicketRef'
    created_by:
      $ref: '#/Person'
    created_at: {type: string, format: date-time}
LinkList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Link'
    next_cursor:
      type: [string, 'null']
PullRequestKind:
  type: string
  enum: [pull_request, commit]
  description: A pull request, or a commit on the repository's default branch (docs/adr/0071 D6)
PullRequestState:
  type: string
  enum: [open, closed, merged]
  description: The pull request's state as GitHub last told it; a commit on the default branch is merged
PullRequestFoundIn:
  type: string
  enum: [trailer, body, subject]
  description: |
    Where the key was read (docs/adr/0068 D1, D2, D5): a `Cowork-Ticket:` trailer line, a line of a pull
    request's body that is a full key alone, or the short keys in parentheses at the end of a pull
    request's title or a commit's subject
PullRequest:
  type: object
  description: A pull request or a default-branch commit GitHub's webhook linked to the ticket (docs/adr/0071 D6)
  required: [id, kind, repository, number, sha, title, state, url, author, merged_at, found_in, first_seen_at,
    last_seen_at]
  properties:
    id: {type: string, format: uuid, description: The link's id}
    kind:
      $ref: '#/PullRequestKind'
    repository: {type: string, description: 'The repository''s identity, host/path (docs/adr/0066 D1)'}
    number: {type: [integer, 'null'], description: The pull request's number; null for a commit}
    sha: {type: [string, 'null'], description: The commit's id; null for a pull request}
    title: {type: string, description: 'The pull request''s title, or the commit''s subject, as GitHub sent it'}
    state:
      $ref: '#/PullRequestState'
    url:
      type: string
      description: |
        The pull request's or the commit's page at GitHub, written from the bound repository's
        identity, never taken from a payload
    author: {type: [string, 'null'], description: 'The author''s GitHub login, where GitHub named one'}
    merged_at:
      type: [string, 'null']
      format: date-time
      description: When the pull request was merged, or the commit reached the default branch; null otherwise
    found_in:
      $ref: '#/PullRequestFoundIn'
    first_seen_at: {type: string, format: date-time, description: When a delivery first linked it to the ticket}
    last_seen_at: {type: string, format: date-time, description: When a delivery last told of it}
PullRequestList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/PullRequest'
    next_cursor:
      type: [string, 'null']
GitHubSecret:
  type: object
  description: The tenant's GitHub webhook secret as its administrators read it — never the secret itself
  required: [created_at, created_by]
  properties:
    created_at: {type: string, format: date-time, description: When it was made or last rotated}
    created_by:
      $ref: '#/Person'
GitHubIntegration:
  type: object
  required: [secret, webhook_path, events]
  properties:
    secret:
      description: The secret's metadata; null while the tenant has none, and then the endpoint answers like an unknown tenant
      oneOf:
        - $ref: '#/GitHubSecret'
        - type: 'null'
    webhook_path:
      type: string
      description: The endpoint's path, which GitHub posts to under the installation's `COWORK_BASE_URL`
    events:
      type: array
      description: The events to choose in GitHub's webhook settings; every other is taken and passed over
      items: {type: string}
GitHubSecretCreated:
  type: object
  required: [secret, created_at, created_by, replaced]
  properties:
    secret:
      type: string
      description: |
        The new secret, 64 hexadecimal characters, shown in this answer only: give it to GitHub as the
        webhook's secret. cowork keeps it sealed and never shows it again (docs/adr/0071 D1)
    created_at: {type: string, format: date-time}
    created_by:
      $ref: '#/Person'
    replaced:
      type: boolean
      description: A secret existed and is replaced; a delivery signed with it is refused from now on
PrerequisiteNode:
  type: object
  description: A ticket of a prerequisite tree, or of its upward reading, the dependents (docs/adr/0012 D6)
  required: [key, title, state, blocked_from, assignee, progress, progress_refinement, progress_review,
    progress_derived, depth, settled, repeated]
  properties:
    key: {type: string, description: 'The canonical key; a ticket of another project names it'}
    title: {type: string}
    state:
      $ref: '#/TicketState'
    blocked_from:
      description: The state a blocked ticket came from; null unless it is blocked (docs/adr/0009 D2)
      oneOf:
        - $ref: '#/TicketState'
        - type: 'null'
    assignee:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    progress: {type: integer, minimum: 0, maximum: 100, description: 'The implementation stage as the ticket shows it (docs/adr/0017 D2, D3)'}
    progress_refinement: {type: integer, minimum: 0, maximum: 100}
    progress_review: {type: integer, minimum: 0, maximum: 100}
    progress_derived: {type: boolean, description: The stages are derived from the ticket's children}
    depth:
      type: integer
      minimum: 1
      maximum: 8
      description: 1 for a ticket next to the one asked about — blocking it, or blocked by it read upward
    settled: {type: boolean, description: Done or dropped (docs/adr/0012 D6)}
    repeated:
      type: boolean
      description: The ticket stands in the tree in full under another ticket; here it is shown without what lies behind it
PrerequisiteTree:
  type: object
  required: [items, next_cursor, open]
  properties:
    items:
      type: array
      items:
        $ref: '#/PrerequisiteNode'
    next_cursor:
      type: [string, 'null']
    open:
      type: integer
      minimum: 0
      description: The open tickets of the whole tree the caller can see, each counted once, on every page
TicketList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Ticket'
    next_cursor:
      type: [string, 'null']
    total: {type: integer, description: With page and per_page only}
    page: {type: integer}
    per_page: {type: integer}
DeletedTicket:
  type: object
  description: |
    A ticket in its tenant's bin (docs/adr/0024 D1): what an administrator needs to restore or
    purge it.
  required: [key, project, number, type, title, state, confidential, deleted_at, deleted_by, purge_at]
  properties:
    key: {type: string, description: '<tenant>/<PROJECT>-<number>'}
    project: {type: string}
    number: {type: integer}
    type:
      $ref: '#/TicketType'
    title: {type: string}
    state:
      $ref: '#/TicketState'
    confidential: {type: boolean}
    deleted_at: {type: string, format: date-time}
    deleted_by:
      $ref: '#/Person'
    purge_at:
      type: string
      format: date-time
      description: When the purge job removes it for good, thirty days after the deletion (docs/adr/0024 D2)
DeletedTicketList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/DeletedTicket'
    next_cursor:
      type: [string, 'null']
SavedFilterParameters:
  type: object
  description: |
    The filter parameters of the ticket lists (docs/adr/0049 D1, D2) as a JSON object: each
    repeatable parameter an array of its values — `!` negates one —, the bounds and the booleans
    single values. What a list's query string would carry, without the paging.
  additionalProperties: false
  properties:
    project: {type: array, maxItems: 50, items: {type: string, maxLength: 16}}
    state: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    type: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    severity: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    security: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    horizon: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    effort: {type: array, maxItems: 50, items: {type: string, maxLength: 32}}
    assignee: {type: array, maxItems: 50, items: {type: string, maxLength: 64}}
    reporter: {type: array, maxItems: 50, items: {type: string, maxLength: 64}}
    parent: {type: array, maxItems: 50, items: {type: string, maxLength: 80}}
    interest: {type: array, maxItems: 50, items: {type: string, maxLength: 8}}
    progress_min: {type: integer, minimum: 0, maximum: 100}
    progress_max: {type: integer, minimum: 0, maximum: 100}
    opened_after: {type: string, format: date-time}
    opened_before: {type: string, format: date-time}
    updated_after: {type: string, format: date-time}
    updated_before: {type: string, format: date-time}
    done_after: {type: string, format: date-time}
    q: {type: string, minLength: 1, maxLength: 4096}
    include_terminal: {type: boolean}
    blocked: {type: boolean}
    has_open_questions: {type: boolean}
SavedFilterWarning:
  type: object
  description: A value of a saved filter that does not hold any more, checked as the filter is read (docs/adr/0049 D7)
  required: [parameter, message]
  properties:
    parameter: {type: string}
    message: {type: string}
SavedFilter:
  type: object
  required: [id, name, owner, shared, parameters, redacted, warnings, version, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    owner:
      $ref: '#/Person'
    shared: {type: boolean, description: 'Shown to every member of the tenant, with its owner'}
    parameters:
      $ref: '#/SavedFilterParameters'
    redacted:
      type: boolean
      description: |
        Another person's filter names a project or a ticket the caller cannot see, or one that no
        longer exists; its parameters and warnings are withheld (docs/adr/0065 D5)
    warnings:
      type: array
      items:
        $ref: '#/SavedFilterWarning'
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
SavedFilterCreate:
  type: object
  additionalProperties: false
  required: [name, parameters]
  properties:
    name: {type: string, minLength: 1, maxLength: 100}
    parameters:
      $ref: '#/SavedFilterParameters'
    shared: {type: boolean, default: false}
SavedFilterPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name: {type: string, minLength: 1, maxLength: 100}
    parameters:
      $ref: '#/SavedFilterParameters'
    shared: {type: boolean}
SavedFilterList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/SavedFilter'
    next_cursor:
      type: [string, 'null']
AuthOptions:
  type: object
  required: [local, oidc, oidc_name, password_min_length, token_max_lifetime_days]
  properties:
    local:
      type: boolean
      description: An active local account exists, so the login page shows the local form (docs/adr/0033 D8)
    oidc:
      type: boolean
      description: |
        The login page shows the identity provider's button: one is configured,
        and `COWORK_OIDC_ALLOWED_GROUPS` or `COWORK_ADMIN_GROUP` names a group —
        without either nobody may log in through it (docs/adr/0030 D1, D8)
    oidc_name:
      type: [string, 'null']
      description: The provider's name on the button, "Sign in with <oidc_name>", `COWORK_OIDC_DISPLAY_NAME`; null without a provider
    password_min_length:
      type: integer
      minimum: 1
      description: The shortest password a local account may have, `COWORK_PASSWORD_MIN_LENGTH` (docs/adr/0033 D3); a form that sets or generates a password follows it
    token_max_lifetime_days:
      type: integer
      minimum: 0
      description: |
        The longest lifetime a new token gets, `COWORK_TOKEN_MAX_LIFETIME`, in whole days, rounded
        down (docs/adr/0035 D4): a longer `lifetime_days` is shortened to the maximum. 0 when the
        maximum is shorter than a day, and then only the default, `lifetime_days` left out, fits. A
        form that asks for a lifetime offers at most this and the 3650 days `lifetime_days` takes
LocalLoginRequest:
  type: object
  additionalProperties: false
  required: [username, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 200
      description: Trimmed and lower-cased by the server; a value that cannot be a username is a failed login like any other
    password:
      type: string
      minLength: 1
      maxLength: 1024
LocalLoginResult:
  type: object
  required: [password_change_required]
  properties:
    password_change_required:
      type: boolean
      description: The password is temporary and has to be changed before anything else (docs/adr/0033 D4)
LogoutResult:
  type: object
  required: [end_session_url]
  properties:
    end_session_url:
      type: string
      description: |
        The issuer's `end_session_endpoint` with `client_id` and
        `post_logout_redirect_uri`; the browser navigates there to end its
        session at the identity provider too (docs/adr/0031 D4)
PasswordChange:
  type: object
  additionalProperties: false
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      minLength: 1
      maxLength: 1024
    new_password:
      type: string
      minLength: 1
      maxLength: 1024
      description: At least `COWORK_PASSWORD_MIN_LENGTH` characters, and not the current password (docs/adr/0033 D3)
Account:
  type: object
  required: [id, username, display_name, role, password_change_required, locked, deactivated_at, created_at]
  properties:
    id: {type: string, format: uuid}
    username: {type: string}
    display_name: {type: string}
    role:
      description: The person's highest role in this tenant; null when they have none any more
      oneOf:
        - $ref: '#/Role'
        - type: 'null'
    password_change_required:
      type: boolean
      description: The password is temporary and its person has not changed it yet
    locked:
      type: boolean
      description: Failed logins locked the account at the moment (docs/adr/0033 D6)
    deactivated_at:
      type: [string, 'null']
      format: date-time
    created_at: {type: string, format: date-time}
AccountList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Account'
    next_cursor:
      type: [string, 'null']
AccountCreate:
  type: object
  additionalProperties: false
  required: [username, display_name, temporary_password, role]
  properties:
    username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
      description: The account's identity is `local:<username>`, unique in the installation (docs/adr/0033 D2)
    display_name: {type: string, minLength: 1, maxLength: 200}
    temporary_password:
      type: string
      minLength: 1
      maxLength: 1024
      description: At least `COWORK_PASSWORD_MIN_LENGTH` characters; the person changes it at the first login (docs/adr/0033 D3, D4)
    role:
      $ref: '#/Role'
AccountPasswordReset:
  type: object
  additionalProperties: false
  required: [temporary_password]
  properties:
    temporary_password:
      type: string
      minLength: 1
      maxLength: 1024
ChatProviderKind:
  type: string
  enum: [openai, anthropic]
  description: |
    The wire format a configured provider speaks (COWORK_CHAT_<ID>_KIND): OpenAI Chat Completions,
    which OpenAI, LM Studio, Ollama and vLLM speak, or the Anthropic Messages API (docs/adr/0076)
ChatProviderId:
  type: string
  minLength: 1
  maxLength: 32
  pattern: '^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$'
  description: A configured provider's id, as COWORK_CHAT_PROVIDERS names it
ChatProvider:
  type: object
  required: [id, name, kind, model]
  description: |
    A provider the operator configured (COWORK_CHAT_PROVIDERS): what the person picks in the panel.
    Its address and key are never shown
  properties:
    id:
      $ref: '#/ChatProviderId'
    name:
      type: string
      description: The provider's name for the person (COWORK_CHAT_<ID>_NAME)
    kind:
      $ref: '#/ChatProviderKind'
    model:
      type: string
      description: The model by the name its provider knows it (COWORK_CHAT_<ID>_MODEL)
ChatUnavailableReason:
  type: string
  enum: [not_configured]
  description: Why the chat is not available — the installation configures no provider
ChatAvailability:
  type: object
  required: [available, providers, reason]
  properties:
    available:
      type: boolean
      description: The members of the tenant may hold a conversation (POST …/chat)
    providers:
      type: array
      description: The configured providers in the configured order, the first the default of a turn; empty without one
      items:
        $ref: '#/ChatProvider'
    reason:
      description: Why the chat is not available; null when it is
      oneOf:
        - $ref: '#/ChatUnavailableReason'
        - type: 'null'
ChatRole:
  type: string
  enum: [user, assistant, tool]
  description: Whom a message of the chat is from — the person, the model, or a tool answering the model
ChatToolArguments:
  type: object
  additionalProperties: true
  description: A tool call's arguments as the model gave them, a JSON object; the tool's schema decides what they mean
  # The generated Go keeps the arguments as they came; the generated file
  # imports encoding/json already.
  x-go-type: json.RawMessage
ChatToolCall:
  type: object
  additionalProperties: false
  required: [id, name, arguments]
  description: A call of a tool the model made
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 128
      description: The call's id, which the tool message answering it names
    name: {type: string, minLength: 1, maxLength: 128, description: The tool's name}
    arguments:
      $ref: '#/ChatToolArguments'
ChatMessage:
  type: object
  additionalProperties: false
  required: [role]
  description: |
    One message of a conversation, in the neutral model the backend translates for its provider. A
    `user` message carries `text`, what the person wrote; an `assistant` message `text`, what the model
    said, and `tool_calls`, the calls it made — at least one of the two; a `tool` message
    `tool_call_id`, the call it answers, `ok`, and `text`, the answer the model read. There is no
    system message: the backend writes the model's instructions on every turn (docs/adr/0076).
  properties:
    role:
      $ref: '#/ChatRole'
    text: {type: string, maxLength: 100000}
    tool_calls:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/ChatToolCall'
    tool_call_id: {type: string, minLength: 1, maxLength: 128}
    ok:
      type: boolean
      description: On a tool message, whether the call succeeded; a refusal of the API is a failure the model reads
ChatPageContext:
  type: object
  additionalProperties: false
  description: |
    The page the person is on as they send the turn: the model's instructions name it, and a short
    key the model uses resolves against its project
  properties:
    path:
      type: string
      maxLength: 256
      pattern: '^/[A-Za-z0-9/._~-]*$'
      description: The page's path in this UI, without query or fragment, such as /t/acme/p/COW/board
    project:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}$'
      description: The key of the project the page shows
    ticket:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,9}$'
      description: The short key of the ticket the page shows, <PROJECT>-<number>
ChatTurn:
  type: object
  additionalProperties: false
  required: [conversation, messages]
  properties:
    conversation:
      type: string
      format: uuid
      description: |
        The conversation's id, made by the client when the conversation begins and sent with each of
        its turns; the agent mark of the tool calls carries it, so the activity tells one
        conversation's acts from another's (docs/adr/0036 D3)
    provider:
      $ref: '#/ChatProviderId'
      description: The provider the turn talks to, one GET …/chat lists; the first configured when left out
    messages:
      type: array
      minItems: 1
      maxItems: 400
      description: |
        The conversation so far, oldest first: the person's messages and what the `done` events
        added. It ends with the person's new message
      items:
        $ref: '#/ChatMessage'
    context:
      $ref: '#/ChatPageContext'
ChatTextEvent:
  type: object
  required: [delta]
  description: The data of a chat turn's event `text`
  properties:
    delta:
      type: string
      description: The next piece of the assistant's text, to be appended to the pieces before it
ChatToolResultEvent:
  type: object
  required: [id, ok, summary]
  description: The data of a chat turn's event `tool_result`
  properties:
    id: {type: string, description: The id of the call it answers}
    ok:
      type: boolean
      description: |
        The call succeeded; false for a refusal of the API, which the model reads like any answer
    summary:
      type: string
      description: |
        The start of what the tool answered, Markdown as the tool wrote it, at most 2000 characters;
        the whole answer is the text of the tool message in `done`
ChatUiAction:
  type: string
  enum: [navigate]
  description: What a UI tool of the chat asks the client to do
ChatUiEvent:
  type: object
  required: [action, path]
  description: The data of a chat turn's event `ui`
  properties:
    action:
      $ref: '#/ChatUiAction'
    path:
      type: string
      description: |
        The page to show, a path of this UI in the turn's tenant: /t/<tenant>/tickets/<PROJECT>-<number>,
        /t/<tenant>/p/<PROJECT>/backlog or /t/<tenant>/p/<PROJECT>/board
ChatTurnEnd:
  type: string
  enum: [answered, step_limit, stopped, error]
  description: |
    Why a turn ended: the model answered; the turn reached COWORK_CHAT_MAX_STEPS calls of the model,
    and a new message goes on; the person stopped it (DELETE …/chat/turns); or an `error` event came
    before
ChatDoneEvent:
  type: object
  required: [messages, reason]
  description: The data of a chat turn's event `done`, the last of every turn
  properties:
    messages:
      type: array
      description: The messages the turn added, to be appended to the conversation as they are
      items:
        $ref: '#/ChatMessage'
    reason:
      $ref: '#/ChatTurnEnd'
ChatCapabilities:
  type: object
  required: [capabilities, chosen]
  description: |
    The capabilities the chat's requests hold (docs/adr/0043 D5): what the chat may do beyond the
    baseline, as the person chose it
  properties:
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    chosen:
      type: boolean
      description: |
        The person chose the set; false is the default, every capability but decide, close, drop and
        record-answer
ChatCapabilitiesUpdate:
  type: object
  additionalProperties: false
  required: [capabilities]
  properties:
    capabilities:
      type: array
      uniqueItems: true
      maxItems: 9
      description: The whole set; an empty one leaves the chat the baseline
      items:
        $ref: '#/Capability'
InboxReason:
  type: string
  enum: [assigned, asked, answered, state_changed, blocker_closed, commented, urgent, mentioned, merged]
  description: |
    Why the person is told (docs/adr/0020 D2): a ticket assigned to them, a question asked of them, a
    question they asked answered, a ticket they watch changed state or got a comment, a ticket that
    blocks one they watch reached done or dropped, an urgent stake on a ticket assigned to them, a
    comment that mentions them (docs/adr/0015 D5), a pull request of a ticket they watch or that is
    assigned to them merged (docs/adr/0071 D6) — its state unchanged, the move a person's
InboxEntry:
  type: object
  required: [id, tenant, ticket, reason, act, blocker, withdrawn, read, created_at]
  properties:
    id: {type: string, format: uuid}
    tenant:
      $ref: '#/TenantRef'
    ticket:
      $ref: '#/TicketRef'
    reason:
      $ref: '#/InboxReason'
    act:
      $ref: '#/Activity'
    blocker:
      description: For `blocker_closed`, the ticket that blocked this one and reached done or dropped, as it is now; null otherwise
      oneOf:
        - $ref: '#/TicketRef'
        - type: 'null'
    withdrawn:
      type: boolean
      description: The comment or question the act is on has been withdrawn since
    read: {type: boolean}
    created_at: {type: string, format: date-time}
InboxList:
  type: object
  required: [items, next_cursor, unread]
  properties:
    items:
      type: array
      items:
        $ref: '#/InboxEntry'
    next_cursor:
      type: [string, 'null']
    unread:
      type: integer
      description: The person's unread notifications in the tenants the request reaches
InboxState:
  type: object
  required: [unread]
  properties:
    unread: {type: integer}
InboxReadThrough:
  type: object
  additionalProperties: false
  required: [through]
  properties:
    through:
      type: string
      format: uuid
      description: The newest notification the person saw; it and every older one are marked read
MyTicket:
  type: object
  required: [tenant, ticket, place]
  properties:
    tenant:
      $ref: '#/TenantRef'
    ticket:
      $ref: '#/Ticket'
    place:
      type: integer
      minimum: 1
      description: |
        The ticket's place in its project's rank among the open tickets of its horizon the caller can
        see, 1 for the first — where the backlog's group shows it: the secondary indicator beside the
        score's order (docs/adr/0014 D5)
MyTicketList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/MyTicket'
    next_cursor:
      type: [string, 'null']
Decision:
  type: object
  required: [tenant, ticket, question]
  properties:
    tenant:
      $ref: '#/TenantRef'
    ticket:
      $ref: '#/TicketRef'
    question:
      $ref: '#/Question'
DecisionList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Decision'
    next_cursor:
      type: [string, 'null']
Dashboard:
  type: object
  description: |
    The tenant's dashboard, the nine fixed tiles of docs/adr/0018 D6, read in one read-only
    transaction. Every tile counts only what the caller can see: the visibility predicate holds
    each ticket, question and time entry it reads, so a restricted project or a confidential
    ticket the caller cannot see counts nowhere and is named nowhere (docs/adr/0034 D4,
    docs/adr/0065 D4), and a time entry follows the visibility of time as well (docs/adr/0034
    D5). A deleted ticket counts nowhere either — nor its questions and its time — until it is
    restored (docs/adr/0024 D1). *Open* is every state but `done` and `dropped`. The open tiles count the tickets as they
    stand at the request; throughput and lead time end with the period's last day; the time is
    the period's (docs/adr/0019 D2). Days are UTC days and weeks ISO weeks of them
    (docs/adr/0055 D3). The counted projects are the ones the `project` filter names, or, without
    a plain value, every project the caller sees that is not archived; a negated value leaves its
    project out, and a key that names no project the caller sees counts nothing.
  required: [period, open_by_state, open_by_severity, security, blocked, age, throughput, lead_time,
    decisions, time, recent]
  properties:
    period:
      $ref: '#/DashboardPeriod'
    open_by_state:
      type: array
      description: |
        Tile 1, open tickets by state: the open tickets of each counted project per state, by
        project key; a project and state without an open ticket is left out. Their sum per state
        is the tile, their sum per project the project's open count.
      items:
        $ref: '#/DashboardStateCount'
    open_by_severity:
      type: array
      description: |
        Tile 2, open tickets by severity: every severity of docs/adr/0010 D1 in its order,
        `critical` first, with the count of open tickets that carry it, zero included.
      items:
        $ref: '#/DashboardSeverityCount'
    security:
      type: array
      description: |
        Tile 3, open security findings: `live`, then `boundary` (docs/adr/0010 D1, D2), each with
        the count of open tickets of that class and the oldest of them by filing (`opened_at`, the
        earlier id on a tie), `null` while there is none.
      items:
        $ref: '#/DashboardSecurity'
    blocked:
      $ref: '#/DashboardBlocked'
    age:
      type: array
      description: |
        Tile 5, the age distribution of the open tickets, the age being the time since filing
        (`opened_at`) at the request: five buckets in this order, every one present — under 7
        days, 7 to under 30, 30 to under 90, 90 to under 365, and 365 days or more, a day being
        24 hours.
      items:
        $ref: '#/DashboardAgeBucket'
    throughput:
      type: array
      description: |
        Tile 6, throughput: the tickets done per ISO week (docs/adr/0019 D2) for the eight weeks
        that end with the one holding the period's last day, oldest first, every week present. A
        ticket counts in the week of its `done_at` while it is done: one reopened since counts
        nowhere, one done again counts once, in the week of its last done. The last week counts
        up to the period's last day.
      items:
        $ref: '#/DashboardWeek'
    lead_time:
      $ref: '#/DashboardLeadTime'
    decisions:
      $ref: '#/DashboardDecisions'
    time:
      $ref: '#/DashboardTime'
    recent:
      type: array
      description: |
        Beside the tiles, kept from the front page before the dashboard: the eight open tickets of
        the counted projects updated last, newest first (the later id on a tie).
      items:
        $ref: '#/DashboardRecent'
DashboardPeriod:
  type: object
  description: |
    The period the request named, or the default: the thirty days that end today, UTC. Both days
    are inclusive.
  required: [from, to]
  properties:
    from: {type: string, format: date}
    to: {type: string, format: date}
DashboardStateCount:
  type: object
  required: [project, state, count]
  properties:
    project: {type: string, description: The project's key}
    state:
      $ref: '#/TicketState'
    count: {type: integer}
DashboardSeverityCount:
  type: object
  required: [severity, count]
  properties:
    severity:
      $ref: '#/Severity'
    count: {type: integer}
DashboardTicket:
  type: object
  description: A ticket a tile names, with the time the tile measures it from
  required: [key, title, since]
  properties:
    key: {type: string, description: 'The canonical key, <tenant>/<PROJECT>-<number>'}
    title: {type: string}
    since: {type: string, format: date-time}
DashboardSecurity:
  type: object
  required: [class, count, oldest]
  properties:
    class:
      $ref: '#/SecurityClass'
    count: {type: integer}
    oldest:
      description: The oldest open ticket of the class; `since` is its filing
      oneOf:
        - $ref: '#/DashboardTicket'
        - type: 'null'
DashboardBlocked:
  type: object
  description: |
    Tile 4, blocked tickets: the count of open tickets in the state `blocked`, and the one blocked
    longest with its block's kind (docs/adr/0009 D2) — blocked since its latest recorded
    transition into `blocked` (docs/adr/0026), or since its last update where no act records one;
    the earlier id on a tie. `oldest` is `null` while none is blocked.
  required: [count, oldest]
  properties:
    count: {type: integer}
    oldest:
      oneOf:
        - $ref: '#/DashboardBlock'
        - type: 'null'
DashboardBlock:
  type: object
  required: [key, title, since, kind]
  properties:
    key: {type: string, description: 'The canonical key, <tenant>/<PROJECT>-<number>'}
    title: {type: string}
    since: {type: string, format: date-time, description: When the ticket entered blocked}
    kind:
      $ref: '#/BlockKind'
DashboardAgeBucket:
  type: object
  description: The open tickets whose age is at least `from_days` and under `to_days`
  required: [from_days, to_days, count]
  properties:
    from_days: {type: integer}
    to_days:
      type: [integer, 'null']
      description: Null for the last bucket, which has no upper bound
    count: {type: integer}
DashboardWeek:
  type: object
  required: [week, from, to, done]
  properties:
    week: {type: string, description: 'The ISO week, 2026-W40'}
    from: {type: string, format: date, description: Its Monday}
    to: {type: string, format: date, description: 'Its Sunday, or the period''s last day for the last week'}
    done: {type: integer, description: The tickets done in it}
DashboardLeadTime:
  type: object
  description: |
    Tile 7, lead time: the median time from filing to done (`opened_at` to `done_at`) of the
    tickets done in the thirty days that end with the period's last day — done now, their
    `done_at` in that window, as throughput counts them; the median of an even count is the mean
    of the middle two. `median_seconds` is `null` while no ticket was done in the window.
  required: [from, to, done, median_seconds]
  properties:
    from: {type: string, format: date, description: The window's first day}
    to: {type: string, format: date, description: 'The window''s last day, the period''s'}
    done: {type: integer, description: The tickets the median is taken over}
    median_seconds:
      type: [integer, 'null']
      description: Whole seconds, rounded
DashboardDecisions:
  type: object
  description: |
    Tile 8, open decisions: the count of open questions (docs/adr/0011 D3) on the tickets of the
    counted projects, whomever they are asked of and whatever state the ticket is in, and the one
    asked first, the earlier id on a tie; `oldest` is `null` while none is open.
  required: [count, oldest]
  properties:
    count: {type: integer}
    oldest:
      oneOf:
        - $ref: '#/DashboardQuestion'
        - type: 'null'
DashboardQuestion:
  type: object
  required: [key, title, number, question, since]
  properties:
    key: {type: string, description: 'The canonical key of its ticket'}
    title: {type: string, description: The ticket's title}
    number: {type: integer, description: The question's number on the ticket}
    question: {type: string}
    since: {type: string, format: date-time, description: When it was asked}
DashboardTime:
  type: object
  description: |
    Tile 9, time booked in the period by project: the minutes of the time entries whose day lies
    in the period, voided ones left out (docs/adr/0017 D7), per counted project that has any, by
    project key; only the entries the caller may see count (docs/adr/0034 D5).
  required: [total_minutes, projects]
  properties:
    total_minutes: {type: integer}
    projects:
      type: array
      items:
        $ref: '#/DashboardProjectTime'
DashboardProjectTime:
  type: object
  required: [project, name, minutes]
  properties:
    project: {type: string, description: The project's key}
    name: {type: string}
    minutes: {type: integer}
DashboardRecent:
  type: object
  required: [key, type, title, state, updated_at]
  properties:
    key: {type: string, description: 'The canonical key, <tenant>/<PROJECT>-<number>'}
    type:
      $ref: '#/TicketType'
    title: {type: string}
    state:
      $ref: '#/TicketState'
    updated_at: {type: string, format: date-time}
SearchFoundIn:
  type: string
  enum: [key, ticket, comment, question, attachment]
  description: |
    Where a search hit matched (docs/adr/0025 D5): the ticket's key; its own text, the title and
    the body; one of its comments; one of its questions; an attachment's file name
SnippetPart:
  type: object
  required: [text, match]
  properties:
    text: {type: string, description: 'A piece of the matched text, as text'}
    match: {type: boolean, description: The piece is a word the query found}
SearchHit:
  type: object
  required: [tenant, key, title, type, state, found_in, comment, question, snippet]
  properties:
    tenant:
      $ref: '#/TenantRef'
    key: {type: string, description: 'The canonical key, <tenant>/<PROJECT>-<number> (docs/adr/0007 D2)'}
    title: {type: string}
    type:
      $ref: '#/TicketType'
    state:
      $ref: '#/TicketState'
    found_in:
      $ref: '#/SearchFoundIn'
    comment: {type: [string, 'null'], format: uuid, description: The comment the hit is in}
    question: {type: [integer, 'null'], description: The number of the question the hit is in}
    snippet:
      type: array
      description: |
        The text the hit is in around the words found, in pieces (`ts_headline`, docs/adr/0025 D4):
        the body for a hit in the ticket's own text or its key, the comment, the question with its
        options, recommendation and answer, the file name. Text, never HTML; empty where that text is
      items:
        $ref: '#/SnippetPart'
SearchHitList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/SearchHit'
    next_cursor:
      type: [string, 'null']
ImportStatus:
  type: string
  enum: [dry_run, executed]
  description: |
    `dry_run`: the report of what the execution would do, kept for twenty-four hours and executed at
    most once (docs/adr/0051 D2, D3, D7); `executed`: the import committed, and the report says what
    it created
ImportOutcome:
  type: string
  enum: [create, conflict, error, skip, exclude, created]
  description: |
    What happens to a file of the upload. `create`: the execution creates its ticket. `conflict`: its
    number is a ticket of the project already, deleted ones in the bin included, or was one that was
    purged — a repeated import is a duplicate, not an update, and a number is never handed out twice
    (docs/adr/0064 D3, docs/adr/0007 D4). `error`: it cannot be imported as it stands, `errors` says
    why (docs/adr/0051 D2). `skip`: it is no ticket file, or it is a manifest of an export the import
    reads beside the tickets (docs/adr/0063 D5). `exclude`: a correction left it out
    (docs/adr/0063 D1). `created`: the execution created its ticket. A dry run is not executed while
    a file it would import is `conflict` or `error`: exclude the file, or correct the source and make
    a new dry run
ImportFormat:
  type: string
  enum: [repository, export, plain]
  description: |
    The grammar a file was read in. `repository`: a ticket file of a repository's docs/tickets/ —
    `id: T<n>`, `urgency`, `blocked-by`, `filed-from`, the `local_` prefix (docs/adr/0063 D3).
    `export`: cowork's own grammar v1, `key: <tenant>/<PROJECT>-<n>` (docs/adr/0044 D1). `plain`: a
    file without frontmatter, an archived record that becomes one done task (docs/adr/0063 D4)
ImportMessage:
  type: object
  required: [field, line, message]
  properties:
    field:
      type: [string, 'null']
      description: |
        The frontmatter key, or the part of the file — `file`, `body`, `Q<n>`, `links.json` — the
        message is about
    line:
      type: [integer, 'null']
      description: The line of the file, from 1, where one applies
    message: {type: string}
ImportBlock:
  type: object
  description: The block of a ticket the import creates as blocked (docs/adr/0009 D2)
  required: [kind, reason, from, ticket]
  properties:
    kind:
      $ref: '#/BlockKind'
    reason: {type: string}
    from:
      $ref: '#/TicketState'
    ticket:
      type: [string, 'null']
      description: The key of the ticket a block of kind `ticket` waits on
ImportColumns:
  type: object
  description: |
    The ticket's columns as the import reads them (docs/adr/0010 D5); a value outside its vocabulary
    is an error of the file and null here, never a guess
  required: [severity, security, threat, horizon, effort, progress_refinement, progress, progress_review,
    opened, decided, done]
  properties:
    severity:
      oneOf:
        - $ref: '#/Severity'
        - type: 'null'
    security:
      oneOf:
        - $ref: '#/SecurityClass'
        - type: 'null'
    threat: {type: [string, 'null']}
    horizon:
      description: The horizon, read from `horizon` or `urgency`; `later` where the source names none (docs/adr/0010 D3)
      oneOf:
        - $ref: '#/Horizon'
        - type: 'null'
    effort:
      oneOf:
        - $ref: '#/Effort'
        - type: 'null'
    progress_refinement: {type: integer, description: The refinement stage; 0 where the source names none}
    progress: {type: integer, description: The implementation stage; 0 where the source names none}
    progress_review: {type: integer, description: The review stage; 0 where the source names none}
    opened:
      type: [string, 'null']
      format: date
      description: The `opened` date; null where the source names none, and the ticket is then opened at the execution
    decided: {type: [string, 'null'], format: date}
    done: {type: [string, 'null'], format: date, description: The `done` date of a ticket imported as done}
ImportAssignee:
  type: object
  required: [source, person]
  properties:
    source:
      type: string
      description: The assignee as the file writes it, `Name <identity>` (docs/adr/0044 D1)
    person:
      description: |
        The member it is: the identity resolved — `local:<username>`, or `oidc:<issuer>#<subject>` of the
        configured issuer — to a member who can see the project. Null when it resolves to nobody, never
        guessed by the name: the ticket is then imported without an assignee, unless a correction names
        one (docs/adr/0044 D1)
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
ImportQuestion:
  type: object
  description: An open question the import creates as an entity of the ticket (docs/adr/0011 D2, D4)
  required: [number, question, status]
  properties:
    number: {type: integer}
    question: {type: string}
    status:
      $ref: '#/QuestionStatus'
ImportLink:
  type: object
  description: A link the import creates, read from this file's end (docs/adr/0012)
  required: [type, direction, key, source]
  properties:
    type:
      $ref: '#/LinkType'
    direction:
      type: string
      enum: [outgoing, incoming]
      description: Outgoing when this file's ticket is the link's source
    key: {type: string, description: The other end's key in the project}
    source:
      type: string
      enum: [blocked-by, filed-from, links.json]
      description: Where the import read the link
ImportBlockCorrection:
  type: object
  additionalProperties: false
  description: The block a correction to the state `blocked` gives the ticket (docs/adr/0009 D2)
  required: [kind, reason]
  properties:
    kind:
      $ref: '#/BlockKind'
    reason: {type: string, minLength: 1, maxLength: 2000}
    from:
      $ref: '#/TicketState'
ImportCorrection:
  type: object
  additionalProperties: false
  description: |
    A person's correction of one file before the execution (docs/adr/0051 D2, docs/adr/0063 D1,
    docs/adr/0008 D5): leave it out, or change its type, its state or its assignee. A file that
    names `exclude: true` takes no other correction; a skipped file takes none at all. The state
    `blocked` takes `block`, whose kind is not `ticket` — a block on a ticket is a `blocks` link, made
    after the import — and whose `from` is the file's own state unless that is `blocked`, `done` or
    `dropped`, when it is required; `block` with another state is refused. A correction to `done`
    takes the file's `shipped` line, or the import note `imported from archive; the source carried no
    verification note` (docs/adr/0063 D2); one to `dropped` the file's `dropped-reason`, or `imported
    from archive; the source carried no reason`. `assignee` is a person id — a member who can see the
    project — or null for nobody
  required: [path]
  properties:
    path: {type: string, minLength: 1, maxLength: 1024, description: The file's path as the report names it}
    exclude: {type: boolean}
    type:
      $ref: '#/TicketType'
    state:
      $ref: '#/TicketState'
    block:
      $ref: '#/ImportBlockCorrection'
    assignee:
      type: [string, 'null']
      format: uuid
ImportFile:
  type: object
  description: |
    One file of the upload as the import reads it (docs/adr/0051 D2, docs/adr/0063). The fields after
    `reason` are null, or empty, for a skipped file and for one whose frontmatter cannot be read at all
  required: [path, outcome, reason, format, number, key, conflict, title, type, type_reason, state,
    block_candidate, block, columns, assignee, parent, note, questions, links, attachments, confidential,
    confidential_reason, warnings, errors, correction]
  properties:
    path: {type: string, description: 'The file''s path in the upload, `/`-separated'}
    outcome:
      $ref: '#/ImportOutcome'
    reason:
      type: [string, 'null']
      description: Why the file is skipped or excluded
    format:
      oneOf:
        - $ref: '#/ImportFormat'
        - type: 'null'
    number:
      type: [integer, 'null']
      description: |
        The ticket's number, kept from the source (docs/adr/0007 D6): `id: T<n>` or the `NNN` of the
        file name, or the number of an export's key
    key:
      type: [string, 'null']
      description: The key the ticket gets — or got — in the project, `<tenant>/<PROJECT>-<n>`
    conflict:
      type: [string, 'null']
      description: The key of the project's ticket that holds the number — a deleted one included — or held it until it was purged
    title: {type: [string, 'null']}
    type:
      oneOf:
        - $ref: '#/TicketType'
        - type: 'null'
    type_reason:
      type: [string, 'null']
      description: Why the import chose the type — named by the file, or detected by its content and open to correction (docs/adr/0008 D5)
    state:
      oneOf:
        - $ref: '#/TicketState'
        - type: 'null'
    block_candidate:
      description: |
        The kind a repository's `blocked-by` names beside a state that is not `blocked`: the import never
        infers `blocked` (docs/adr/0009); a correction to `blocked` with this kind confirms it
      oneOf:
        - $ref: '#/BlockKind'
        - type: 'null'
    block:
      oneOf:
        - $ref: '#/ImportBlock'
        - type: 'null'
    columns:
      oneOf:
        - $ref: '#/ImportColumns'
        - type: 'null'
    assignee:
      oneOf:
        - $ref: '#/ImportAssignee'
        - type: 'null'
    parent:
      type: [string, 'null']
      description: The key of the parent in the project
    note:
      type: [string, 'null']
      description: |
        The verification note of a ticket imported as done, or the reason of one imported as dropped,
        which the import records on the state's act (docs/adr/0009 D5, docs/adr/0063 D2)
    questions:
      type: array
      items:
        $ref: '#/ImportQuestion'
    links:
      type: array
      items:
        $ref: '#/ImportLink'
    attachments:
      type: array
      description: The file names the source lists; an export carries no bytes, and the import brings no file (docs/adr/0051 D4)
      items: {type: string}
    confidential:
      type: boolean
      description: The ticket is created confidential (docs/adr/0065 D7)
    confidential_reason:
      type: [string, 'null']
      description: |
        Why it is confidential — or why it is not where the source might suggest it: a
        `publication-accepted` date, a `shipped` line that names the fix
    warnings:
      type: array
      description: What the import reads in a way the person should know, or leaves out — nothing is dropped silently
      items:
        $ref: '#/ImportMessage'
    errors:
      type: array
      description: Why the file cannot be imported as it stands
      items:
        $ref: '#/ImportMessage'
    correction:
      description: The correction the execution applied to the file; null in a dry run and where none was sent
      oneOf:
        - $ref: '#/ImportCorrection'
        - type: 'null'
ImportSummary:
  type: object
  required: [files, create, conflict, error, skip, exclude, created, open, confidential, highest_number]
  properties:
    files: {type: integer, description: Every file of the upload}
    create: {type: integer}
    conflict: {type: integer}
    error: {type: integer}
    skip: {type: integer}
    exclude: {type: integer}
    created: {type: integer}
    open:
      type: integer
      description: The tickets to create, or created, in a state that is not `done` or `dropped`
    confidential:
      type: integer
      description: The tickets to create, or created, confidential
    highest_number:
      type: [integer, 'null']
      description: The highest number to create, or created; the project's sequence advances past it (docs/adr/0007 D6)
ImportJob:
  type: object
  description: |
    An import job on a project (docs/adr/0051 D1): a dry run's report until it is executed or
    twenty-four hours pass, then the report of the execution
  required: [id, project, status, created_by, created_at, expires_at, executed_by, executed_at, summary, files]
  properties:
    id: {type: string, format: uuid}
    project: {type: string, description: The project's key}
    status:
      $ref: '#/ImportStatus'
    created_by:
      $ref: '#/Person'
    created_at: {type: string, format: date-time}
    expires_at:
      type: [string, 'null']
      format: date-time
      description: When the dry run is gone; null once it is executed
    executed_by:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    executed_at: {type: [string, 'null'], format: date-time}
    summary:
      $ref: '#/ImportSummary'
    files:
      type: array
      description: |
        Every file of the upload, in the order the upload carried them. Once a ticket the execution
        created is purged, its file is no longer listed, and `summary` still counts it
        (docs/adr/0024 D2)
      items:
        $ref: '#/ImportFile'
ImportExecution:
  type: object
  additionalProperties: false
  properties:
    corrections:
      type: array
      maxItems: 10000
      items:
        $ref: '#/ImportCorrection'
ExportManifest:
  type: object
  description: '`manifest.json` of an export archive (docs/adr/0051 D4)'
  required: [format, tenant, projects, exported_at, exported_by, tickets, confidential_not_included]
  properties:
    format:
      type: string
      enum: [cowork export v1]
    tenant: {type: string, description: 'The tenant''s slug'}
    projects:
      type: array
      description: The project of a project export; every project the caller sees, by key, of a tenant export
      items:
        $ref: '#/ExportManifestProject'
    exported_at: {type: string, format: date-time}
    exported_by:
      type: string
      description: The exporter as grammar v1 writes a person, `Name <identity>` (docs/adr/0044 D1)
    tickets: {type: integer, description: The documents the archive holds}
    confidential_not_included:
      type: integer
      description: |
        The confidential tickets of these projects the exporter cannot see, which the archive leaves out
        — "n confidential tickets not included" (docs/adr/0065 D5)
ExportManifestProject:
  type: object
  required: [key, name, archived, tickets, confidential_not_included]
  properties:
    key: {type: string, description: The project's key}
    name: {type: string}
    archived: {type: boolean}
    tickets: {type: integer, description: The documents of this project the archive holds}
    confidential_not_included: {type: integer}
ExportLink:
  type: object
  description: One link of `links.json`, once (docs/adr/0051 D4, docs/adr/0012 D1)
  required: [source, type, target]
  properties:
    source: {type: string, description: 'The source''s key, <tenant>/<PROJECT>-<n>'}
    type:
      $ref: '#/LinkType'
    target: {type: string, description: 'The target''s key; relates-to is stored and written once'}
ExportAttachment:
  type: object
  description: One attachment of `attachments.json` — its metadata and URL, never its bytes (docs/adr/0016 D5)
  required: [ticket, name, type, size, url]
  properties:
    ticket: {type: string, description: 'The ticket''s key'}
    name: {type: string}
    type: {type: string, description: The stored content type}
    size: {type: integer, format: int64}
    url: {type: string, description: 'The path of its bytes, `…/attachments/{attachment}/content`'}
