Comment:
  type: object
  required: [id, author, agent, token, body, body_html, withdrawn, withdrawn_at, edited, explains, mentions, version,
    created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    author:
      $ref: '#/Person'
    agent: {type: [string, 'null'], description: The agent mark when an agent wrote it in the author's name}
    token:
      description: The token the act came through; null for a person's own browser session (docs/adr/0036 D6)
      oneOf:
        - $ref: '#/TokenMark'
        - type: 'null'
    body: {type: [string, 'null'], description: 'Markdown; null once withdrawn (docs/adr/0015 D3)'}
    body_html:
      type: [string, 'null']
      description: |
        The body rendered and sanitised on the server, as the ticket's body is (docs/adr/0011 D6), beside
        the Markdown; null once withdrawn
    withdrawn: {type: boolean}
    withdrawn_at: {type: [string, 'null'], format: date-time}
    edited: {type: boolean, description: The comment has an edit history}
    explains:
      type: array
      description: The acts this comment explains (docs/adr/0015 D2)
      items:
        $ref: '#/AuditAction'
    mentions:
      type: array
      description: |
        The persons the comment mentions, by id (docs/adr/0015 D5): each was told, and watches the
        ticket while the comment stands; empty once it is withdrawn
      items: {type: string, format: uuid}
    version: {type: integer}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
  example: &example-comment
    id: 01a10c96-0240-79ce-bd04-bc6c377cbc17
    author: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
    agent: null
    token: null
    body: |-
      Reproduced with Safari 18.0 on macOS 15: the request carries the password without its trailing space.

      ![The failed sign-in](/api/v1/teams/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content)

      @Ada Lovelace, see Q1 before we change the form.
    body_html: "<p>Reproduced with Safari 18.0 on macOS 15: the request carries the password without its trailing space.</p>\n<p><img src=\"/api/v1/teams/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content\" alt=\"The failed sign-in\"></p>\n<p>@Ada Lovelace, see Q1 before we change the form.</p>"
    withdrawn: false
    withdrawn_at: null
    edited: false
    explains: []
    mentions: [019cadb4-4b00-7719-ade7-c2d450e9b5f3]
    version: 1
    created_at: '2026-10-05T15:02:00Z'
    updated_at: '2026-10-05T15:02:00Z'
CommentWrite:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body: {type: string, minLength: 1, maxLength: 100000}
    mentions:
      type: array
      uniqueItems: true
      maxItems: 50
      items: {type: string, format: uuid}
      description: |
        The persons the comment mentions, by id (docs/adr/0015 D5 as amended 2026-10-05): each must be
        a member of the team who sees the ticket, else `400 validation_failed` at `/mentions/<i>`.
        Each is told in their inbox (`mentioned`) and watches the ticket while the comment stands. The
        text names them as the writer likes — the API reads no text, so a name typed without the list
        tells nobody. Left out of a new comment, nobody is mentioned; left out of an edit, the
        mentions stay as they are, and a list given replaces them — a person it adds is told, a person
        it drops is no longer a watcher by it.
CommentList:
