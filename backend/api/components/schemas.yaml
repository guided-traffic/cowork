      description: An active local account exists, so the login page shows the local form (docs/adr/0033 D8)
    oidc:
      type: boolean
      description: |
        The login page shows the identity provider's button: one is configured,
        and `COWORK_OIDC_ALLOWED_GROUPS` or `COWORK_ADMIN_GROUP` names a group —
        without either nobody may log in through it (docs/adr/0030 D1, D8)
    oidc_name:
      type: [string, 'null']
      description: The provider's name on the button, "Sign in with <oidc_name>", `COWORK_OIDC_DISPLAY_NAME`; null without a provider
    password_min_length:
      type: integer
      minimum: 1
      description: The shortest password a local account may have, `COWORK_PASSWORD_MIN_LENGTH` (docs/adr/0033 D3); a form that sets or generates a password follows it
    token_max_lifetime_days:
      type: integer
      minimum: 0
      description: |
        The longest lifetime a new token gets, `COWORK_TOKEN_MAX_LIFETIME`, in whole days, rounded
        down (docs/adr/0035 D4): a longer `lifetime_days` is shortened to the maximum. 0 when the
        maximum is shorter than a day, and then only the default, `lifetime_days` left out, fits. A
        form that asks for a lifetime offers at most this and the 3650 days `lifetime_days` takes
  example:
    local: true
    oidc: true
    oidc_name: Acme SSO
    password_min_length: 12
    token_max_lifetime_days: 365
LocalLoginRequest:
  type: object
  additionalProperties: false
  required: [username, password]
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 200
      description: Trimmed and lower-cased by the server; a value that cannot be a username is a failed login like any other
    password:
      type: string
      minLength: 1
      maxLength: 1024
LocalLoginResult:
  type: object
  required: [password_change_required]
  properties:
    password_change_required:
      type: boolean
      description: The password is temporary and has to be changed before anything else (docs/adr/0033 D4)
  example:
    password_change_required: false
LogoutResult:
  type: object
  required: [end_session_url]
  properties:
    end_session_url:
      type: string
      description: |
        The issuer's `end_session_endpoint` with `client_id` and
        `post_logout_redirect_uri`; the browser navigates there to end its
        session at the identity provider too (docs/adr/0031 D4)
  example:
    end_session_url: https://login.acme.example/oidc/logout?client_id=cowork&post_logout_redirect_uri=https%3A%2F%2Fcowork.acme.example%2Flogin
PasswordChange:
  type: object
  additionalProperties: false
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      minLength: 1
      maxLength: 1024
    new_password:
      type: string
      minLength: 1
      maxLength: 1024
      description: At least `COWORK_PASSWORD_MIN_LENGTH` characters, and not the current password (docs/adr/0033 D3)
Account:
  type: object
  required: [id, username, display_name, role, password_change_required, locked, deactivated_at, created_at]
  properties:
    id: {type: string, format: uuid}
    username: {type: string}
    display_name: {type: string}
    role:
      description: The person's highest role in this team; null when they have none any more
      oneOf:
        - $ref: '#/Role'
        - type: 'null'
    password_change_required:
      type: boolean
      description: The password is temporary and its person has not changed it yet
    locked:
      type: boolean
      description: Failed logins locked the account at the moment (docs/adr/0033 D6)
    deactivated_at:
      type: [string, 'null']
      format: date-time
    created_at: {type: string, format: date-time}
  # The account Ada Lovelace made for Sam Rivera, its password still the temporary one.
  example:
    id: 019e165f-39c0-7937-931a-d0fa7735df32
    username: sam
    display_name: Sam Rivera
    role: member
    password_change_required: true
    locked: false
    deactivated_at: null
    created_at: '2026-05-11T09:30:00Z'
AccountList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Account'
    next_cursor:
      type: [string, 'null']
  example:
    items:
      - id: 019e165f-39c0-7937-931a-d0fa7735df32
        username: sam
        display_name: Sam Rivera
        role: member
        password_change_required: false
        locked: false
        deactivated_at: null
        created_at: '2026-05-11T09:30:00Z'
    next_cursor: null
AccountCreate:
  type: object
  additionalProperties: false
  required: [username, display_name, temporary_password, role]
  properties:
    username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
      description: The account's identity is `local:<username>`, unique in the installation (docs/adr/0033 D2)
    display_name: {type: string, minLength: 1, maxLength: 200}
    temporary_password:
      type: string
      minLength: 1
      maxLength: 1024
      description: At least `COWORK_PASSWORD_MIN_LENGTH` characters; the person changes it at the first login (docs/adr/0033 D3, D4)
    role:
      $ref: '#/Role'
AccountPasswordReset:
  type: object
  additionalProperties: false
  required: [temporary_password]
  properties:
    temporary_password:
      type: string
      minLength: 1
      maxLength: 1024
ChatProviderKind:
  type: string
  enum: [openai, anthropic]
  description: |
    The wire format a configured provider speaks (COWORK_CHAT_<ID>_KIND): OpenAI Chat Completions,
    which OpenAI, LM Studio, Ollama and vLLM speak, or the Anthropic Messages API (docs/adr/0076)
ChatProviderId:
  type: string
  minLength: 1
  maxLength: 32
  pattern: '^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$'
  description: A configured provider's id, as COWORK_CHAT_PROVIDERS names it
ChatProvider:
  type: object
  required: [id, name, kind, model]
  description: |
    A provider the operator configured (COWORK_CHAT_PROVIDERS): what the person picks in the panel.
    Its address and key are never shown
  properties:
    id:
      $ref: '#/ChatProviderId'
    name:
      type: string
      description: The provider's name for the person (COWORK_CHAT_<ID>_NAME)
    kind:
      $ref: '#/ChatProviderKind'
    model:
      type: string
      description: The model by the name its provider knows it (COWORK_CHAT_<ID>_MODEL)
ChatUnavailableReason:
  type: string
  enum: [not_configured]
  description: Why the chat is not available — the installation configures no provider
ChatAvailability:
  type: object
  required: [available, providers, reason]
  properties:
    available:
      type: boolean
      description: The members of the team may hold a conversation (POST …/chat)
    providers:
      type: array
      description: The configured providers in the configured order, the first the default of a turn; empty without one
      items:
        $ref: '#/ChatProvider'
    reason:
      description: Why the chat is not available; null when it is
      oneOf:
        - $ref: '#/ChatUnavailableReason'
        - type: 'null'
  example:
    available: true
    providers:
      - id: lmstudio
        name: LM Studio
        kind: openai
        model: qwen/qwen3-30b-a3b-2507
      - id: claude
        name: Claude
        kind: anthropic
        model: claude-sonnet-4-5
    reason: null
ChatRole:
  type: string
  enum: [user, assistant, tool]
  description: Whom a message of the chat is from — the person, the model, or a tool answering the model
ChatToolArguments:
  type: object
  additionalProperties: true
  description: A tool call's arguments as the model gave them, a JSON object; the tool's schema decides what they mean
  # The generated Go keeps the arguments as they came; the generated file
  # imports encoding/json already.
  x-go-type: json.RawMessage
ChatToolCall:
  type: object
  additionalProperties: false
  required: [id, name, arguments]
  description: A call of a tool the model made
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 128
      description: The call's id, which the tool message answering it names
    name: {type: string, minLength: 1, maxLength: 128, description: The tool's name}
    arguments:
      $ref: '#/ChatToolArguments'
ChatMessage:
  type: object
  additionalProperties: false
  required: [role]
  description: |
    One message of a conversation, in the neutral model the backend translates for its provider. A
    `user` message carries `text`, what the person wrote; an `assistant` message `text`, what the model
    said, and `tool_calls`, the calls it made — at least one of the two; a `tool` message
    `tool_call_id`, the call it answers, `ok`, and `text`, the answer the model read. There is no
    system message: the backend writes the model's instructions on every turn (docs/adr/0076).
  properties:
    role:
      $ref: '#/ChatRole'
    text: {type: string, maxLength: 100000}
    tool_calls:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: '#/ChatToolCall'
    tool_call_id: {type: string, minLength: 1, maxLength: 128}
    ok:
      type: boolean
      description: On a tool message, whether the call succeeded; a refusal of the API is a failure the model reads
ChatPageContext:
  type: object
  additionalProperties: false
  description: |
    The page the person is on as they send the turn: the model's instructions name it, and a short
    key the model uses resolves against its project
  properties:
    path:
      type: string
      maxLength: 256
      pattern: '^/[A-Za-z0-9/._~-]*$'
      description: The page's path in this UI, without query or fragment, such as /t/acme/p/COW/board
    project:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}$'
      description: The key of the project the page shows
    ticket:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,9}$'
      description: The short key of the ticket the page shows, <PROJECT>-<number>
ChatTurn:
  type: object
  additionalProperties: false
  required: [conversation, messages]
  properties:
    conversation:
      type: string
      format: uuid
      description: |
        The conversation's id, made by the client when the conversation begins and sent with each of
        its turns; the agent mark of the tool calls carries it, so the activity tells one
        conversation's acts from another's (docs/adr/0036 D3)
    provider:
      $ref: '#/ChatProviderId'
      description: The provider the turn talks to, one GET …/chat lists; the first configured when left out
    messages:
      type: array
      minItems: 1
      maxItems: 400
      description: |
        The conversation so far, oldest first: the person's messages and what the `done` events
        added. It ends with the person's new message
      items:
        $ref: '#/ChatMessage'
    context:
      $ref: '#/ChatPageContext'
ChatTextEvent:
  type: object
  required: [delta]
  description: The data of a chat turn's event `text`
  properties:
    delta:
      type: string
      description: The next piece of the assistant's text, to be appended to the pieces before it
ChatToolResultEvent:
  type: object
  required: [id, ok, summary]
  description: The data of a chat turn's event `tool_result`
  properties:
    id: {type: string, description: The id of the call it answers}
    ok:
      type: boolean
      description: |
        The call succeeded; false for a refusal of the API, which the model reads like any answer
    summary:
      type: string
      description: |
        The start of what the tool answered, Markdown as the tool wrote it, at most 2000 characters;
        the whole answer is the text of the tool message in `done`
ChatUiAction:
  type: string
  enum: [navigate]
  description: What a UI tool of the chat asks the client to do
ChatUiEvent:
  type: object
  required: [action, path]
  description: The data of a chat turn's event `ui`
  properties:
    action:
      $ref: '#/ChatUiAction'
    path:
      type: string
      description: |
        The page to show, a path of this UI in the turn's team: /t/<team>/tickets/<PROJECT>-<number>,
        /t/<team>/p/<PROJECT>/backlog or /t/<team>/p/<PROJECT>/board
ChatTurnEnd:
  type: string
  enum: [answered, step_limit, stopped, error]
  description: |
    Why a turn ended: the model answered; the turn reached COWORK_CHAT_MAX_STEPS calls of the model,
    and a new message goes on; the person stopped it (DELETE …/chat/turns); or an `error` event came
    before
ChatDoneEvent:
  type: object
  required: [messages, reason]
  description: The data of a chat turn's event `done`, the last of every turn
  properties:
    messages:
      type: array
      description: The messages the turn added, to be appended to the conversation as they are
      items:
        $ref: '#/ChatMessage'
    reason:
      $ref: '#/ChatTurnEnd'
ChatCapabilities:
  type: object
  required: [capabilities, chosen]
  description: |
    The capabilities the chat's requests hold (docs/adr/0043 D5): what the chat may do beyond the
    baseline, as the person chose it
  properties:
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    chosen:
      type: boolean
      description: |
        The person chose the set; false is the default, every capability but decide, close, drop and
        record-answer
  example:
    capabilities: [rank, set-horizon, interest, upload, create-project]
    chosen: false
ChatCapabilitiesUpdate:
  type: object
  additionalProperties: false
  required: [capabilities]
  properties:
    capabilities:
      type: array
      uniqueItems: true
      maxItems: 9
      description: The whole set; an empty one leaves the chat the baseline
      items:
        $ref: '#/Capability'
InboxReason:
  type: string
  enum: [assigned, asked, answered, state_changed, blocker_closed, commented, urgent, mentioned]
  description: |
    Why the person is told (docs/adr/0020 D2): a ticket assigned to them, a question asked of them, a
    question they asked answered, a ticket they watch changed state or got a comment, a ticket that
    blocks one they watch reached done or dropped, an urgent stake on a ticket assigned to them, or a
    comment that mentions them (docs/adr/0015 D5)
InboxEntry:
  type: object
  required: [id, team, tenant, ticket, reason, act, blocker, withdrawn, read, created_at]
  properties:
    id: {type: string, format: uuid}
    team:
      $ref: '#/TeamRef'
    tenant:
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      allOf:
        - $ref: '#/TeamRef'
    ticket:
      $ref: '#/TicketRef'
    reason:
      $ref: '#/InboxReason'
    act:
      $ref: '#/Activity'
    blocker:
      description: For `blocker_closed`, the ticket that blocked this one and reached done or dropped, as it is now; null otherwise
      oneOf:
        - $ref: '#/TicketRef'
        - type: 'null'
    withdrawn:
      type: boolean
      description: The comment or question the act is on has been withdrawn since
    read: {type: boolean}
    created_at: {type: string, format: date-time}
InboxList:
  type: object
  required: [items, next_cursor, unread]
  properties:
    items:
      type: array
      items:
        $ref: '#/InboxEntry'
    next_cursor:
      type: [string, 'null']
    unread:
      type: integer
      description: The person's unread notifications in the teams the request reaches
  # Ada Lovelace told that Grace Hopper's comment on acme/WEB-42 mentions her.
  example:
    items:
      - id: 01a10c96-0240-7196-85bb-eeab014066b7
        team: {slug: acme, name: Acme}
        tenant: {slug: acme, name: Acme}
        ticket: {key: acme/WEB-42, title: Sign-in fails in Safari when the password contains a space, state: in-progress}
        reason: mentioned
        act: *example-activity
        blocker: null
        withdrawn: false
        read: false
        created_at: '2026-10-05T15:02:00Z'
    next_cursor: null
    unread: 1
InboxState:
  type: object
  required: [unread]
  properties:
    unread: {type: integer}
  example:
    unread: 0
InboxReadThrough:
  type: object
  additionalProperties: false
  required: [through]
  properties:
    through:
      type: string
      format: uuid
      description: The newest notification the person saw; it and every older one are marked read
MyTicket:
  type: object
  required: [team, tenant, ticket, place]
  properties:
    team:
      $ref: '#/TeamRef'
    tenant:
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      allOf:
        - $ref: '#/TeamRef'
    ticket:
      $ref: '#/Ticket'
    place:
      type: integer
      minimum: 1
      description: |
        The ticket's place in its project's rank among the open tickets of its horizon the caller can
        see, 1 for the first — where the backlog's group shows it: the secondary indicator beside the
        score's order (docs/adr/0014 D5)
MyTicketList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/MyTicket'
    next_cursor:
      type: [string, 'null']
  # What Grace Hopper reads: acme/WEB-42 is assigned to her.
  example:
    items:
      - team: {slug: acme, name: Acme}
        tenant: {slug: acme, name: Acme}
        ticket: *example-ticket
        place: 1
    next_cursor: null
Decision:
  type: object
  required: [team, tenant, ticket, question]
  properties:
    team:
      $ref: '#/TeamRef'
    tenant:
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      allOf:
        - $ref: '#/TeamRef'
    ticket:
      $ref: '#/TicketRef'
    question:
      $ref: '#/Question'
DecisionList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/Decision'
    next_cursor:
      type: [string, 'null']
  # What Ada Lovelace reads: Q1 of acme/WEB-42 is asked of her.
  example:
    items:
      - team: {slug: acme, name: Acme}
        tenant: {slug: acme, name: Acme}
        ticket: {key: acme/WEB-42, title: Sign-in fails in Safari when the password contains a space, state: in-progress}
        question: *example-question
    next_cursor: null
MyProject:
  type: object
  required: [team, project]
  description: A project of one of the person's teams, with its team (docs/adr/0023 D2)
  properties:
    team:
      $ref: '#/TeamRef'
    project:
      $ref: '#/Project'
MyProjectList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/MyProject'
    next_cursor:
      type: [string, 'null']
  # What Ada Lovelace's sidebar lists: the projects of her teams.
  example:
    items:
      - team: {slug: acme, name: Acme}
        project: *example-project
    next_cursor: null
Dashboard:
  type: object
  description: |
    The team's dashboard, the nine fixed tiles of docs/adr/0018 D6, read in one read-only
    transaction. Every tile counts only what the caller can see: the visibility predicate holds
    each ticket, question and time entry it reads, so a restricted project or a confidential
    ticket the caller cannot see counts nowhere and is named nowhere (docs/adr/0034 D4,
    docs/adr/0065 D4), and a time entry follows the visibility of time as well (docs/adr/0034
    D5). A deleted ticket counts nowhere either — nor its questions and its time — until it is
    restored (docs/adr/0024 D1). *Open* is every state but `done` and `dropped`. The open tiles count the tickets as they
    stand at the request; throughput and lead time end with the period's last day; the time is
    the period's (docs/adr/0019 D2). Days are UTC days and weeks ISO weeks of them
    (docs/adr/0055 D3). The counted projects are the ones the `project` filter names, or, without
    a plain value, every project the caller sees that is not archived; a negated value leaves its
    project out, and a key that names no project the caller sees counts nothing.
  required: [period, open_by_state, open_by_severity, security, blocked, age, throughput, lead_time,
    decisions, time, recent]
  properties:
    period:
      $ref: '#/DashboardPeriod'
    open_by_state:
      type: array
      description: |
        Tile 1, open tickets by state: the open tickets of each counted project per state, by
        project key; a project and state without an open ticket is left out. Their sum per state
        is the tile, their sum per project the project's open count.
      items:
        $ref: '#/DashboardStateCount'
    open_by_severity:
      type: array
      description: |
        Tile 2, open tickets by severity: every severity of docs/adr/0010 D1 in its order,
        `critical` first, with the count of open tickets that carry it, zero included.
      items:
        $ref: '#/DashboardSeverityCount'
    security:
      type: array
      description: |
        Tile 3, open security findings: `live`, then `boundary` (docs/adr/0010 D1, D2), each with
        the count of open tickets of that class and the oldest of them by filing (`opened_at`, the
        earlier id on a tie), `null` while there is none.
      items:
        $ref: '#/DashboardSecurity'
    blocked:
      $ref: '#/DashboardBlocked'
    age:
      type: array
      description: |
        Tile 5, the age distribution of the open tickets, the age being the time since filing
        (`opened_at`) at the request: five buckets in this order, every one present — under 7
        days, 7 to under 30, 30 to under 90, 90 to under 365, and 365 days or more, a day being
        24 hours.
      items:
        $ref: '#/DashboardAgeBucket'
    throughput:
      type: array
      description: |
        Tile 6, throughput: the tickets done per ISO week (docs/adr/0019 D2) for the eight weeks
        that end with the one holding the period's last day, oldest first, every week present. A
        ticket counts in the week of its `done_at` while it is done: one reopened since counts
        nowhere, one done again counts once, in the week of its last done. The last week counts
        up to the period's last day.
      items:
        $ref: '#/DashboardWeek'
    lead_time:
      $ref: '#/DashboardLeadTime'
    decisions:
      $ref: '#/DashboardDecisions'
    time:
      $ref: '#/DashboardTime'
    recent:
      type: array
      description: |
        Beside the tiles, kept from the front page before the dashboard: the eight open tickets of
        the counted projects updated last, newest first (the later id on a tie).
      items:
        $ref: '#/DashboardRecent'
  # Acme's dashboard as an administrator reads it on 2026-10-06, the default period: fourteen
  # open tickets in WEB, the confidential finding among them.
  example:
    period: {from: '2026-09-07', to: '2026-10-06'}
    open_by_state:
      - {project: WEB, state: filed, count: 4}
      - {project: WEB, state: analysed, count: 3}
      - {project: WEB, state: decided, count: 2}
      - {project: WEB, state: in-progress, count: 3}
      - {project: WEB, state: review, count: 1}
      - {project: WEB, state: blocked, count: 1}
    open_by_severity:
      - {severity: critical, count: 0}
      - {severity: high, count: 3}
      - {severity: medium, count: 6}
      - {severity: low, count: 4}
      - {severity: cosmetic, count: 1}
    security:
      - {class: live, count: 0, oldest: null}
      - class: boundary
        count: 1
        oldest: {key: acme/WEB-31, title: A password reset link works twice, since: '2026-09-02T11:40:00Z'}
    blocked:
      count: 1
      oldest: {key: acme/WEB-36, title: Move the sign-in page to the new domain, since: '2026-09-29T15:00:00Z', kind: external}
    age:
      - {from_days: 0, to_days: 7, count: 4}
      - {from_days: 7, to_days: 30, count: 7}
      - {from_days: 30, to_days: 90, count: 2}
      - {from_days: 90, to_days: 365, count: 1}
      - {from_days: 365, to_days: null, count: 0}
    throughput:
      - {week: 2026-W34, from: '2026-08-17', to: '2026-08-23', done: 2}
      - {week: 2026-W35, from: '2026-08-24', to: '2026-08-30', done: 3}
      - {week: 2026-W36, from: '2026-08-31', to: '2026-09-06', done: 1}
      - {week: 2026-W37, from: '2026-09-07', to: '2026-09-13', done: 2}
      - {week: 2026-W38, from: '2026-09-14', to: '2026-09-20', done: 4}
      - {week: 2026-W39, from: '2026-09-21', to: '2026-09-27', done: 1}
      - {week: 2026-W40, from: '2026-09-28', to: '2026-10-04', done: 3}
      - {week: 2026-W41, from: '2026-10-05', to: '2026-10-06', done: 1}
    lead_time: {from: '2026-09-07', to: '2026-10-06', done: 11, median_seconds: 410400}
    decisions:
      count: 1
      oldest:
        key: acme/WEB-42
        title: Sign-in fails in Safari when the password contains a space
        number: 1
        question: Do we trim passwords on the server as well?
        since: '2026-10-05T14:55:00Z'
    time:
      total_minutes: 135
      projects:
        - {project: WEB, name: Website, minutes: 135}
    recent:
      - {key: acme/WEB-42, type: bug, title: Sign-in fails in Safari when the password contains a space, state: in-progress, updated_at: '2026-10-06T10:12:05Z'}
