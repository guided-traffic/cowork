      - {key: acme/WEB-39, type: task, title: Log the sign-in failures with their reason, state: analysed, updated_at: '2026-10-06T08:20:00Z'}
      - {key: acme/WEB-40, type: feature, title: Customer sign-in, state: in-progress, updated_at: '2026-10-05T17:00:00Z'}
      - {key: acme/WEB-38, type: task, title: Show the cookie notice in German, state: review, updated_at: '2026-10-05T11:45:00Z'}
      - {key: acme/WEB-36, type: task, title: Move the sign-in page to the new domain, state: blocked, updated_at: '2026-10-03T16:10:00Z'}
      - {key: acme/WEB-35, type: bug, title: The footer covers the last line of the price table, state: decided, updated_at: '2026-10-02T13:25:00Z'}
      - {key: acme/WEB-31, type: bug, title: A password reset link works twice, state: in-progress, updated_at: '2026-10-01T09:50:00Z'}
DashboardPeriod:
  type: object
  description: |
    The period the request named, or the default: the thirty days that end today, UTC. Both days
    are inclusive.
  required: [from, to]
  properties:
    from: {type: string, format: date}
    to: {type: string, format: date}
DashboardStateCount:
  type: object
  required: [project, state, count]
  properties:
    project: {type: string, description: The project's key}
    state:
      $ref: '#/TicketState'
    count: {type: integer}
DashboardSeverityCount:
  type: object
  required: [severity, count]
  properties:
    severity:
      $ref: '#/Severity'
    count: {type: integer}
DashboardTicket:
  type: object
  description: A ticket a tile names, with the time the tile measures it from
  required: [key, title, since]
  properties:
    key: {type: string, description: 'The canonical key, <team>/<PROJECT>-<number>'}
    title: {type: string}
    since: {type: string, format: date-time}
DashboardSecurity:
  type: object
  required: [class, count, oldest]
  properties:
    class:
      $ref: '#/SecurityClass'
    count: {type: integer}
    oldest:
      description: The oldest open ticket of the class; `since` is its filing
      oneOf:
        - $ref: '#/DashboardTicket'
        - type: 'null'
DashboardBlocked:
  type: object
  description: |
    Tile 4, blocked tickets: the count of open tickets in the state `blocked`, and the one blocked
    longest with its block's kind (docs/adr/0009 D2) — blocked since its latest recorded
    transition into `blocked` (docs/adr/0026), or since its last update where no act records one;
    the earlier id on a tie. `oldest` is `null` while none is blocked.
  required: [count, oldest]
  properties:
    count: {type: integer}
    oldest:
      oneOf:
        - $ref: '#/DashboardBlock'
        - type: 'null'
DashboardBlock:
  type: object
  required: [key, title, since, kind]
  properties:
    key: {type: string, description: 'The canonical key, <team>/<PROJECT>-<number>'}
    title: {type: string}
    since: {type: string, format: date-time, description: When the ticket entered blocked}
    kind:
      $ref: '#/BlockKind'
DashboardAgeBucket:
  type: object
  description: The open tickets whose age is at least `from_days` and under `to_days`
  required: [from_days, to_days, count]
  properties:
    from_days: {type: integer}
    to_days:
      type: [integer, 'null']
      description: Null for the last bucket, which has no upper bound
    count: {type: integer}
DashboardWeek:
  type: object
  required: [week, from, to, done]
  properties:
    week: {type: string, description: 'The ISO week, 2026-W40'}
    from: {type: string, format: date, description: Its Monday}
    to: {type: string, format: date, description: 'Its Sunday, or the period''s last day for the last week'}
    done: {type: integer, description: The tickets done in it}
DashboardLeadTime:
  type: object
  description: |
    Tile 7, lead time: the median time from filing to done (`opened_at` to `done_at`) of the
    tickets done in the thirty days that end with the period's last day — done now, their
    `done_at` in that window, as throughput counts them; the median of an even count is the mean
    of the middle two. `median_seconds` is `null` while no ticket was done in the window.
  required: [from, to, done, median_seconds]
  properties:
    from: {type: string, format: date, description: The window's first day}
    to: {type: string, format: date, description: 'The window''s last day, the period''s'}
    done: {type: integer, description: The tickets the median is taken over}
    median_seconds:
      type: [integer, 'null']
      description: Whole seconds, rounded
DashboardDecisions:
  type: object
  description: |
    Tile 8, open decisions: the count of open questions (docs/adr/0011 D3) on the tickets of the
    counted projects, whomever they are asked of and whatever state the ticket is in, and the one
    asked first, the earlier id on a tie; `oldest` is `null` while none is open.
  required: [count, oldest]
  properties:
    count: {type: integer}
    oldest:
      oneOf:
        - $ref: '#/DashboardQuestion'
        - type: 'null'
DashboardQuestion:
  type: object
  required: [key, title, number, question, since]
  properties:
    key: {type: string, description: 'The canonical key of its ticket'}
    title: {type: string, description: The ticket's title}
    number: {type: integer, description: The question's number on the ticket}
    question: {type: string}
    since: {type: string, format: date-time, description: When it was asked}
DashboardTime:
  type: object
  description: |
    Tile 9, time booked in the period by project: the minutes of the time entries whose day lies
    in the period, voided ones left out (docs/adr/0017 D7), per counted project that has any, by
    project key; only the entries the caller may see count (docs/adr/0034 D5).
  required: [total_minutes, projects]
  properties:
    total_minutes: {type: integer}
    projects:
      type: array
      items:
        $ref: '#/DashboardProjectTime'
DashboardProjectTime:
  type: object
  required: [project, name, minutes]
  properties:
    project: {type: string, description: The project's key}
    name: {type: string}
    minutes: {type: integer}
DashboardRecent:
  type: object
  required: [key, type, title, state, updated_at]
  properties:
    key: {type: string, description: 'The canonical key, <team>/<PROJECT>-<number>'}
    type:
      $ref: '#/TicketType'
    title: {type: string}
    state:
      $ref: '#/TicketState'
    updated_at: {type: string, format: date-time}
SearchFoundIn:
  type: string
  enum: [key, ticket, comment, question, attachment]
  description: |
    Where a search hit matched (docs/adr/0025 D5): the ticket's key; its own text, the title and
    the body; one of its comments; one of its questions; an attachment's file name
SnippetPart:
  type: object
  required: [text, match]
  properties:
    text: {type: string, description: 'A piece of the matched text, as text'}
    match: {type: boolean, description: The piece is a word the query found}
SearchHit:
  type: object
  required: [team, tenant, key, title, type, state, found_in, comment, question, snippet]
  properties:
    team:
      $ref: '#/TeamRef'
    tenant:
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      allOf:
        - $ref: '#/TeamRef'
    key: {type: string, description: 'The canonical key, <team>/<PROJECT>-<number> (docs/adr/0007 D2)'}
    title: {type: string}
    type:
      $ref: '#/TicketType'
    state:
      $ref: '#/TicketState'
    found_in:
      $ref: '#/SearchFoundIn'
    comment: {type: [string, 'null'], format: uuid, description: The comment the hit is in}
    question: {type: [integer, 'null'], description: The number of the question the hit is in}
    snippet:
      type: array
      description: |
        The text the hit is in around the words found, in pieces (`ts_headline`, docs/adr/0025 D4):
        the body for a hit in the ticket's own text or its key, the comment, the question with its
        options, recommendation and answer, the file name. Text, never HTML; empty where that text is
      items:
        $ref: '#/SnippetPart'
SearchHitList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/SearchHit'
    next_cursor:
      type: [string, 'null']
  # q=macOS, which only a comment of acme/WEB-42 holds.
  example:
    items:
      - team: {slug: acme, name: Acme}
        tenant: {slug: acme, name: Acme}
        key: acme/WEB-42
        title: Sign-in fails in Safari when the password contains a space
        type: bug
        state: in-progress
        found_in: comment
        comment: 01a10c96-0240-79ce-bd04-bc6c377cbc17
        question: null
        snippet:
          - {text: 'Reproduced with Safari 18.0 on ', match: false}
          - {text: macOS, match: true}
          - {text: ' 15: the request carries the password without its trailing space.', match: false}
    next_cursor: null
ImportStatus:
  type: string
  enum: [dry_run, executed]
  description: |
    `dry_run`: the report of what the execution would do, kept for twenty-four hours and executed at
    most once (docs/adr/0051 D2, D3, D7); `executed`: the import committed, and the report says what
    it created
ImportOutcome:
  type: string
  enum: [create, conflict, error, skip, exclude, created]
  description: |
    What happens to a file of the upload. `create`: the execution creates its ticket. `conflict`: its
    number is a ticket of the project already, deleted ones in the bin included — a repeated import
    is a duplicate, not an update (docs/adr/0064 D3); a number a purged ticket held is no conflict, an
    import gives it back (docs/adr/0007 D4). `error`: it cannot be imported as it stands, `errors`
    says why (docs/adr/0051 D2). `skip`: it is no ticket file, a `/context` document, or a manifest of
    an export the import reads beside the tickets (docs/adr/0063 D5). `exclude`: a correction left it
    out (docs/adr/0063 D1). `created`: the execution created its ticket. The execution leaves out
    every file that is `conflict` or `error` and imports the rest; the executed report keeps their
    outcome, and `reason` says why each was left out
ImportFormat:
  type: string
  enum: [repository, export, plain]
  description: |
    The grammar a file was read in. `repository`: a ticket file of a repository's docs/tickets/ —
    `id: T<n>`, `urgency`, `blocked-by`, `filed-from`, the `local_` prefix (docs/adr/0063 D3).
    `export`: cowork's own grammar v1, `key: <team>/<PROJECT>-<n>` (docs/adr/0044 D1). `plain`: a
    file without frontmatter, an archived record that becomes one done task (docs/adr/0063 D4)
ImportMessage:
  type: object
  required: [field, line, message]
  properties:
    field:
      type: [string, 'null']
      description: |
        The frontmatter key, or the part of the file — `file`, `body`, `Q<n>`, `links.json` — the
        message is about
    line:
      type: [integer, 'null']
      description: The line of the file, from 1, where one applies
    message: {type: string}
ImportBlock:
  type: object
  description: The block of a ticket the import creates as blocked (docs/adr/0009 D2)
  required: [kind, reason, from, ticket]
  properties:
    kind:
      $ref: '#/BlockKind'
    reason: {type: string}
    from:
      $ref: '#/TicketState'
    ticket:
      type: [string, 'null']
      description: The key of the ticket a block of kind `ticket` waits on
ImportColumns:
  type: object
  description: |
    The ticket's columns as the import reads them (docs/adr/0010 D5); a value outside its vocabulary
    is an error of the file and null here, never a guess
  required: [severity, security, threat, horizon, effort, progress_refinement, progress, progress_review,
    opened, decided, done]
  properties:
    severity:
      oneOf:
        - $ref: '#/Severity'
        - type: 'null'
    security:
      oneOf:
        - $ref: '#/SecurityClass'
        - type: 'null'
    threat: {type: [string, 'null']}
    horizon:
      description: The horizon, read from `horizon` or `urgency`; `later` where the source names none (docs/adr/0010 D3)
      oneOf:
        - $ref: '#/Horizon'
        - type: 'null'
    effort:
      oneOf:
        - $ref: '#/Effort'
        - type: 'null'
    progress_refinement: {type: integer, description: The refinement stage; 0 where the source names none}
    progress: {type: integer, description: The implementation stage; 0 where the source names none}
    progress_review: {type: integer, description: The review stage; 0 where the source names none}
    opened:
      type: [string, 'null']
      format: date
      description: The `opened` date; null where the source names none, and the ticket is then opened at the execution
    decided: {type: [string, 'null'], format: date}
    done: {type: [string, 'null'], format: date, description: The `done` date of a ticket imported as done}
ImportAssignee:
  type: object
  required: [source, person]
  properties:
    source:
      type: string
      description: The assignee as the file writes it, `Name <identity>` (docs/adr/0044 D1)
    person:
      description: |
        The member it is: the identity resolved — `local:<username>`, or `oidc:<issuer>#<subject>` of the
        configured issuer — to a member who can see the project. Null when it resolves to nobody, never
        guessed by the name: the ticket is then imported without an assignee, unless a correction names
        one (docs/adr/0044 D1)
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
ImportQuestion:
  type: object
  description: An open question the import creates as an entity of the ticket (docs/adr/0011 D2, D4)
  required: [number, question, status]
  properties:
    number: {type: integer}
    question: {type: string}
    status:
      $ref: '#/QuestionStatus'
ImportLink:
  type: object
  description: A link the import creates, read from this file's end (docs/adr/0012)
  required: [type, direction, key, source]
  properties:
    type:
      $ref: '#/LinkType'
    direction:
      type: string
      enum: [outgoing, incoming]
      description: Outgoing when this file's ticket is the link's source
    key: {type: string, description: The other end's key in the project}
    source:
      type: string
      enum: [blocked-by, filed-from, links.json]
      description: Where the import read the link
ImportBlockCorrection:
  type: object
  additionalProperties: false
  description: The block a correction to the state `blocked` gives the ticket (docs/adr/0009 D2)
  required: [kind, reason]
  properties:
    kind:
      $ref: '#/BlockKind'
    reason: {type: string, minLength: 1, maxLength: 2000}
    from:
      $ref: '#/TicketState'
ImportCorrection:
  type: object
  additionalProperties: false
  description: |
    A person's correction of one file before the execution (docs/adr/0051 D2, docs/adr/0063 D1,
    docs/adr/0008 D5): leave it out, or change its type, its state or its assignee. A file that
    names `exclude: true` takes no other correction; a skipped file takes none at all. The state
    `blocked` takes `block`, whose kind is not `ticket` — a block on a ticket is a `blocks` link, made
    after the import — and whose `from` is the file's own state unless that is `blocked`, `done` or
    `dropped`, when it is required; `block` with another state is refused. A correction to `done`
    takes the file's `shipped` line, or the import note `imported from archive; the source carried no
    verification note` (docs/adr/0063 D2); one to `dropped` the file's `dropped-reason`, or `imported
    from archive; the source carried no reason`. `assignee` is a person id — a member who can see the
    project — or null for nobody
  required: [path]
  properties:
    path: {type: string, minLength: 1, maxLength: 1024, description: The file's path as the report names it}
    exclude: {type: boolean}
    type:
      $ref: '#/TicketType'
    state:
      $ref: '#/TicketState'
    block:
      $ref: '#/ImportBlockCorrection'
    assignee:
      type: [string, 'null']
      format: uuid
ImportFile:
  type: object
  description: |
    One file of the upload as the import reads it (docs/adr/0051 D2, docs/adr/0063). The fields after
    `reason` are null, or empty, for a skipped file and for one whose frontmatter cannot be read at all
  required: [path, outcome, reason, format, number, key, conflict, title, type, type_reason, state,
    block_candidate, block, columns, assignee, parent, note, questions, links, attachments, confidential,
    confidential_reason, warnings, errors, correction]
  properties:
    path: {type: string, description: 'The file''s path in the upload, `/`-separated'}
    outcome:
      $ref: '#/ImportOutcome'
    reason:
      type: [string, 'null']
      description: Why the file is skipped or excluded, or why the import leaves it out — its conflict, or its error
    format:
      oneOf:
        - $ref: '#/ImportFormat'
        - type: 'null'
    number:
      type: [integer, 'null']
      description: |
        The ticket's number, kept from the source (docs/adr/0007 D6): `id: T<n>` or the `NNN` of the
        file name, or the number of an export's key
    key:
      type: [string, 'null']
      description: The key the ticket gets — or got — in the project, `<team>/<PROJECT>-<n>`
    conflict:
      type: [string, 'null']
      description: The key of the project's ticket that holds the number, a deleted one included
    title: {type: [string, 'null']}
    type:
      oneOf:
        - $ref: '#/TicketType'
        - type: 'null'
    type_reason:
      type: [string, 'null']
      description: Why the import chose the type — named by the file, or detected by its content and open to correction (docs/adr/0008 D5)
    state:
      oneOf:
        - $ref: '#/TicketState'
        - type: 'null'
    block_candidate:
      description: |
        The kind a repository's `blocked-by` names beside a state that is not `blocked`: the import never
        infers `blocked` (docs/adr/0009); a correction to `blocked` with this kind confirms it
      oneOf:
        - $ref: '#/BlockKind'
        - type: 'null'
    block:
      oneOf:
        - $ref: '#/ImportBlock'
        - type: 'null'
    columns:
      oneOf:
        - $ref: '#/ImportColumns'
        - type: 'null'
    assignee:
      oneOf:
        - $ref: '#/ImportAssignee'
        - type: 'null'
    parent:
      type: [string, 'null']
      description: The key of the parent in the project
    note:
      type: [string, 'null']
      description: |
        The verification note of a ticket imported as done, or the reason of one imported as dropped,
        which the import records on the state's act (docs/adr/0009 D5, docs/adr/0063 D2)
    questions:
      type: array
      items:
        $ref: '#/ImportQuestion'
    links:
      type: array
      items:
        $ref: '#/ImportLink'
    attachments:
      type: array
      description: The file names the source lists; an export carries no bytes, and the import brings no file (docs/adr/0051 D4)
      items: {type: string}
    confidential:
      type: boolean
      description: The ticket is created confidential (docs/adr/0065 D7)
    confidential_reason:
      type: [string, 'null']
      description: |
        Why it is confidential — or why it is not where the source might suggest it: a
        `publication-accepted` date, a `shipped` line that names the fix
    warnings:
      type: array
      description: What the import reads in a way the person should know, or leaves out — nothing is dropped silently
      items:
        $ref: '#/ImportMessage'
    errors:
      type: array
      description: Why the file cannot be imported as it stands
      items:
        $ref: '#/ImportMessage'
    correction:
      description: The correction the execution applied to the file; null in a dry run and where none was sent
      oneOf:
        - $ref: '#/ImportCorrection'
        - type: 'null'
ImportSummary:
  type: object
  required: [files, create, conflict, error, skip, exclude, created, open, confidential, highest_number]
  properties:
    files: {type: integer, description: Every file of the upload}
    create: {type: integer}
    conflict: {type: integer}
    error: {type: integer}
    skip: {type: integer}
    exclude: {type: integer}
    created: {type: integer}
    open:
      type: integer
      description: The tickets to create, or created, in a state that is not `done` or `dropped`
    confidential:
      type: integer
      description: The tickets to create, or created, confidential
    highest_number:
      type: [integer, 'null']
      description: The highest number to create, or created; the project's sequence advances past it (docs/adr/0007 D6)
ImportJob:
  type: object
  description: |
    An import job on a project (docs/adr/0051 D1): a dry run's report until it is executed or
    twenty-four hours pass, then the report of the execution
  required: [id, project, status, created_by, created_at, expires_at, executed_by, executed_at, summary, files]
  properties:
    id: {type: string, format: uuid}
    project: {type: string, description: The project's key}
    status:
      $ref: '#/ImportStatus'
    created_by:
      $ref: '#/Person'
    created_at: {type: string, format: date-time}
    expires_at:
      type: [string, 'null']
      format: date-time
      description: When the dry run is gone; null once it is executed
    executed_by:
      oneOf:
        - $ref: '#/Person'
        - type: 'null'
    executed_at: {type: [string, 'null'], format: date-time}
    summary:
      $ref: '#/ImportSummary'
    files:
      type: array
      description: |
        Every file of the upload, in the order the upload carried them. Once a ticket the execution
        created is purged, its file is no longer listed, and `summary` still counts it
        (docs/adr/0024 D2)
      items:
        $ref: '#/ImportFile'
  # The dry run of an upload of a repository's docs/tickets/ into WEB, read by the importer itself:
  # a file to skip, one whose number acme/WEB-41 holds, one with an error, three to create.
  example:
    id: 01a1156e-1ba0-7aa7-b9fb-d1b5399ba6fa
    project: WEB
    status: dry_run
    created_by: {id: 019cadb4-4b00-7719-ade7-c2d450e9b5f3, username: ada, display_name: Ada Lovelace}
    created_at: '2026-10-07T08:15:00Z'
    expires_at: '2026-10-08T08:15:00Z'
    executed_by: null
    executed_at: null
    summary:
      files: 6
      create: 3
      conflict: 1
      error: 1
      skip: 1
      exclude: 0
      created: 0
      open: 2
      confidential: 1
      highest_number: 47
    files:
      - path: docs/tickets/README.md
        outcome: skip
        reason: 'not a ticket file: its name is neither NNN-<slug>.md, local_NNN-<slug>.md nor <PROJECT>-<n>.md (docs/adr/0063 D5)'
        format: null
        number: null
        key: null
        conflict: null
        title: null
        type: null
        type_reason: null
        state: null
        block_candidate: null
        block: null
        columns: null
        assignee: null
        parent: null
        note: null
        questions: []
        links: []
        attachments: []
        confidential: false
        confidential_reason: null
        warnings: []
        errors: []
        correction: null
      - path: docs/tickets/041-pick-the-samesite-mode-of-the-session-cookie.md
        outcome: conflict
        reason: 'left out of the import: the project holds its number as acme/WEB-41 (docs/adr/0064 D3)'
        format: repository
        number: 41
        key: acme/WEB-41
        conflict: acme/WEB-41
        title: pick the SameSite mode of the session cookie
        type: task
        type_reason: 'detected: the title names no question, defect, decision or missing capability'
        state: decided
        block_candidate: null
        block: null
        columns:
          severity: medium
          security: hardening
          threat: a cross-site request could carry the session cookie
          horizon: next
          effort: XS
          progress_refinement: 0
          progress: 0
          progress_review: 0
          opened: '2026-09-22'
          decided: '2026-09-25'
          done: null
        assignee: null
        parent: null
        note: null
        questions: []
        links: []
        attachments: []
        confidential: false
        confidential_reason: null
        warnings: []
        errors: []
        correction: null
      - path: docs/tickets/044-the-newsletter-form-accepts-an-empty-address.md
        outcome: create
