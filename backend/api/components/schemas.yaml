  enum: [critical, high, medium, low, cosmetic]
SecurityClass:
  type: string
  enum: [live, boundary, hardening, none]
Horizon:
  type: string
  description: |
    The ticket's horizon, a planning category a person or an agent sets in whatever state the ticket
    is, and nothing else changes (docs/adr/0010 D3): now, to be worked on now; release, to be in the
    next release; next, taken up when now is empty; later, maybe some day; icebox, frozen until what
    it waits for changes
  enum: [now, release, next, later, icebox]
Effort:
  type: string
  enum: [XS, S, M, L]
Block:
  type: object
  required: [from, kind, reason]
