RepositoryProposal:
  type: object
  required: [identity, remote, name, team, teams, tenant, tenants, reason]
  description: The project the agent proposes to create for an unbound repository (docs/adr/0066 D2, D3)
  properties:
    identity: {type: string}
    remote:
      type: string
      description: The remote to bind, as given, without credentials
    name:
      type: string
      description: The proposed project name, the repository's name
    team:
      type: [string, 'null']
      description: The proposed team's slug; null when the person chooses from `teams`
    teams:
      type: array
      description: The team proposed, or the teams to choose from, each with the key that is free there
      items:
        $ref: '#/ProposalTeam'
    tenant:
      type: [string, 'null']
      deprecated: true
      description: Deprecated, replaced by `team`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
    tenants:
      type: array
      deprecated: true
      description: Deprecated, replaced by `teams`, which it repeats; kept in /api/v1 for one release and removed in a later one (docs/adr/0005 D1, docs/adr/0046 D7)
      items:
        $ref: '#/ProposalTeam'
    reason:
      type: string
      enum: [only-tenant, remote-owner, choose]
      description: |
        Why the team: `only-tenant`, the only one the caller may create projects in — the value keeps
        the name before (docs/adr/0005 D1) —; `remote-owner`, the one that binds repositories under the
        same remote owner; or `choose`, none chosen, the list to choose from
RepositoryLookup:
