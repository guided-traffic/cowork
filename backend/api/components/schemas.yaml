ImportExecution:
  type: object
  additionalProperties: false
  properties:
    corrections:
      type: array
      maxItems: 10000
      items:
        $ref: '#/ImportCorrection'
ExportManifest:
  type: object
  description: '`manifest.json` of an export archive (docs/adr/0051 D4)'
  required: [format, team, tenant, projects, exported_at, exported_by, tickets, confidential_not_included]
  properties:
    format:
      type: string
      enum: [cowork export v1]
    team: {type: string, description: 'The team''s slug'}
    tenant:
      type: string
      deprecated: true
      description: |
        Deprecated, replaced by `team`, which it repeats; written for one release and dropped in a
        later one (docs/adr/0005 D1, docs/adr/0046 D7). The importer reads an archive that names only
        `tenant`, as every archive before carries it, for good (docs/adr/0051 D4)
    projects:
      type: array
      description: The project of a project export; every project the caller sees, by key, of a team export
      items:
        $ref: '#/ExportManifestProject'
    exported_at: {type: string, format: date-time}
    exported_by:
      type: string
      description: The exporter as grammar v1 writes a person, `Name <identity>` (docs/adr/0044 D1)
    tickets: {type: integer, description: The documents the archive holds}
    confidential_not_included:
      type: integer
      description: |
        The confidential tickets of these projects the exporter cannot see, which the archive leaves out
        — "n confidential tickets not included" (docs/adr/0065 D5)
  # A member's export of WEB after the import: two confidential tickets are not theirs to read.
  example:
    format: cowork export v1
    team: acme
    tenant: acme
    projects:
      - key: WEB
        name: Website
        archived: false
        tickets: 43
        confidential_not_included: 2
    exported_at: '2026-10-07T09:00:00Z'
    exported_by: 'Sam Rivera <local:sam>'
    tickets: 43
    confidential_not_included: 2
ExportManifestProject:
  type: object
  required: [key, name, archived, tickets, confidential_not_included]
  properties:
    key: {type: string, description: The project's key}
    name: {type: string}
    archived: {type: boolean}
    tickets: {type: integer, description: The documents of this project the archive holds}
    confidential_not_included: {type: integer}
ExportLink:
  type: object
  description: One link of `links.json`, once (docs/adr/0051 D4, docs/adr/0012 D1)
  required: [source, type, target]
  properties:
    source: {type: string, description: 'The source''s key, <team>/<PROJECT>-<n>'}
    type:
      $ref: '#/LinkType'
    target: {type: string, description: 'The target''s key; relates-to is stored and written once'}
  example:
    source: acme/WEB-39
    type: blocks
    target: acme/WEB-42
ExportAttachment:
  type: object
  description: One attachment of `attachments.json` — its metadata and URL, never its bytes (docs/adr/0016 D5)
  required: [ticket, name, type, size, url]
  properties:
    ticket: {type: string, description: 'The ticket''s key'}
    name: {type: string}
    type: {type: string, description: The stored content type}
    size: {type: integer, format: int64}
    url: {type: string, description: 'The path of its bytes, `…/attachments/{attachment}/content`'}
  example:
    ticket: acme/WEB-42
    name: safari-sign-in.png
    type: image/png
    size: 186779
    url: /api/v1/teams/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content
