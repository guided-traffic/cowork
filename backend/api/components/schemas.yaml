      enum: [score]
      description: The order the open tickets take — the score's, the one order there is to adopt
ProjectRankSorted:
  type: object
  required: [moved, score_version]
  properties:
    moved:
      type: integer
      minimum: 0
      description: How many of the open tickets the caller sees changed their place; 0 when the rank followed the score already
    score_version:
      type: integer
      description: The version of the score function the rank was sorted by (docs/adr/0014 D4)
  example:
    moved: 3
    score_version: 1
