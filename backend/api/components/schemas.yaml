    body: |-
      ## Current state

      Safari 18 trims the password field before the form is sent, so a password that ends with a space never matches and the sign-in fails with `invalid_credentials`.

      ## Required changes

      - Send the password as typed.
      - An end-to-end test that signs in with a trailing space in Safari.
