# The comment thread and the activity list of a ticket (docs/adr/0015).
comments:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listComments
    tags: [comments]
    summary: The ticket's comment thread
    parameters:
      - $ref: './components/parameters.yaml#/Order'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of comments; a withdrawn one without its text
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/CommentList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
  post:
    operationId: addComment
    tags: [comments]
    summary: Comment on the ticket
    description: |
      A member's act with `write` scope, in the agent baseline (docs/adr/0043 D2). It tells the
      ticket's watchers, and the persons `mentions` names — each a member who sees the ticket —
      that they are mentioned, once each (docs/adr/0020 D2, docs/adr/0015 D5).
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/CommentWrite'
          example:
            body: |-
              Reproduced with Safari 18.0 on macOS 15: the request carries the password without its trailing space.

              ![The failed sign-in](/api/v1/tenants/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content)

              @Ada Lovelace, see Q1 before we change the form.
            mentions: [019cadb4-4b00-7719-ade7-c2d450e9b5f3]
    responses:
      '201':
        description: The new comment
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
          Location:
            $ref: './components/headers.yaml#/Location'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Comment'
      default:
        $ref: './components/responses.yaml#/Problem'
comment:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/CommentID'
  get:
    operationId: getComment
    tags: [comments]
    summary: One comment
    responses:
      '200':
        description: The comment
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Comment'
      default:
        $ref: './components/responses.yaml#/Problem'
  patch:
    operationId: editComment
    tags: [comments]
    summary: Edit a comment
    description: |
      A person edits their own comments and those their agents wrote; an agent only those an
      agent of the same person wrote (docs/adr/0015 D3, D4). The previous text is kept. `mentions`
      left out keeps the comment's mentions; a list replaces them, and tells the persons it adds
      (D5).
    parameters:
      - $ref: './components/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas.yaml#/CommentWrite'
          example:
            body: |-
              Reproduced with Safari 18.0 and 18.1 on macOS 15: the request carries the password without its trailing space. Chrome and Firefox send it whole.

              ![The failed sign-in](/api/v1/tenants/acme/projects/WEB/tickets/42/attachments/01a10c89-3100-77d9-8eb9-8c1723d7d64c/content)

              @Ada Lovelace, see Q1 before we change the form.
    responses:
      '200':
        description: The comment
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Comment'
      default:
        $ref: './components/responses.yaml#/Problem'
commentRevisions:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/CommentID'
  get:
    operationId: listCommentRevisions
    tags: [comments]
    summary: A comment's edit history, oldest first; empty once withdrawn
    parameters:
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of previous texts
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/CommentRevisionList'
      default:
        $ref: './components/responses.yaml#/Problem'
commentWithdrawal:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
    - $ref: './components/parameters.yaml#/CommentID'
  put:
    operationId: withdrawComment
    tags: [comments]
    summary: Withdraw a comment
    description: |
      Hides the text and keeps the entry (docs/adr/0015 D3): the author, a person for their
      agents' comments, an agent for comments an agent of the same person wrote, or a tenant
      administrator. Idempotent.
    responses:
      '200':
        description: The withdrawn comment
        headers:
          ETag:
            $ref: './components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/Comment'
            example:
              id: 01a10c96-0240-79ce-bd04-bc6c377cbc17
              author: {id: 019cb855-3d80-7d3c-a80d-97fa1e50d59e, username: null, display_name: Grace Hopper}
              agent: null
              token: null
              body: null
              body_html: null
              withdrawn: true
              withdrawn_at: '2026-10-06T09:05:00Z'
              edited: false
              explains: []
              mentions: []
              version: 2
              created_at: '2026-10-05T15:02:00Z'
              updated_at: '2026-10-06T09:05:00Z'
      default:
        $ref: './components/responses.yaml#/Problem'
activity:
  parameters:
    - $ref: './components/parameters.yaml#/TenantSlug'
    - $ref: './components/parameters.yaml#/ProjectKey'
    - $ref: './components/parameters.yaml#/TicketNumber'
  get:
    operationId: listActivity
    tags: [comments]
    summary: The ticket's activity, every recorded act
    description: |
      A projection of the audit record (docs/adr/0015 D6) without time entries and without data
      leaving the system. An act that names a ticket the caller cannot see shows without its
      payload.
    parameters:
      - $ref: './components/parameters.yaml#/Order'
      - $ref: './components/parameters.yaml#/Cursor'
      - $ref: './components/parameters.yaml#/Limit'
      - $ref: './components/parameters.yaml#/IfNoneMatch'
    responses:
      '200':
        description: A page of acts
        headers:
          ETag:
            $ref: './components/headers.yaml#/ListETag'
        content:
          application/json:
            schema:
              $ref: './components/schemas.yaml#/ActivityList'
      '304':
        $ref: './components/responses.yaml#/NotModified'
      default:
        $ref: './components/responses.yaml#/Problem'
