# AN EXAMPLE TO COPY AND ADAPT, NOT A SUPPORTED DEPLOYMENT (docs/adr/0058 D1, D2).
# Written against the MinIO Operator v7.1.1 (its Tenant API, minio.min.io/v2).
# `make examples-lint` checks this file against the Tenant schema of v7.1.1 and
# proves no more than that it parses: it has not been applied to a cluster in
# this repository.
#
# The MinIO Operator's repository is archived since March 2026: v7.1.1, of
# 2025-04-23, is its last release, and the repositories of the MinIO server and
# of its client mc are archived as well, so no fix follows from MinIO for any of
# them. The server image the operator defaults to, minio/minio, can no longer
# be pulled — Docker Hub has no such repository, and quay.io refuses it (checked
# on 2026-10-06) —, so spec.image below names Chainguard's build, the one this
# repository's integration tier runs (MINIO_IMAGE in the Makefile); the operator
# has not been run with it. Do not install the operator for a new installation;
# this file is for a cluster that runs it already. cowork needs no MinIO: any
# S3-compatible store with a bucket and an access key whose policy reaches that
# bucket alone will do (docs/operations/installation.md, "Object storage").
#
# What it makes: a Tenant with one pool and the bucket cowork, served over TLS
# with a certificate the operator has signed through the Kubernetes CSR API.
# It makes no user. The operator gives every user of the Tenant's users field the
# policy consoleAdmin, which administers the whole store, and cowork's key must
# reach its bucket and nothing else (docs/adr/0058 D5). The dedicated access key
# and its bucket-scoped policy are the mc commands of minio-bucket.sh, which the
# Tenant's administrator runs against it with the root credentials below;
# cowork never sees those.
#
# The chart's values for it, in the Tenant's namespace (the operator's Service
# of the S3 API is minio):
#
#   storage:
#     existingSecret: cowork-storage            # what minio-bucket.sh makes
#     endpoint: https://minio.<namespace>.svc.cluster.local
#     bucket: cowork
#     pathStyle: true
#     tls:
#       caConfigMap: kube-root-ca.crt           # key ca.crt, the default
#
# kube-root-ca.crt holds the cluster's authority in every namespace. It is the
# authority of the Tenant's certificate where the cluster signs the operator's
# requests with it, as a cluster made by kubeadm does; a managed cluster may sign
# them otherwise or not at all. Not verified here.
#
# Every name, size and password below is an example.
---
apiVersion: v1
kind: Secret
metadata:
  name: cowork-minio-env
type: Opaque
stringData:
  # The Tenant's root credentials, for its administrator only.
  config.env: |-
    export MINIO_ROOT_USER="CHANGE-ME"
    export MINIO_ROOT_PASSWORD="CHANGE-ME"
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: cowork-minio
spec:
  # Pin it by digest, as MINIO_IMAGE in the Makefile does: Chainguard publishes
  # latest alone without a subscription.
  image: cgr.dev/chainguard/minio:latest
  configuration:
    name: cowork-minio-env
  requestAutoCert: true
  # Made once, when the Tenant is provisioned; the operator marks the field
  # deprecated. mc mb --ignore-existing in minio-bucket.sh makes it as well.
  buckets:
    - name: cowork
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 2
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
