# Default values for cowork. The reference with every key explained is the
# "Helm chart values" section of README.md.
#
# The release runs two Deployments: the backend (Go, the API and the schema
# migration) and the frontend (nginx serving the Angular build and nothing
# else). The Ingress routes /api/ and /auth/ to the backend Service and
# everything else to the frontend Service (docs/adr/0001 D3).

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # Neither pod talks to the Kubernetes API.
  automountServiceAccountToken: false

# Where the backend finds PostgreSQL: the runtime role, which owns nothing and
# is held by row-level security, and below it the owner role, which owns the
# database and runs the migrations (docs/adr/0021 D2). Each comes from a Secret
# that exists before the release, as a URL or as its components, the key names
# yours to choose (docs/adr/0058 D3, D4) — or, for a throw-away installation,
# from an inline URL.
database:
  # Name of an existing Secret with the runtime role's connection. Preferred:
  # the credential never enters the Helm values or the release history.
  existingSecret: ""
  # The key names read from existingSecret. With url set, the Secret holds a
  # connection URL under it (postgres://user:password@host:5432/db?sslmode=require),
  # COWORK_DATABASE_URL. With url empty, the components instead,
  # COWORK_DATABASE_HOST, _PORT, _NAME, _USER, _PASSWORD and _SSLMODE: the user
  # and the password always from the Secret; the host, the port, the name and
  # the sslmode from existingConfigMap when it is named, else from the Secret.
  # The port and the sslmode are read only while their key is named — without
  # them the port is 5432 and the sslmode the driver's default, prefer. The
  # defaults fit a kubernetes.io/basic-auth Secret and the -app Secret of
  # CloudNativePG (deploy/examples/cloudnative-pg-cluster.yaml).
  keys:
    url: databaseUrl
    host: host
    port: port
    name: dbname
    user: username
    password: password
    sslmode: ""
  # The URL's key under its earlier name: set, it wins over keys.url. keys.url
  # empty reads the components whatever this says.
  existingSecretKey: ""
  # Name of an existing ConfigMap with the non-secret components — host, port,
  # name, sslmode, under the keys above; read only with keys.url empty.
  existingConfigMap: ""
  # Inline URL, rendered into a Secret owned by this release. Only for local
  # and throw-away installations: the value is stored in plain text in the
  # release Secret and in every `helm get values` output.
  url: ""
  # The owner role's connection, read only by the migration run — the
  # migrate init container or the migration Job (migrations.mode) — never by
  # the serving container. Required while the release migrates. Its blocks mean
  # what the runtime role's above mean.
  owner:
    # Name of an existing Secret with the owner role's connection. Preferred,
    # and the only source migrations.mode job takes.
    existingSecret: ""
    keys:
      url: databaseUrl
      host: host
      port: port
      name: dbname
      user: username
      password: password
      sslmode: ""
    existingSecretKey: ""
    existingConfigMap: ""
    # Inline URL for throw-away installations, rendered into a release Secret
    # while the init container migrates. It stays in the release's values
    # either way (helm get values).
    url: ""

# Where the schema migrations run (docs/adr/0057).
#   onStart: the init container migrate of every backend pod runs them, as the
#            owner role, before the server starts (D1); backend.config.migrateOnStart
#            false turns it off, and nothing in the release migrates.
#   job:     a Job, <fullname>-migrate, runs them as a Helm hook before every
#            install and upgrade, and then the bootstrap — the local
#            administrator and the bootstrap tenant (D2, D4). A failed Job fails
#            the release before a new pod starts. The Job runs before the
#            release's own Secrets exist, so it takes existingSecret references
#            only: database.existingSecret, database.owner.existingSecret and,
#            with a local administrator, localAdmin.existingSecret; rendering
#            fails on an inline value. It runs as the namespace's default
#            ServiceAccount, or as serviceAccount.name when the chart creates
#            none, with no token mounted.
# The serving container never migrates in either mode and refuses to start on
# pending migrations (D3).
migrations:
  mode: onStart

# The server key, COWORK_SESSION_KEY: standard base64 of at least 32 bytes
# (`openssl rand -base64 32`). It signs the list cursors and keys the hash of a
# login's source address; rotating it invalidates the cursors clients hold
# (docs/adr/0048). Only a Secret reference is accepted (docs/adr/0058 D3); the
# chart fails without one. The browser sessions are rows in the database, not
# signed by this key: a new key logs nobody out.
session:
  existingSecret: ""
  keys:
    key: sessionKey
  # COWORK_SESSION_LIFETIME: the absolute lifetime of a browser session, a Go
  # duration (docs/adr/0031 D3).
  lifetime: 12h
  # COWORK_SESSION_IDLE: how long a session may lie unused; a request within
  # it extends the session up to the lifetime.
  idle: 2h

# The local administrator (docs/adr/0032 D1): a global administrator account
# kept in step with this Secret at every start — created, re-hashed with its
# sessions ended when the password changed, deactivated when both values are
# empty. Preferred: an existing Secret, the key names yours to choose
# (docs/adr/0058 D3). username and password are for throw-away installations:
# plain text in the release Secret and in every `helm get values`, like
# database.url. A cookie login needs backend.config.baseURL, the origin the
# browser sees; rendering fails without it.
localAdmin:
  existingSecret: ""
  keys:
    username: username
    password: password
  username: ""
  password: ""

# The bootstrap tenant (docs/adr/0032 D6): created at start while no tenant
# exists, with the local administrator, when set, as its first administrator
# and auth.oidc.adminGroup, when set, mapped to its admin role; once a tenant
# exists these values do nothing. Both, and localAdmin or auth.oidc.adminGroup,
# or neither.
bootstrap:
  tenant:
    slug: ""
    name: ""

auth:
  # Local accounts (docs/adr/0033): administrators create them, nobody registers.
  local:
    # COWORK_PASSWORD_MIN_LENGTH: length only, no character classes; the floor
    # is 8, and below it the backend refuses to start (D3).
    passwordMinLength: 12
    # COWORK_LOGIN_LOCKOUT: window — five failures of a username within fifteen
    # minutes lock it until the window passes; admin — until an administrator
    # unlocks it (D6).
    lockout: window
    # COWORK_LOGIN_MAX_FAILURES: failures within the window that lock a
    # username; 0 never locks (docs/adr/0039 D6).
    maxFailures: 5
    # COWORK_LOGIN_ADDRESS_LIMIT: login attempts per client address (an IPv6
    # client by its /64) and minute before 429; 0 switches the throttle off. Without
    # backend.config.trustedProxies the client is the TCP peer, behind an
    # Ingress a controller pod, so this is a limit shared by every browser
    # behind it (docs/security/local-accounts.md).
    addressLimit: 20
  # The login through an OpenID Connect identity provider (docs/adr/0029,
  # docs/adr/0030). The issuer turns it on, and emptying it alone turns it
  # off: every other value here is read only with it. Register
  # <backend.config.baseURL>/auth/callback as the redirect URI at the
  # provider; rendering fails without backend.config.baseURL.
  oidc:
    # COWORK_OIDC_ISSUER, e.g. https://login.example.com. The backend fetches
    # its discovery document at every start and refuses to start when it
    # cannot (docs/adr/0029 D4): the provider must be reachable from the pod.
    issuer: ""
    # COWORK_OIDC_CLIENT_ID: cowork's client at the provider. With
    # keys.clientId set it comes from existingSecret instead.
    clientId: ""
    # COWORK_OIDC_CLIENT_SECRET from an existing Secret, required with the
    # issuer: the client secret has no inline value, so it never enters the
    # Helm values or the release history (docs/adr/0058 D3). The key names
    # are yours to choose.
    existingSecret: ""
    keys:
      clientSecret: clientSecret
      # Empty: the client id is clientId above.
      clientId: ""
    # COWORK_OIDC_SCOPES, space-separated, openid among them. Most providers
    # issue a refresh token only for offline_access; without one the groups
    # refresh cannot run, and a session keeps its login's groups until it
    # ends (docs/adr/0030 D5).
    scopes: openid profile email groups offline_access
    # COWORK_OIDC_GROUPS_CLAIM: the claim that carries the groups, read from
    # the ID token and from UserInfo when the token has none (docs/adr/0029 D2).
    groupsClaim: groups
    # COWORK_OIDC_ALLOWED_GROUPS, rendered comma-separated: the gate. Only a
    # person in one of these groups or in adminGroup logs in through the
    # provider; both empty admits nobody (docs/adr/0030 D1, D8). Group names
    # match exactly, case and all.
    allowedGroups: []
    # COWORK_ADMIN_GROUP: its members are global administrators — they create
    # tenants and become the first administrator of each they create
    # (docs/adr/0034 D2). Whoever may change this group at the provider
    # decides who administers the installation.
    adminGroup: ""
    # COWORK_OIDC_GROUPS_REFRESH: how often a browser session re-reads its
    # groups from the provider, a Go duration of at least 1m (docs/adr/0030
    # D5). A person removed from a group at the provider keeps what the group
    # gave until the session's next refresh.
    groupsRefresh: 15m
    # COWORK_OIDC_GROUPS_MAX_AGE: how old a person's groups — read at their
    # last sign-in or session refresh — may be for their personal access tokens
    # to work, a Go duration longer than groupsRefresh (docs/adr/0035 D8).
    # Older groups refuse the tokens with 401 not_allowed until the person
    # signs in to the browser once; a local account's tokens are not affected.
    groupsMaxAge: 168h
    # COWORK_OIDC_EMAIL_TRUSTED: whether an address about which the provider
    # says nothing (no email_verified claim, as Entra sends none) counts as
    # verified when an administrator grants a role by e-mail address
    # (docs/adr/0030 D3). false: only email_verified true matches. Set true only
    # for a provider whose addresses administrators issue: where people choose
    # their own address, one can claim a colleague's.
    emailTrusted: false
    # COWORK_OIDC_DISPLAY_NAME: the login page offers "Sign in with <name>".
    displayName: single sign-on

# S3-compatible object storage for the attachments (docs/adr/0016,
# docs/adr/0058 D3). Without an endpoint — a value, or one from
# existingConfigMap — the backend refuses uploads.
storage:
  # Secret with the access key of a bucket-scoped policy, never root keys.
  existingSecret: ""
  keys:
    accessKeyId: accessKeyId
    secretAccessKey: secretAccessKey
    # The keys of existingConfigMap. A value whose key is named here is read
    # from the ConfigMap; one whose key is empty is the literal value below.
    # The region and the path style may be missing from the ConfigMap, and
    # the backend's defaults apply: the server's region, path style on.
    endpoint: endpoint
    bucket: bucket
    region: region
    pathStyle: pathStyle
  # Name of an existing ConfigMap with the endpoint, the bucket, the region and
  # the path style; naming it turns the storage on, as the endpoint does, and
  # its keys win over the values below.
  existingConfigMap: ""
  # http:// or https:// with host and port, e.g. https://s3.example.com.
  endpoint: ""
  bucket: ""
  # Empty asks the server.
  region: ""
  # Path-style addressing, as MinIO expects.
  pathStyle: true
  tls:
    # ConfigMap with the PEM of a private authority the endpoint's
    # certificate chains to; empty uses the system pool.
    caConfigMap: ""
    keys:
      ca: ca.crt

# The chat in the UI (docs/adr/0076). The backend calls the model for the
# person — the browser never does —, so every provider must be reachable from
# the backend pods: the chart ships no NetworkPolicy, and a policy of the
# cluster's that restricts their egress must admit it. The providers turn the chat on,
# and an empty list alone turns it off: the limits below are rendered only with
# a provider, as the backend refuses to start on a chat variable without one.
#
# WARNING: a provider receives everything the chat reads for its person, in
# every tenant, confidential tickets included — the providers configured here
# are the only gate (the owner's decision of 2026-10-04, docs/security/chat.md).
# Add a hosted provider only where every tenant's data may go to it.
chat:
  # COWORK_CHAT_PROVIDERS and, per provider, COWORK_CHAT_<ID>_NAME, _KIND,
  # _URL, _MODEL and _API_KEY (the id upper-cased, its dashes as
  # underscores). The person picks one in the chat's panel; the first is the
  # default. Each entry:
  #   id:    1 to 32 lowercase letters, digits and dashes, a dash neither
  #          first nor last; unique.
  #   name:  what the panel shows; the id when empty.
  #   kind:  openai (the OpenAI Chat Completions API, which LM Studio, Ollama
  #          and vLLM serve as well) or anthropic (the Anthropic Messages API).
  #   url:   the base URL the backend appends its path to — /chat/completions
  #          for openai, so it ends in /v1, e.g. http://ollama.ai.svc:11434/v1;
  #          /v1/messages for anthropic, e.g. https://api.anthropic.com.
  #          https:// anywhere, http:// only on the operator's network —
  #          localhost, a loopback or private address, a name without a dot or
  #          under .svc, .cluster.local, .internal, .local, .lan, .home.arpa or
  #          .localhost —, because the key and the tenants' data travel in
  #          every request. No user, query or fragment.
  #   model: the model by the name its provider knows it, e.g.
  #          qwen/qwen3-30b-a3b-2507 or claude-sonnet-4-5.
  #   existingSecret: the Secret that holds this provider's API key, one per
  #          provider; required for anthropic, optional for openai (LM Studio
  #          takes none). The key has no inline value, so it never enters the
  #          Helm values or the release history (docs/adr/0058 D3).
  #   keys.apiKey: the key name in that Secret; apiKey when left out.
  # Example:
  #   providers:
  #     - id: lmstudio
  #       name: LM Studio
  #       kind: openai
  #       url: http://lmstudio.ai.svc:1234/v1
  #       model: qwen/qwen3-30b-a3b-2507
  #     - id: claude
  #       name: Claude
  #       kind: anthropic
  #       url: https://api.anthropic.com
  #       model: claude-sonnet-4-5
  #       existingSecret: cowork-chat-claude
  #       keys:
  #         apiKey: apiKey
  providers: []
  # COWORK_CHAT_TURN_TIMEOUT: how long one turn — the model's calls and the
  # tools' — may take, a Go duration; 0 disables the limit (docs/adr/0039 D2).
  turnTimeout: 5m
  # COWORK_CHAT_MAX_STEPS: how many calls of the model one turn may make; 0
  # disables the limit.
  maxSteps: 8

# The Ingress (docs/adr/0001 D3): for every host it routes /api/ and /auth/
# (Prefix) to the backend Service and / (Prefix) to the frontend Service; the
# paths are the chart's, a host has no paths of its own. The chart ships no
# NetworkPolicy: who may reach which pod is the cluster's.
#
# The controller stands in front of the backend itself, and the chart does not
# know which controller it is: its settings are yours, in annotations or in the
# controller's own configuration. It must
#   - pass a request body above the backend's largest limit (maxJsonBody,
#     attachmentMaxBytes, maxImportBytes, rounded up to MiB, plus 1 MiB: 51m
#     with the defaults),
#   - wait for an answer longer than backend.config.requestTimeout plus ten
#     seconds (40 with the default; the two streams send something at least
#     every twenty seconds, so they stay open within it),
#   - pass text/event-stream unbuffered: the backend sends
#     X-Accel-Buffering: no, and a controller that does not honour that header
#     must be told not to buffer,
#   - write the address it saw as the last entry of X-Forwarded-For, which
#     backend.config.trustedProxies relies on,
# so the backend answers its own 413 and 504 with a request id. The install
# notes print the two figures for the values given
# (docs/operations/installation.md#expose-it).
# ingress-nginx is retired (March 2026: no releases, no security fixes since):
# do not install it for a new installation. For a cluster that still runs it,
# the worked example — 1m is its own body limit, 60 seconds its read timeout,
# and it buffers no response and writes the address it saw by default:
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-body-size: 51m
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "40"
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cowork.example.com
  tls: []
  #  - secretName: cowork-tls
  #    hosts:
  #      - cowork.example.com

# The backend's Prometheus metrics (docs/adr/0060): Prometheus text at
# /metrics on a listener of their own, COWORK_METRICS_ADDR, without
# authentication. The port is on the backend pods — the container port
# `metrics` — and never on the backend Service, so the Ingress never reaches
# it. The chart ships no NetworkPolicy: admitting only the monitoring
# namespace to the port is a policy of the cluster's
# (docs/operations/metrics.md). The resources below need the Prometheus
# Operator's CRDs (monitoring.coreos.com/v1) or the Grafana sidecar; each is
# off by default.
metrics:
  # COWORK_METRICS_ADDR=":<port>" and the container port `metrics`. false
  # renders COWORK_METRICS_ADDR="", which switches the backend's listener off.
  enabled: true
  # The port of the listener; it must differ from backend.containerPort.
  port: 8081
  # A PodMonitor that scrapes the `metrics` port of the backend pods and, with
  # frontend.metrics.exporter.enabled, the `nginx-metrics` port of the
  # frontend pods.
  podMonitor:
    enabled: false
    # Labels on the PodMonitor: what your Prometheus's podMonitorSelector
    # matches, e.g. release: kube-prometheus-stack.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # For a Prometheus that discovers Services only: a ServiceMonitor and a
  # headless Service <fullname>-backend-metrics with the metrics port alone,
  # so the backend Service still never carries it. The nginx exporter is
  # scraped through the PodMonitor only.
  serviceMonitor:
    enabled: false
    # Labels on the ServiceMonitor: what your Prometheus's
    # serviceMonitorSelector matches.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # A PrometheusRule with the alerts of docs/operations/metrics.md, each
  # linking its section there.
  prometheusRule:
    enabled: false
    # Labels on the PrometheusRule: what your Prometheus's ruleSelector
    # matches.
    labels: {}
    # Labels added to every alert, for Alertmanager's routing, e.g.
    # team: platform; a severity here replaces the alert's own.
    alertLabels: {}
    # How long the consistency check's counts may stay above zero before
    # CoworkAttachmentsOutOfStep fires: the time a restore of the database
    # and the bucket takes to be settled (docs/adr/0059 D5).
    restoreWindow: 24h
  # A ConfigMap with the Grafana dashboard of the backend's metrics, for the
  # Grafana sidecar that loads labelled ConfigMaps.
  grafanaDashboard:
    enabled: false
    # The label the sidecar looks for; kube-prometheus-stack's default.
    labels:
      grafana_dashboard: "1"
    # e.g. the folder annotation your sidecar reads.
    annotations: {}

backend:
  replicaCount: 1
  image:
    repository: guidedtraffic/cowork-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag; the default is the chart appVersion.
    tag: ""
  # The port the container listens on (COWORK_LISTEN_ADDR).
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  # Server configuration; each key maps to one COWORK_* environment variable.
  config:
    # Read while migrations.mode is onStart: run the schema migrations in an
    # init container of every backend pod, with the owner credential
    # (docs/adr/0057 D1). Several replicas may start at once; golang-migrate
    # serialises them with an advisory lock. false: nothing in the release
    # migrates — run `cowork migrate` yourself. The serving container never
    # migrates (COWORK_MIGRATE_ON_START=false) and refuses to start on pending
    # migrations.
    migrateOnStart: true
    # COWORK_LOG_LEVEL: debug | info | warn | error
    logLevel: info
    # COWORK_LOG_FORMAT: json | text
    logFormat: json
    # COWORK_SHUTDOWN_TIMEOUT: graceful shutdown bound after SIGTERM; keep it
    # below terminationGracePeriodSeconds.
    shutdownTimeout: 15s
    # COWORK_BASE_URL: the public URL of the UI, e.g. https://cowork.example.com
    # — an origin: scheme, host, optional port, no path. The CSRF check compares
    # the Origin of every write of a session with it (docs/adr/0037 D1), so it
    # is the URL the browser shows; required with localAdmin.
    baseURL: ""
    # COWORK_TRUSTED_PROXIES: the networks of the proxies in front of the
    # backend — the Ingress controller's, and a load balancer's that adds a hop
    # —, comma-separated CIDRs (IPv4 and IPv6), set only when non-empty. The
    # login throttle and the audit rows take the client address, found by
    # walking X-Forwarded-For from the right through these networks
    # (docs/adr/0035 D2). Empty: the TCP peer is the client, which behind an
    # Ingress is a controller pod — one address for every browser behind it.
    # Name the controller's networks and no more, e.g. "10.244.0.0/16" for a
    # pod network the controller runs in: every pod inside a trusted network
    # that reaches the backend chooses its own address, and the chart ships no
    # NetworkPolicy to keep other pods away — that is the cluster's
    # (docs/operations/installation.md, docs/security/local-accounts.md H-17).
    trustedProxies: ""
    # The limits of docs/adr/0039 D2; 0 disables each. The Ingress
    # controller's body limit and read timeout must sit above them (see
    # ingress above; docs/adr/0039 D3).
    # COWORK_MAX_JSON_BODY, in bytes.
    maxJsonBody: 1048576
    # COWORK_ATTACHMENT_MAX_BYTES, in bytes (docs/adr/0016 D6).
    attachmentMaxBytes: 10485760
    # COWORK_ATTACHMENT_MAX_PER_TICKET.
    attachmentMaxPerTicket: 100
    # COWORK_ATTACHMENT_TENANT_QUOTA, in bytes: what one tenant's attachments
    # hold together; 0, the default, sets no quota. An installation of several
    # tenants sets one, so that no tenant fills the storage all of them share
    # (docs/adr/0016 D6, docs/security/attachments.md H-10).
    attachmentTenantQuota: 0
    # COWORK_MAX_IMPORT_BYTES, in bytes: an import's upload — a tar.gz, a zip
    # or Markdown files — and what its files hold unpacked; 0 for no bound
    # (docs/adr/0051 D7). An import is read in memory, one at a time per
    # replica: keep the backend's memory limit well above it.
    maxImportBytes: 52428800
    # COWORK_REQUEST_TIMEOUT, in seconds; the event stream is exempt.
    requestTimeout: 30
    # COWORK_MAX_PAGE_SIZE: the largest page a list returns.
    maxPageSize: 200
    # COWORK_MAX_QUERY_LENGTH: the longest full-text query, in characters.
    maxQueryLength: 256
    # COWORK_SSE_REPLAY_WINDOW: how long a replica keeps events for a replay.
    sseReplayWindow: 5m
    # COWORK_SSE_MAX_STREAMS_PER_PERSON, per replica.
    sseMaxStreamsPerPerson: 10
  # Extra environment variables appended to the container, verbatim.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  # The image is distroless and runs as its nonroot user (65532).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # The binary writes nothing to disk.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Probes. The migrations run before the server starts, in the init
  # container or the Job; the startup probe covers the server's own start.
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      periodSeconds: 10
    readiness:
      periodSeconds: 10
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1
  image:
    repository: guidedtraffic/cowork-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag; the default is the chart appVersion.
    tag: ""
  # nginx-unprivileged listens here; the nginx configuration in the image says 8080.
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  # Extra environment variables appended to the container, verbatim — the
  # image's entrypoint switches, NGINX_ENTRYPOINT_QUIET_LOGS for one; the
  # configuration reads none.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  # nginx-unprivileged runs as its nginx user (101). fsGroup makes the
  # emptyDir volume at /tmp writable for it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # nginx writes its pid and its temp files, and the Deployment mounts an
  # emptyDir at /tmp for that; its configuration is part of the image.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  probes:
    liveness:
      periodSeconds: 10
    readiness:
      periodSeconds: 10
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # nginx's counts for Prometheus (docs/adr/0060 D7). The configuration in the
  # image always serves stub_status on 127.0.0.1:8082 inside the pod, which
  # nothing outside the pod reaches; the exporter sidecar reads it and serves
  # Prometheus text on the container port `nginx-metrics`, which
  # metrics.podMonitor scrapes. Like nginx it runs as 101 with a read-only root
  # filesystem.
  metrics:
    exporter:
      enabled: false
      image:
        repository: nginx/nginx-prometheus-exporter
        tag: "1.5.3"
        pullPolicy: IfNotPresent
      port: 9113
      resources:
        limits:
          memory: 32Mi
        requests:
          cpu: 5m
          memory: 16Mi
