# Default values for cowork. The reference with every key explained is the
# "Helm chart values" section of README.md.
#
# The release runs two Deployments: the backend (Go, the API and the schema
# migration) and the frontend (nginx serving the Angular build and proxying
# /api/ to the backend Service). The Ingress points at the frontend.

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # Neither pod talks to the Kubernetes API.
  automountServiceAccountToken: false

# Where the backend finds PostgreSQL.
database:
  # Name of an existing Secret that holds the PostgreSQL connection URL
  # (postgres://user:password@host:5432/db?sslmode=require). Preferred: the
  # credential never enters the Helm values or the release history.
  existingSecret: ""
  # Key inside that Secret.
  existingSecretKey: databaseUrl
  # Inline URL, rendered into a Secret owned by this release. Only for local
  # and throw-away installations: the value is stored in plain text in the
  # release Secret and in every `helm get values` output.
  url: ""
  # The runtime role above owns nothing and is subject to row-level
  # security; the owner role owns the database and runs the migrations
  # (docs/adr/0021 D2). Its credential reaches only the migration init
  # container, never the serving container. One source is required.
  owner:
    # Name of an existing Secret with the owner role's connection URL. Preferred.
    existingSecret: ""
    existingSecretKey: databaseUrl
    # Inline URL for throw-away installations, rendered into a release Secret
    # while backend.config.migrateOnStart is true. It stays in the release's
    # values either way (helm get values).
    url: ""

# The server key, COWORK_SESSION_KEY: standard base64 of at least 32 bytes
# (`openssl rand -base64 32`). It signs the list cursors; rotating it
# invalidates the cursors clients hold (docs/adr/0048). Only a Secret
# reference is accepted (docs/adr/0058 D3); the chart fails without one.
session:
  existingSecret: ""
  keys:
    key: sessionKey

# S3-compatible object storage for the attachments (docs/adr/0016,
# docs/adr/0058 D3). Without an endpoint the backend refuses uploads.
storage:
  # Secret with the access key of a bucket-scoped policy, never root keys.
  existingSecret: ""
  keys:
    accessKeyId: accessKeyId
    secretAccessKey: secretAccessKey
  # http:// or https:// with host and port, e.g. https://s3.example.com.
  endpoint: ""
  bucket: ""
  # Empty asks the server.
  region: ""
  # Path-style addressing, as MinIO expects.
  pathStyle: true
  tls:
    # ConfigMap with the PEM of a private authority the endpoint's
    # certificate chains to; empty uses the system pool.
    caConfigMap: ""
    keys:
      ca: ca.crt

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cowork.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cowork-tls
  #    hosts:
  #      - cowork.example.com

backend:
  replicaCount: 1
  image:
    repository: guidedtraffic/cowork-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag; the default is the chart appVersion.
    tag: ""
  # The port the container listens on (COWORK_LISTEN_ADDR).
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  # Server configuration; each key maps to one COWORK_* environment variable.
  config:
    # Run the schema migrations in an init container of every backend pod,
    # with the owner credential (docs/adr/0057 D1). Several replicas may start
    # at once; golang-migrate serialises them with an advisory lock. The
    # serving container never migrates (COWORK_MIGRATE_ON_START=false) and
    # refuses to start on pending migrations.
    migrateOnStart: true
    # COWORK_LOG_LEVEL: debug | info | warn | error
    logLevel: info
    # COWORK_LOG_FORMAT: json | text
    logFormat: json
    # COWORK_SHUTDOWN_TIMEOUT: graceful shutdown bound after SIGTERM; keep it
    # below terminationGracePeriodSeconds.
    shutdownTimeout: 15s
    # COWORK_BASE_URL: the public URL of the UI, e.g. https://cowork.example.com.
    # Empty until a feature needs it.
    baseURL: ""
    # The limits of docs/adr/0039 D2; 0 disables each. nginx is sized from
    # them with headroom (docs/adr/0039 D3).
    # COWORK_MAX_JSON_BODY, in bytes.
    maxJsonBody: 1048576
    # COWORK_ATTACHMENT_MAX_BYTES, in bytes (docs/adr/0016 D6).
    attachmentMaxBytes: 10485760
    # COWORK_ATTACHMENT_MAX_PER_TICKET.
    attachmentMaxPerTicket: 100
    # COWORK_REQUEST_TIMEOUT, in seconds; the event stream is exempt.
    requestTimeout: 30
    # COWORK_MAX_PAGE_SIZE: the largest page a list returns.
    maxPageSize: 200
    # COWORK_MAX_QUERY_LENGTH: the longest full-text query, in characters.
    maxQueryLength: 256
    # COWORK_SSE_REPLAY_WINDOW: how long a replica keeps events for a replay.
    sseReplayWindow: 5m
    # COWORK_SSE_MAX_STREAMS_PER_PERSON, per replica.
    sseMaxStreamsPerPerson: 10
  # Extra environment variables appended to the container, verbatim.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  # The image is distroless and runs as its nonroot user (65532).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # The binary writes nothing to disk.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Probes. The migrations run in the init container before the server
  # starts; the startup probe covers the server's own start.
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      periodSeconds: 10
    readiness:
      periodSeconds: 10
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1
  image:
    repository: guidedtraffic/cowork-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag; the default is the chart appVersion.
    tag: ""
  # nginx-unprivileged listens here; the nginx configuration in the image says 8080.
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  # Extra environment variables appended to the container, verbatim.
  # BACKEND_URL is set by the chart to the backend Service.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  # nginx-unprivileged runs as its nginx user (101). fsGroup makes the two
  # emptyDir volumes below writable for it; without it the entrypoint cannot
  # render the configuration and nginx serves nothing.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # nginx writes its pid, its temp files and the rendered configuration; the
  # Deployment mounts emptyDirs at /tmp and /etc/nginx/conf.d for that.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  probes:
    liveness:
      periodSeconds: 10
    readiness:
      periodSeconds: 10
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
