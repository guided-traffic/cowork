{{- /*
The Grafana dashboard of docs/adr/0060 D3: one dashboard JSON in a ConfigMap
the Grafana sidecar loads by its label. The JSON is generated by
`make generate` from backend/internal/metrics, where a test holds every panel
to an instrument that exists.
*/}}
{{- if .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" (include "cowork.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "cowork.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  cowork.json: |-
    {{- .Files.Get "files/grafana-dashboard.json" | trim | nindent 4 }}
{{- end }}
