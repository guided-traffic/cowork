{{- if .Values.networkPolicy.enabled }}
# The backend's pods take connections from the frontend's pods only
# (docs/adr/0001 D3): the backend reads X-Forwarded-For from the networks of
# backend.config.trustedProxies (docs/adr/0035 D2), so no pod but the proxy
# in front of it may be able to reach it and write that header. Egress is not
# restricted — the backend reaches the database, the object storage, the
# identity provider and DNS.
# Traffic from the node a pod runs on, which is where the kubelet's probes come
# from, is always allowed (kubernetes.io, Network Policies).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cowork.backend.fullname" . }}
  labels:
    {{- include "cowork.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "cowork.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cowork.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}
{{- end }}
