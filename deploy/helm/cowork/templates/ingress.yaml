{{- if .Values.ingress.enabled -}}
# The one origin the browser sees (docs/adr/0001 D3): the API and the browser's
# login flows go to the backend Service, everything else to the frontend
# Service, which serves the UI only. The paths are the chart's, not values:
# the backend serves no UI and the frontend no /api/ or /auth/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cowork.fullname" . }}
  labels:
    {{- include "cowork.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range list "/api/" "/auth/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "cowork.backend.fullname" $ }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cowork.frontend.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
