apiVersion: v1
kind: Service
metadata:
  name: {{ include "cowork.backend.fullname" . }}
  labels:
    {{- include "cowork.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cowork.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
