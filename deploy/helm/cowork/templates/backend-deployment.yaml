{{- $metrics := include "cowork.metrics" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cowork.backend.fullname" . }}
  labels:
    {{- include "cowork.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cowork.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.database.url (not .Values.database.existingSecret) }}
        checksum/database-secret: {{ .Values.database.url | sha256sum }}
        {{- end }}
        {{- if and (include "cowork.initContainerMigrates" .) .Values.database.owner.url (not .Values.database.owner.existingSecret) }}
        checksum/database-owner-secret: {{ .Values.database.owner.url | sha256sum }}
        {{- end }}
        {{- if and (not .Values.localAdmin.existingSecret) .Values.localAdmin.username .Values.localAdmin.password }}
        checksum/local-admin-secret: {{ printf "%s:%s" .Values.localAdmin.username .Values.localAdmin.password | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cowork.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cowork.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- if include "cowork.initContainerMigrates" . }}
      # The migrations run here, as the owner role, before the server starts
      # (docs/adr/0057 D1); only this container holds the owner credential.
      # It reads the runtime URL as well, for the runtime role's grants.
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          env:
            {{- include "cowork.databaseEnv" (dict "root" . "owner" false) | nindent 12 }}
            {{- include "cowork.databaseEnv" (dict "root" . "owner" true) | nindent 12 }}
            - name: COWORK_LOG_LEVEL
              value: {{ .Values.backend.config.logLevel | quote }}
            - name: COWORK_LOG_FORMAT
              value: {{ .Values.backend.config.logFormat | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          env:
            - name: COWORK_LISTEN_ADDR
              value: ":{{ .Values.backend.containerPort }}"
            # The metrics listener (docs/adr/0060 D1), on the pod and never on
            # the Service; an empty value switches it off.
            - name: COWORK_METRICS_ADDR
              value: {{ if include "cowork.metricsEnabled" . }}{{ printf ":%d" (int $metrics.port) | quote }}{{ else }}""{{ end }}
            {{- include "cowork.databaseEnv" (dict "root" . "owner" false) | nindent 12 }}
            # The serving container never migrates: it holds no owner
            # credential and refuses to start on pending migrations.
            - name: COWORK_MIGRATE_ON_START
              value: "false"
            - name: COWORK_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cowork.sessionSecretName" . }}
                  key: {{ .Values.session.keys.key }}
            - name: COWORK_SESSION_LIFETIME
              value: {{ .Values.session.lifetime | quote }}
            - name: COWORK_SESSION_IDLE
              value: {{ .Values.session.idle | quote }}
            - name: COWORK_PASSWORD_MIN_LENGTH
              value: {{ .Values.auth.local.passwordMinLength | int64 | toString | quote }}
            - name: COWORK_LOGIN_LOCKOUT
              value: {{ .Values.auth.local.lockout | quote }}
            - name: COWORK_LOGIN_MAX_FAILURES
              value: {{ .Values.auth.local.maxFailures | int64 | toString | quote }}
            - name: COWORK_LOGIN_ADDRESS_LIMIT
              value: {{ .Values.auth.local.addressLimit | int64 | toString | quote }}
            {{- if include "cowork.localAdminEnabled" . }}
            - name: COWORK_LOCAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cowork.localAdminSecretName" . }}
                  key: {{ include "cowork.localAdminUsernameKey" . }}
            - name: COWORK_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cowork.localAdminSecretName" . }}
                  key: {{ include "cowork.localAdminPasswordKey" . }}
            {{- end }}
            {{- if include "cowork.oidcEnabled" . }}
            - name: COWORK_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: COWORK_OIDC_CLIENT_ID
              {{- if and .Values.auth.oidc.existingSecret .Values.auth.oidc.keys.clientId }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.keys.clientId }}
              {{- else }}
              value: {{ .Values.auth.oidc.clientId | quote }}
              {{- end }}
            - name: COWORK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ include "cowork.oidcClientSecretKey" . }}
            - name: COWORK_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: COWORK_OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            {{- with .Values.auth.oidc.allowedGroups }}
            - name: COWORK_OIDC_ALLOWED_GROUPS
              value: {{ join "," (toStrings .) | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.adminGroup }}
            - name: COWORK_ADMIN_GROUP
              value: {{ . | quote }}
            {{- end }}
            - name: COWORK_OIDC_GROUPS_REFRESH
              value: {{ .Values.auth.oidc.groupsRefresh | quote }}
            - name: COWORK_OIDC_GROUPS_MAX_AGE
              value: {{ .Values.auth.oidc.groupsMaxAge | quote }}
            - name: COWORK_OIDC_EMAIL_TRUSTED
              value: {{ .Values.auth.oidc.emailTrusted | quote }}
            - name: COWORK_OIDC_DISPLAY_NAME
              value: {{ .Values.auth.oidc.displayName | quote }}
            {{- end }}
            {{- if or .Values.bootstrap.tenant.slug .Values.bootstrap.tenant.name }}
            {{- if not (or (include "cowork.localAdminEnabled" .) (and (include "cowork.oidcEnabled" .) .Values.auth.oidc.adminGroup)) }}
            {{- fail "bootstrap.tenant needs a first administrator (docs/adr/0032 D6, D7): set localAdmin, or auth.oidc with auth.oidc.adminGroup" }}
            {{- end }}
            - name: COWORK_BOOTSTRAP_TENANT_SLUG
              value: {{ required "set bootstrap.tenant.slug and bootstrap.tenant.name together" .Values.bootstrap.tenant.slug | quote }}
            - name: COWORK_BOOTSTRAP_TENANT_NAME
              value: {{ required "set bootstrap.tenant.slug and bootstrap.tenant.name together" .Values.bootstrap.tenant.name | quote }}
            {{- end }}
            - name: COWORK_MAX_JSON_BODY
              value: {{ .Values.backend.config.maxJsonBody | int64 | toString | quote }}
            - name: COWORK_ATTACHMENT_MAX_BYTES
              value: {{ .Values.backend.config.attachmentMaxBytes | int64 | toString | quote }}
            - name: COWORK_ATTACHMENT_MAX_PER_TICKET
              value: {{ .Values.backend.config.attachmentMaxPerTicket | int64 | toString | quote }}
            - name: COWORK_ATTACHMENT_TENANT_QUOTA
              value: {{ .Values.backend.config.attachmentTenantQuota | int64 | toString | quote }}
            - name: COWORK_MAX_IMPORT_BYTES
              value: {{ .Values.backend.config.maxImportBytes | int64 | toString | quote }}
            - name: COWORK_REQUEST_TIMEOUT
              value: {{ printf "%ds" (.Values.backend.config.requestTimeout | int64) | quote }}
            - name: COWORK_MAX_PAGE_SIZE
              value: {{ .Values.backend.config.maxPageSize | int64 | toString | quote }}
            - name: COWORK_MAX_QUERY_LENGTH
              value: {{ .Values.backend.config.maxQueryLength | int64 | toString | quote }}
            - name: COWORK_SSE_REPLAY_WINDOW
              value: {{ .Values.backend.config.sseReplayWindow | quote }}
            - name: COWORK_SSE_MAX_STREAMS_PER_PERSON
              value: {{ .Values.backend.config.sseMaxStreamsPerPerson | int64 | toString | quote }}
            {{- if include "cowork.storageEnabled" . }}
            {{- /* With storage.existingConfigMap, each of the four values whose key in
            storage.keys is not empty comes from the ConfigMap; the region and the
            path style may be missing from it, and the backend's defaults apply
            (docs/adr/0058 D3). */}}
            {{- $cm := .Values.storage.existingConfigMap }}
            {{- $keys := .Values.storage.keys | default dict }}
            {{- $endpointKey := and $cm (dig "endpoint" "endpoint" $keys) }}
            {{- $bucketKey := and $cm (dig "bucket" "bucket" $keys) }}
            {{- $regionKey := and $cm (dig "region" "region" $keys) }}
            {{- $pathStyleKey := and $cm (dig "pathStyle" "pathStyle" $keys) }}
            - name: COWORK_S3_ENDPOINT
              {{- if $endpointKey }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cm }}
                  key: {{ $endpointKey }}
              {{- else }}
              value: {{ required "set storage.endpoint, or storage.keys.endpoint to its key in storage.existingConfigMap" .Values.storage.endpoint | quote }}
              {{- end }}
            - name: COWORK_S3_BUCKET
              {{- if $bucketKey }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cm }}
                  key: {{ $bucketKey }}
              {{- else }}
              value: {{ required "storage.bucket is required with storage.endpoint, or storage.keys.bucket to its key in storage.existingConfigMap" .Values.storage.bucket | quote }}
              {{- end }}
            {{- if $regionKey }}
            - name: COWORK_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ $cm }}
                  key: {{ $regionKey }}
                  optional: true
            {{- else }}
            {{- with .Values.storage.region }}
            - name: COWORK_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: COWORK_S3_USE_PATH_STYLE
              {{- if $pathStyleKey }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cm }}
                  key: {{ $pathStyleKey }}
                  optional: true
              {{- else }}
              value: {{ .Values.storage.pathStyle | quote }}
              {{- end }}
            - name: COWORK_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.existingSecret is required with storage.endpoint or storage.existingConfigMap" .Values.storage.existingSecret }}
                  key: {{ .Values.storage.keys.accessKeyId }}
            - name: COWORK_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.existingSecret }}
                  key: {{ .Values.storage.keys.secretAccessKey }}
            {{- if .Values.storage.tls.caConfigMap }}
            - name: COWORK_S3_CA
              value: /etc/cowork/s3-ca/{{ .Values.storage.tls.keys.ca }}
            {{- end }}
            {{- end }}
            {{- if include "cowork.chatEnabled" . }}
            - name: COWORK_CHAT_PROVIDERS
              value: {{ include "cowork.chatProviderIds" . | quote }}
            {{- range .Values.chat.providers }}
            {{- $env := include "cowork.chatEnv" .id }}
            - name: {{ $env }}_NAME
              value: {{ .name | default .id | quote }}
            - name: {{ $env }}_KIND
              value: {{ lower .kind | quote }}
            - name: {{ $env }}_URL
              value: {{ .url | quote }}
            - name: {{ $env }}_MODEL
              value: {{ .model | quote }}
            {{- if .existingSecret }}
            - name: {{ $env }}_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ (default (dict) .keys).apiKey | default "apiKey" }}
            {{- end }}
            {{- end }}
            - name: COWORK_CHAT_TURN_TIMEOUT
              value: {{ .Values.chat.turnTimeout | quote }}
            - name: COWORK_CHAT_MAX_STEPS
              value: {{ .Values.chat.maxSteps | int64 | toString | quote }}
            {{- end }}
            - name: COWORK_LOG_LEVEL
              value: {{ .Values.backend.config.logLevel | quote }}
            - name: COWORK_LOG_FORMAT
              value: {{ .Values.backend.config.logFormat | quote }}
            - name: COWORK_SHUTDOWN_TIMEOUT
              value: {{ .Values.backend.config.shutdownTimeout | quote }}
            {{- if .Values.backend.config.baseURL }}
            - name: COWORK_BASE_URL
              value: {{ .Values.backend.config.baseURL | quote }}
            {{- end }}
            {{- if .Values.backend.config.trustedProxies }}
            - name: COWORK_TRUSTED_PROXIES
              value: {{ .Values.backend.config.trustedProxies | quote }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
            {{- if include "cowork.metricsEnabled" . }}
            # Prometheus text at /metrics, without authentication; the
            # backend Service does not list it (docs/adr/0060 D2).
            - name: metrics
              containerPort: {{ $metrics.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if and (include "cowork.storageEnabled" .) .Values.storage.tls.caConfigMap }}
          volumeMounts:
            - name: s3-ca
              mountPath: /etc/cowork/s3-ca
              readOnly: true
          {{- end }}
      {{- if and (include "cowork.storageEnabled" .) .Values.storage.tls.caConfigMap }}
      volumes:
        - name: s3-ca
          configMap:
            name: {{ .Values.storage.tls.caConfigMap }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
