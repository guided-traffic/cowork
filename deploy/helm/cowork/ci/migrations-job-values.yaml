# The migration mode job (docs/adr/0057 D2, D4, D5): the migrations and the
# bootstrap in a Helm hook Job. Every credential the Job reads comes from a
# Secret that exists before the release — the runtime role's URL, the owner
# role as the components of a Secret with no URL key and no ConfigMap, the
# local administrator — and the bootstrap team maps the administrator group
# of an identity provider, whose client secret the Job is not given. The
# bootstrap team and the attachment quota keep the values' names before,
# bootstrap.tenant and attachmentTenantQuota, which the chart reads for one
# release (docs/adr/0005 D1): they must render as COWORK_BOOTSTRAP_TEAM_SLUG,
# COWORK_BOOTSTRAP_TEAM_NAME and COWORK_ATTACHMENT_TEAM_QUOTA, each beside its
# name before with the same value, which an image rollback reads.
migrations:
  mode: job
database:
  existingSecret: cowork-database
  owner:
    existingSecret: cowork-db-app
    keys:
      url: ""
session:
  existingSecret: cowork-session
localAdmin:
  existingSecret: cowork-local-admin
bootstrap:
  tenant:
    slug: acme
    name: Acme Corp
auth:
  oidc:
    issuer: https://login.example.com/realms/cowork
    clientId: cowork
    existingSecret: cowork-oidc
    allowedGroups:
      - cowork-users
    adminGroup: cowork-admins
imagePullSecrets:
  - name: registry
backend:
  config:
    baseURL: https://cowork.example.com
    attachmentTenantQuota: 5368709120
  nodeSelector:
    kubernetes.io/os: linux
