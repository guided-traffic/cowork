# Trusted proxies behind the chart's Ingress (docs/adr/0035 D2,
# docs/adr/0001 D3): the pod network the Ingress controller runs in is
# trusted, the shape an installation that wants the browser's address in the
# login throttle sets. The chart renders no NetworkPolicy with it; keeping
# other pods away from the backend is the cluster's (H-17 in
# docs/security/local-accounts.md), and the notes warn about it.
database:
  existingSecret: cowork-database
  owner:
    existingSecret: cowork-database-owner

session:
  existingSecret: cowork-session

localAdmin:
  existingSecret: cowork-local-admin

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: cowork.example.com
  tls:
    - secretName: cowork-tls
      hosts:
        - cowork.example.com

backend:
  config:
    baseURL: https://cowork.example.com
    trustedProxies: "10.244.0.0/16,fd00:10:244::/48"
