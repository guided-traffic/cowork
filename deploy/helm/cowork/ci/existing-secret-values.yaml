# Production shape: the database URL comes from a Secret that exists before the release.
database:
  existingSecret: cowork-database
  existingSecretKey: url
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: cowork.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cowork-tls
      hosts:
        - cowork.example.com
backend:
  replicaCount: 2
  config:
    baseURL: https://cowork.example.com
frontend:
  replicaCount: 2
