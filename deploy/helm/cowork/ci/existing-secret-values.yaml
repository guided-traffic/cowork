# Production shape: every credential comes from a Secret that exists before
# the release.
database:
  existingSecret: cowork-database
  existingSecretKey: url
  owner:
    existingSecret: cowork-database-owner
    existingSecretKey: url
session:
  existingSecret: cowork-session
storage:
  existingSecret: cowork-storage
  endpoint: https://s3.example.com
  bucket: cowork
  region: eu-central-1
  pathStyle: false
  tls:
    caConfigMap: cowork-s3-ca
# An Ingress with annotations: those of the worked example for a cluster that
# still runs ingress-nginx, which is retired and not for a new installation
# (docs/operations/installation.md#expose-it).
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 11m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "40"
  hosts:
    - host: cowork.example.com
  tls:
    - secretName: cowork-tls
      hosts:
        - cowork.example.com
backend:
  replicaCount: 2
  config:
    baseURL: https://cowork.example.com
frontend:
  replicaCount: 2
