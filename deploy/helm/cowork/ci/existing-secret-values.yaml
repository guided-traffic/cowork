# Production shape: every credential comes from a Secret that exists before
# the release.
database:
  existingSecret: cowork-database
  existingSecretKey: url
  owner:
    existingSecret: cowork-database-owner
    existingSecretKey: url
session:
  existingSecret: cowork-session
storage:
  existingSecret: cowork-storage
  endpoint: https://s3.example.com
  bucket: cowork
  region: eu-central-1
  pathStyle: false
  tls:
    caConfigMap: cowork-s3-ca
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: cowork.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cowork-tls
      hosts:
        - cowork.example.com
backend:
  replicaCount: 2
  config:
    baseURL: https://cowork.example.com
frontend:
  replicaCount: 2
