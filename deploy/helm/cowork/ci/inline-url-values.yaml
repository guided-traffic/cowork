# Throw-away shape: the chart renders both database Secrets itself. The server
# key has no inline path (docs/adr/0058 D3).
database:
  url: postgres://cowork_app:cowork_app@postgres:5432/cowork?sslmode=disable
  owner:
    url: postgres://cowork_owner:cowork_owner@postgres:5432/cowork?sslmode=disable
session:
  existingSecret: cowork-session
# The throw-away local administrator: rendered into <fullname>-local-admin.
localAdmin:
  username: admin
  password: change-me-before-use
# The identity provider with the client id as a value and a gate without an
# administrator group; the client secret comes from a Secret in every shape
# (docs/adr/0058 D3).
auth:
  oidc:
    issuer: https://dex.example.test/dex
    clientId: cowork
    existingSecret: cowork-oidc
    allowedGroups:
      - cowork-users
# The chat to a model in the cluster that takes no key, declared inside the
# installation, with both limits switched off (docs/adr/0076).
chat:
  provider: openai
  url: http://ollama.ai.svc:11434/v1
  model: llama3:8b
  inside: true
  turnTimeout: 0
  maxSteps: 0
backend:
  config:
    baseURL: http://localhost:4200
    logFormat: text
    logLevel: debug
    attachmentMaxBytes: 0
    requestTimeout: 0
  extraEnv:
    - name: COWORK_EXAMPLE
      value: "1"
frontend:
  extraEnv:
    - name: NGINX_ENTRYPOINT_QUIET_LOGS
      value: "1"
