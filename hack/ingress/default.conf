# A stand-in for the Ingress, for runs of the two images on one Docker network
# (docs/developer/build-test-lint.md, "Run the images together"). It routes as
# the chart's Ingress does (docs/adr/0001 D3): /api/ and /auth/ to the backend,
# everything else to the frontend. It is copied over the default server of
# INGRESS_IMAGE (the Makefile). It terminates no TLS and is no model of a
# controller beyond what is written here.
#
# The two containers are the network aliases `backend` and `frontend`, both on
# :8080, looked up per request through Docker's DNS (127.0.0.11 on a
# user-defined network) and kept a second, so either may start, stop or be
# replaced after this one; one that is not there answers 502.

server {
    listen       8080;
    server_name  _;
    server_tokens off;

    resolver 127.0.0.11 valid=1s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The address this proxy saw, in place of anything the client wrote — what
    # ingress-nginx sends by default (use-forwarded-headers: "false"; its
    # generated configuration of v1.15.1 has X-Forwarded-For $remote_addr).
    proxy_set_header X-Forwarded-For   $remote_addr;

    # The limits docs/operations/installation.md names for the controller, at
    # the chart's defaults: a body of 11m, a read timeout of 40s. Response
    # buffering stays at nginx's default, on: the backend's
    # X-Accel-Buffering: no is what lets the two streams through unbuffered.
    client_max_body_size 11m;
    proxy_read_timeout   40s;

    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
    }

    location /auth/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
    }

    location / {
        set $upstream http://frontend:8080;
        proxy_pass $upstream;
    }
}
