name: Release Docker & Helm
on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  attestations: write

jobs:
  build:
    name: Build Docker Image (${{ matrix.component }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: tag_names
        uses: docker/metadata-action@v6
        with:
          images: |
            guidedtraffic/cowork-${{ matrix.component }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=cowork-${{ matrix.component }}
            org.opencontainers.image.description=cowork ${{ matrix.component }} - multi-tenant backlog and kanban board for people and LLM agents
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/guided-traffic/cowork
            org.opencontainers.image.source=https://github.com/guided-traffic/cowork

      - name: Get current epoch time
        id: time
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Extract version without v prefix
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          file: ${{ matrix.component }}/Containerfile
          context: ${{ matrix.component }}
          build-args: |
            BUILD_NUMBER=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.epoch }}
          # The PrimeUI license key of the released frontend (docs/adr/0052 D9); the backend
          # build does not read it.
          secrets: |
            primeui_license=${{ secrets.PRIMEUI_LICENSE }}
          platforms: linux/amd64  # ,linux/arm64
          push: true
          tags: ${{ steps.tag_names.outputs.tags }}
          labels: ${{ steps.tag_names.outputs.labels }}
          provenance: true
          sbom: true
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=cowork ${{ matrix.component }}

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@v0
        with:
          image: guidedtraffic/cowork-${{ matrix.component }}:${{ steps.version.outputs.version }}
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/guidedtraffic-cowork-${{ matrix.component }}_*.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: guidedtraffic/cowork-${{ matrix.component }}:${{ steps.version.outputs.version }}
          sarif-file: scout-report.sarif
          summary: true
          dockerhub-user: guidedtraffic
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

  # The MCP server for Claude Code, a static binary per platform with a
  # SHA-256 file each and a build provenance attestation, attached to the
  # release (docs/adr/0041 D2).
  release-mcp:
    name: Release cowork-mcp Binaries
    runs-on: self-hosted
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME="$(date +%s)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            name="cowork-mcp-${VERSION}-${os}-${arch}${ext}"
            make build-mcp GOOS="$os" GOARCH="$arch" VERSION="$VERSION" GIT_COMMIT="${GITHUB_SHA::7}" \
              BUILD_TIME="$BUILD_TIME" MCP_OUT="$PWD/dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          # The binaries, not their checksum files, are the subjects of the attestation.
          cat dist/*.sha256 > subjects.sha256
          ls -l dist

      - name: Attest the provenance of the binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: subjects.sha256

      - name: Upload the binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/cowork-mcp-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-helm-gh:
    name: Release Helm Chart to GitHub Pages
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Update Chart Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version:.*$/version: ${VERSION}/" deploy/helm/cowork/Chart.yaml
          sed -i "s/^appVersion:.*$/appVersion: \"${VERSION}\"/" deploy/helm/cowork/Chart.yaml

      - name: Create Helm Package
        run: |
          cd deploy/helm
          helm package cowork/
          mkdir -p repo
          mv *.tgz repo/
          helm repo index repo/ --url https://guided-traffic.github.io/cowork/
          cd ../..

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Save Chart Package
        run: |
          mkdir -p /tmp/helm-charts
          cp -r deploy/helm/repo/* /tmp/helm-charts/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        run: |
          cp /tmp/helm-charts/*.tgz .

          if [ -f index.yaml ]; then
            mkdir -p temp-repo
            cp *.tgz temp-repo/
            helm repo index temp-repo/ --url https://guided-traffic.github.io/cowork/ --merge index.yaml
            cp temp-repo/index.yaml .
            rm -rf temp-repo
          else
            helm repo index . --url https://guided-traffic.github.io/cowork/
          fi

          git add --force *.tgz index.yaml
          git commit -m "Release Helm chart for $GITHUB_REF_NAME"
          git push --force origin gh-pages

      # Only this release's own package belongs on the release; index.yaml is the
      # full repo index and stays as a restorable snapshot of gh-pages.
      - name: Update Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cowork-${{ steps.version.outputs.version }}.tgz
            index.yaml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
