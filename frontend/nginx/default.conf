# The frontend's nginx configuration, copied into the image as
# /etc/nginx/conf.d/default.conf; nothing in it is substituted at start, so no
# environment variable changes it. It serves the UI and nothing else: the
# Ingress routes /api/ and /auth/ to the backend Service and everything else
# here, and this server never reaches the backend (docs/adr/0001 D3).

# The access log carries the time, the method, the path, the status, the size
# and the duration — never the query, which holds search terms and filters,
# and no header: the backend's request log keeps the same rule.
log_format cowork '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen       8080;
    server_name  _;
    server_tokens off;
    access_log   /dev/stdout cowork;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The content security policy of the UI: everything the shell loads and
    # every request it makes stays on this origin. Its scripts are the
    # bundle's files — the production build inlines no critical CSS
    # ("inlineCritical": false in angular.json), because the inliner loads the
    # rest of the stylesheet with an inline script this policy refuses —; its
    # styles are files plus the <style> elements Angular and PrimeNG write at
    # run time, hence 'unsafe-inline' for styles and never for scripts; fonts
    # and icons are files; its requests are /api/, /auth/, the event stream and
    # the chat's stream, which the Ingress sends to the backend on the same
    # origin; the PrimeUI license is checked in the page, offline.
    # The assistant shows what a model writes as text; this policy is the
    # second line should that ever fail. An add_header in a location replaces
    # those of the server, so every location that serves the UI adds it.
    set $ui_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # The frontend's own health: answered by nginx, says nothing about the backend.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The API and the browser's login flows are the backend's, and the Ingress
    # sends them there. One that reaches this server all the same — an Ingress
    # that sends every path to the frontend — gets a problem that names the
    # cause (docs/adr/0047 D6), never the UI shell with a 200 and never an HTML
    # page: a body above nginx's 1m limit, refused before the location runs,
    # gets the same answer. ^~ keeps the static-file regex below from taking an
    # API path that ends in .png.
    location ^~ /api/ {
        error_page 404 413 =404 @misrouted;
        return 404;
    }
    location ^~ /auth/ {
        error_page 404 413 =404 @misrouted;
        return 404;
    }
    # The empty types block keeps nginx from typing the body by the path's
    # ending (….png would be image/png).
    location @misrouted {
        types { }
        default_type "application/problem+json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 404 '{"type":"https://cowork.dev/problems/not-found","title":"Not found","status":404,"detail":"the frontend serves the UI only; the Ingress must route /api/ and /auth/ to the backend Service","code":"not_found"}';
    }

    # The icons from public/ keep their names across builds: revalidated, never
    # immutable.
    location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $ui_csp always;
    }

    # Hashed bundles never change under their name.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $ui_csp always;
    }

    # The application shell: every path the router owns resolves to it, and it
    # is never cached, because it names the current bundle hashes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $ui_csp always;
    }
}

# nginx's own counts for the metrics exporter (docs/adr/0060 D7): the
# connections it holds, reads, writes and has handled, and the requests —
# nothing about a request, a path or a client. It listens on the loopback
# address only, so only a container of the same pod reaches it: the exporter
# sidecar the chart adds with frontend.metrics.exporter.enabled, which serves
# the counts to Prometheus. Without the sidecar nothing reads it.
server {
    listen       127.0.0.1:8082;
    server_name  _;
    server_tokens off;
    access_log   off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
