<main class="auth-page">
  <section class="card" aria-labelledby="password-title">
    <app-wordmark [height]="44" />
    <h1 id="password-title">{{ required() ? 'Choose your password' : 'Change your password' }}</h1>
    @if (required()) {
      <p class="muted lead" data-testid="password-required">
        The password you were given is temporary. Choose your own before you go on.
      </p>
    }
    <form class="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Current password</span>
        <input
          pInputPassword
          [(mask)]="masked"
          name="current"
          autocomplete="current-password"
          [ngModel]="current()"
          (ngModelChange)="current.set($event)"
          [fluid]="true"
          data-testid="password-current"
        />
        @if (errors()['current_password']; as error) {
          <small class="error">{{ error }}</small>
        }
      </label>
      <label class="field">
        <span>New password</span>
        <input
          pInputPassword
          [(mask)]="masked"
          name="next"
          autocomplete="new-password"
          [ngModel]="next()"
          (ngModelChange)="next.set($event)"
          [fluid]="true"
          data-testid="password-new"
        />
        @if (errors()['new_password']; as error) {
          <small class="error">{{ error }}</small>
        }
      </label>
      <label class="field">
        <span>New password, again</span>
        <input
          pInputPassword
          [(mask)]="masked"
          name="again"
          autocomplete="new-password"
          [ngModel]="again()"
          (ngModelChange)="again.set($event)"
          [fluid]="true"
          data-testid="password-again"
        />
        @if (mismatch()) {
          <small class="error" data-testid="password-mismatch">The two do not match.</small>
        }
      </label>
      <p class="muted hint">
        Length is what counts: a sentence you remember beats a short word with symbols.
      </p>
      <button
        pButton
        type="submit"
        [fluid]="true"
        [disabled]="!canSubmit()"
        data-testid="password-submit"
      >
        @if (busy()) {
          <i class="pi pi-spinner pi-spin"></i>
        }
        Save the password
      </button>
      <button
        type="button"
        class="reveal-all"
        (click)="masked.set(!masked())"
        data-testid="password-reveal"
      >
        {{ masked() ? 'Show the passwords' : 'Hide the passwords' }}
      </button>
    </form>
  </section>
</main>
