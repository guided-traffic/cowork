<section class="page">
  <app-project-header [project]="project()" />

  <div class="toolbar">
    @if (session.tenant(); as tenant) {
      @if (doneText(); as text) {
        <a
          class="done"
          [routerLink]="['/t', tenant, 'p', project(), 'backlog']"
          [queryParams]="{ closed: 'true', done_after: doneSince() }"
          pTooltip="These tickets in the backlog"
          [showDelay]="400"
          data-testid="done-count"
          ><i class="pi pi-check-circle" aria-hidden="true"></i>{{ text }}</a
        >
      }
    }
    <span class="spacer"></span>
    <span class="muted tabular" data-testid="card-count">{{ cardCount() }} on the board</span>
  </div>

  @if (failure(); as message) {
    <p class="failure" role="alert" data-testid="failure">{{ message }}</p>
  }

  @if (session.tenant(); as tenant) {
    <app-board-columns [view]="board()" [tenant]="tenant" [loading]="loading()" [reload]="reload" />
  }

  @if (moves.pendingTicket(); as ticket) {
    <app-move-dialog
      [ticket]="ticket"
      [request]="moves.pending()?.request ?? null"
      (closed)="moves.closed($event)"
    />
  }

  <p class="sr-only" role="status" aria-live="polite" data-testid="status">{{ moves.status() }}</p>
</section>
